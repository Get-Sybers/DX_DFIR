name: pin-sync

# Tracks upstream: when a pinned source (sources.yml) or the GoDFIR-toolz
# submodule moves, this opens/updates ONE pin-sync PR bumping every pin
# together — a tool contract and the lane role that speaks it can only move as
# a pair, and checks (test_contract_fit) + smoke validate the pair on the PR.
#
# The default GITHUB_TOKEN cannot trigger workflows on the PRs it creates; set
# the PIN_SYNC_TOKEN secret (a fine-grained PAT, contents + pull-requests
# write) so checks and smoke run on pin-sync PRs.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  pin-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PIN_SYNC_TOKEN || github.token }}

      - name: Sync pins to upstream heads
        run: ./scripts/sync-pins.sh

      - name: Open or update the pin-sync PR
        env:
          GH_TOKEN: ${{ secrets.PIN_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "pins already at upstream heads"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C pin-sync
          git commit -am "pins: sync sources.yml + GoDFIR-toolz to upstream heads"
          git push -f origin pin-sync
          open=$(gh pr list --head pin-sync --base main --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh pr create --base main --head pin-sync \
              --title "pins: sync to upstream heads" \
              --body "Automated pin sync: the sources.yml refs and the GoDFIR-toolz gitlink moved to their upstream heads together."
          else
            echo "pin-sync PR already open — the push updated it"
          fi
