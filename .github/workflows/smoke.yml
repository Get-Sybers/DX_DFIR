name: smoke

# Runs the pipeline for real and asserts CORRECTNESS — the coverage `checks`
# deliberately does not provide (issue #10). It processes sha256-pinned Sysmon
# .evtx through the real evtx lane (the dxdfir_evtx role running goevtx from
# its contract), normalises the output into materialised CAR with the external
# Byakugan engine (the dxdfir_byakugan role running the get-sybers/byakugan
# image built below at the BYAKUGAN_REF pin its Dockerfile carries), asserts every
# Sysmon-sourced CAR object has rows with its EvtxPayload-derived fields
# correctly populated, and runs the verify-car gate over the same tree.
# The EvtxPayload XML→JSON break that zeroed those fields passes `checks` but
# fails this.
#
# Kept OUT of the every-push `checks` job because it builds an image and runs
# real tools (minutes, not seconds). It runs:
#   - on PRs that touch the pipeline itself (the changes that can break it)
#   - nightly, as a standing regression signal
#   - on demand (workflow_dispatch)

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC nightly — a daily regression signal independent of pushes.
    - cron: "0 6 * * *"
  pull_request:
    paths:
      # The lanes the smoke test drives, and the shared skeleton they run through.
      - "ansible/collections/get_sybers.dxdfir/roles/dxdfir_lane/**"
      - "ansible/collections/get_sybers.dxdfir/roles/dxdfir_evtx/**"
      - "ansible/collections/get_sybers.dxdfir/roles/dxdfir_byakugan/**"
      - "ansible/collections/get_sybers.dxdfir/playbooks/dxdfir-process-evtx.yml"
      - "ansible/collections/get_sybers.dxdfir/playbooks/dxdfir-build-car.yml"
      - "ansible/collections/get_sybers.dxdfir/playbooks/dxdfir-verify-car.yml"
      - "ansible/collections/get_sybers.dxdfir/requirements.yml"
      - "ansible.cfg"
      - "python/get_sybers_dxdfir/images.py"
      - "python/pyproject.toml"
      # Every tool image (byakugan/goevtx included) builds from the GoDFIR-toolz
      # submodule, and the build wiring lives in the images role + manifest —
      # a submodule bump (the gitlink) or a manifest/pin change re-runs this.
      - "ansible/collections/get_sybers.dxdfir/roles/dxdfir_images/**"
      - "docker/GoDFIR-toolz"
      - "images.yml"
      # an engine bump is a pipeline change: the engine pins are ARG defaults
      # in the submodule's Dockerfiles, so it arrives as a gitlink change —
      # covered by the docker/GoDFIR-toolz path above.
      - ".gitmodules"
      - ".github/tests/smoke-test.sh"
      - "dev-scripts/fetch-samples.sh"
      - "dev-scripts/samples-manifest.tsv"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodule: docker/GoDFIR-toolz (every tool-image build context, the
          # canonical hardening playbook and every tool's contract.yml the roles
          # are driven from). The goevtx image built below comes from it, so
          # this MUST be recursive.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The smoke test drives the lanes with ansible-playbook. Installing the
      # package brings ansible-core (and the docker SDK community.docker's
      # modules import) under the python/constraints.txt lock; the collection's
      # pinned dependencies (community.docker for the image self-heal,
      # ansible.posix for the profile_tasks callback ansible.cfg enables) come
      # from requirements.yml.
      - name: Install the dxdfir package and the collection's dependencies
        run: |
          python -m pip install --quiet --constraint python/constraints.txt ./python
          ansible-galaxy collection install -r ansible/collections/get_sybers.dxdfir/requirements.yml

      # The images the pipeline runs — goevtx (the evtx lane's static-Go
      # parser) and the Byakugan engine image (cloned + built at its
      # Dockerfile's BYAKUGAN_REF pin, nothing provisioned on the runner) —
      # are built THROUGH the images role, exactly as `dxdfir build-docker`
      # builds them: same manifest contexts, same source stamp
      # (com.get-sybers.src), and the role's post-build hardening asserts
      # (static contract + the filesystem scan) now gate the CI builds too
      # instead of being bypassed by raw `docker build`. An engine bump is a
      # gitlink change, which the PR path filters above re-run this whole
      # pipeline against.
      - name: Build the goevtx + byakugan images (the images role, hardening asserted)
        run: |
          ansible-playbook \
            ansible/collections/get_sybers.dxdfir/playbooks/dxdfir-build-images.yml \
            -e '{"dxdfir_images_set": ["goevtx", "byakugan"]}'

      - name: Run the pipeline smoke test
        run: ./.github/tests/smoke-test.sh
