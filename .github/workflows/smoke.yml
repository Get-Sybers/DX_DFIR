name: smoke

# Runs the pipeline for real and asserts CORRECTNESS — the coverage `checks`
# deliberately does not provide (issue #10). It processes sha256-pinned Sysmon
# .evtx through the real evtx lane (EvtxECmd), normalises the output into
# materialised CAR with the external Byakugan engine (built into the
# get-sybers/byakugan image below at the commit byakugan.ref pins), asserts every
# Sysmon-sourced CAR object has rows
# with its EvtxPayload-derived fields correctly populated, and runs the
# verify-car gate over the same tree.
# The EvtxPayload XML→JSON break that zeroed those fields passes `checks` but
# fails this.
#
# Kept OUT of the every-push `checks` job because it builds an image and runs
# real tools (minutes, not seconds). It runs:
#   - on PRs that touch the pipeline itself (the changes that can break it)
#   - nightly, as a standing regression signal
#   - on demand (workflow_dispatch)

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC nightly — a daily regression signal independent of pushes.
    - cron: "0 6 * * *"
  pull_request:
    paths:
      - "python/get_sybers_dxdfir/evtx.py"
      - "python/get_sybers_dxdfir/imageexport.py"
      - "python/get_sybers_dxdfir/container.py"
      - "python/get_sybers_dxdfir/images.py"
      - "python/get_sybers_dxdfir/mitrecar.py"
      - "python/get_sybers_dxdfir/carcheck.py"
      - "python/pyproject.toml"
      # EvtxECmd + its image (and the shared hardening playbook) now live in the
      # GoDFIR-toolz submodule, and the build wiring lives in the images role —
      # both are covered by third_party/** and the role path below.
      - "ansible/collections/get_sybers.dxdfir/roles/dxdfir_images/**"
      # the CAR engine image (its Dockerfile + entrypoint binary) and the shared
      # in-image hardening playbook it uses.
      - "docker/byakugan/**"
      - "docker/hardening/**"
      # an engine bump is a pipeline change: byakugan.ref pins the external
      # Byakugan engine the CAR lane runs, so it must re-run this workflow.
      # third_party/** covers the piiat-mem AND GoDFIR-toolz submodules.
      - "byakugan.ref"
      - ".gitmodules"
      - "third_party/**"
      - ".github/tests/smoke-test.sh"
      - "dev-scripts/fetch-samples.sh"
      - "dev-scripts/samples-manifest.tsv"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodules: third_party/piiat-mem (volatility lane) and
          # third_party/GoDFIR-toolz (EvtxECmd + the EZ tool family + the
          # canonical hardening playbook). The EvtxECmd image built below comes
          # from the latter, so this MUST be recursive.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The smoke test drives the processors and the CAR lane directly
      # (python -m get_sybers_dxdfir.<module> on PYTHONPATH=python). Installing
      # the package brings its declared dependencies (PyYAML for the engine's
      # model sources, among others) under the python/constraints.txt lock;
      # nothing else is needed.
      - name: Install the dxdfir package
        run: python -m pip install --quiet --constraint python/constraints.txt ./python

      # The evtx lane runs goevtx (static-Go EvtxECmd substitute); build it once
      # here (the smoke test asserts its presence and fails loudly if absent).
      - name: Build the goevtx image
        run: docker build -t get-sybers/goevtx:latest -f third_party/GoDFIR-toolz/goevtx/Dockerfile third_party/GoDFIR-toolz/goevtx

      # The CAR lane (get_sybers_dxdfir.mitrecar) drives the external Byakugan
      # engine inside the get-sybers/byakugan image: the docker build clones the
      # engine at the byakugan.ref pin (first non-comment line) and, in its own
      # stages, checks out the engine's nested model submodules (third_party/car +
      # attack-datasources) and builds the Go parse binary — so nothing about the
      # engine is provisioned on the runner. byakugan.ref is in the PR path filters
      # above: bumping the pin re-runs this whole pipeline against the new engine.
      - name: Build the Byakugan engine image (at the byakugan.ref pin)
        run: |
          ref="$(grep -vE '^[[:space:]]*(#|$)' byakugan.ref | head -1 | tr -d '[:space:]')"
          test -n "$ref"
          # docker/hardening/harden.yml is gitignored — its canonical home is the
          # GoDFIR-toolz submodule, and the dxdfir_images preflight syncs it into
          # the docker/ build context. Do the same here so the raw `docker build`
          # can COPY hardening/harden.yml on a clean checkout.
          cp third_party/GoDFIR-toolz/hardening/harden.yml docker/hardening/harden.yml
          docker build -t get-sybers/byakugan:latest --build-arg BYAKUGAN_REF="$ref" -f docker/byakugan/Dockerfile docker

      - name: Run the pipeline smoke test
        run: ./.github/tests/smoke-test.sh
