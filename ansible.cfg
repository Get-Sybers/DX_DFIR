# read from the repo root (the dxdfir CLI runs from here)
[defaults]
# default inventory: the workstation; the CLI's -i localhost, is equivalent (group_vars are playbook-adjacent)
inventory = ansible/inventory
# every run appended; logs/ is gitignored, rotate freely
log_path = logs/ansible.log
# per-task timing (ansible.posix ships with the supported install)
callbacks_enabled = ansible.posix.profile_tasks
# deploy roles : the build galaxy in place from the submodule : the degraded
# galaxy-import path LAST (docs/reference/repository-map.md) — order wins
roles_path = ansible/collections/get_sybers.dxdfir/roles:docker/GoDFIR-toolz/roles:/opt/dxdfir/collections/ansible_collections/get_sybers/godfir_toolz/roles
# the pinned install path first; user/system paths follow for dev hosts
collections_path = /opt/dxdfir/collections:~/.ansible/collections:/usr/share/ansible/collections
# upstream shim deprecations, not this repo's
deprecation_warnings = False
