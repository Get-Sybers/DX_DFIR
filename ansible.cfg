# DX_DFIR ansible defaults — read from the repo root (ansible resolves
# ansible.cfg from the cwd; the dxdfir CLI runs from here).
[defaults]
# The explicit default inventory (the workstation itself; remote targets
# join there). The CLI passes -i localhost, — equivalent, since the shared
# wiring lives in playbook-adjacent group_vars that load under any inventory.
inventory = ansible/inventory
# Persistent execution log: every playbook run is appended, so troubleshooting
# never depends on terminal scrollback. logs/ is gitignored (only .gitkeep is
# tracked); rotate or clear it freely.
log_path = logs/ansible.log
# Per-task timing in run output (ansible.posix ships with the supported install).
callbacks_enabled = ansible.posix.profile_tasks
# The collections' roles resolve without installing anything: the deploy
# galaxy's own roles first, then the BUILD galaxy's straight from the
# GoDFIR-toolz submodule checkout at the gitlink pin — one tree, no copy,
# nothing to drift or reinstall on a bump. The LAST entry is the degraded
# path only: a checkout without the submodule has the build galaxy imported
# by ansible-galaxy from its .gitmodules source at the gitlink revision
# (setup-environment.sh), and its roles resolve from that shared install —
# the submodule entry, when present, always wins by order.
roles_path = ansible/collections/get_sybers.dxdfir/roles:docker/GoDFIR-toolz/roles:/opt/dxdfir/collections/ansible_collections/get_sybers/godfir_toolz/roles
# Pinned dependencies (requirements.yml) installed by setup-environment.sh land
# in the fixed shared path first; the standard user/system paths follow so dev
# hosts with distro-installed collections keep working.
collections_path = /opt/dxdfir/collections:~/.ansible/collections:/usr/share/ansible/collections
# Suppress ansible-core's internal shim deprecations (upstream, not this repo).
deprecation_warnings = False
