# DX_DFIR ansible defaults — read from the repo root (ansible resolves
# ansible.cfg from the cwd; the dxdfir CLI runs from here).
[defaults]
# The explicit default inventory (the workstation itself; remote targets
# join there). The CLI passes -i localhost, — equivalent, since the shared
# wiring lives in playbook-adjacent group_vars that load under any inventory.
inventory = ansible/inventory
# Persistent execution log: every playbook run is appended, so troubleshooting
# never depends on terminal scrollback. logs/ is gitignored (only .gitkeep is
# tracked); rotate or clear it freely.
log_path = logs/ansible.log
# Per-task timing in run output (ansible.posix ships with the supported install).
callbacks_enabled = ansible.posix.profile_tasks
# The collection's roles resolve without installing the collection.
roles_path = ansible/collections/get_sybers.dxdfir/roles
# The repo-local collections tree comes FIRST: it holds the committed symlink
# ansible_collections/get_sybers/godfir_toolz -> docker/GoDFIR-toolz, so the
# BUILD galaxy resolves IN PLACE from the submodule checkout at the gitlink
# pin — no installed copy, no tarball, nothing to drift or reinstall on a
# bump. Pinned external dependencies (requirements.yml) installed by
# setup-environment.sh land in the fixed shared path next; the standard
# user/system paths follow so dev hosts with distro-installed collections
# keep working.
collections_path = ansible/collections:/opt/dxdfir/collections:~/.ansible/collections:/usr/share/ansible/collections
# Suppress ansible-core's internal shim deprecations (upstream, not this repo).
deprecation_warnings = False
