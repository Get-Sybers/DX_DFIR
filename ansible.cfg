# read from the repo root (the dxdfir CLI runs from here)
[defaults]
# ansible's own state home — its local temp (galaxy downloads, module
# staging), galaxy cache and token, persistent-connection sockets — in the
# checkout (.ansible/, gitignored), not ~/.ansible: nothing of the pipeline
# lands in the invoking user's home
home = .ansible
# default inventory: the workstation; the CLI's -i localhost, is equivalent (group_vars are playbook-adjacent)
inventory = ansible/inventory
# every run appended; logs/ is gitignored, rotate freely
log_path = logs/ansible.log
# per-task timing (ansible.posix ships with the supported install)
callbacks_enabled = ansible.posix.profile_tasks
# deploy roles : the build galaxy in place from the submodule : the degraded
# galaxy-import path LAST (docs/reference/repository-map.md) — order wins
roles_path = ansible/collections/get_sybers.dxdfir/roles:docker/GoDFIR-toolz/roles:.ansible/collections/ansible_collections/get_sybers/godfir_toolz/roles
# the checkout's own install (scripts/setup-environment.sh, .ansible/collections)
# first; user/system paths follow for dev hosts
collections_path = .ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
# upstream shim deprecations, not this repo's
deprecation_warnings = False

[inventory]
# ansible/inventory/secrets holds the deploy's generated credential files
# (gitignored, README only in the repo) — data the roles read, never an
# inventory source; without this every run warns "Unable to parse ... secrets"
ignore_patterns = secrets
