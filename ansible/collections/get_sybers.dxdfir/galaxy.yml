---
namespace: get_sybers
name: dfir
version: 0.6.0
readme: README.md
repository: https://github.com/Get-Sybers/DX_DFIR
issues: https://github.com/Get-Sybers/DX_DFIR/issues
authors:
  - Get-Sybers
description: >-
  DX_DFIR forensic processing pipeline as Ansible roles. Each role invokes the
  get_sybers_dxdfir Python package as a single action; the playbook decides
  which roles run.
license:
  - MIT
tags:
  - dfir
  - forensics
  - security
dependencies:
  # Bounded below the next major so a Galaxy install can't pull a breaking 4.x;
  # requirements.yml pins the exact tested version (3.10.3) for reproducible installs.
  community.docker: ">=3.10.3,<4.0.0"
  ansible.posix: ">=2.1.0,<3.0.0"
build_ignore:
  - "roles/*/molecule"
  - "*.pyc"
