---
namespace: get_sybers
name: dfir
version: 0.6.0
readme: README.md
repository: https://github.com/Get-Sybers/DX_DFIR
issues: https://github.com/Get-Sybers/DX_DFIR/issues
authors:
  - Get-Sybers
description: >-
  DX_DFIR forensic processing pipeline as Ansible roles. Each role invokes the
  get_sybers_dxdfir Python package as a single action; the playbook decides
  which roles run.
license:
  - MIT
tags:
  - dfir
  - forensics
  - security
dependencies:
  # Bounded below the next major so a Galaxy install can't pull a breaking 4.x;
  # requirements.yml pins the exact tested version (3.10.3) for reproducible installs.
  community.docker: ">=3.10.3,<4.0.0"
  ansible.posix: ">=2.1.0,<3.0.0"
  community.crypto: ">=2.26.9,<3.0.0"
  # The BUILD galaxy: dxdfir_images delegates image building to its
  # godfir_build role, which resolves IN PLACE from the SUBMODULE checkout
  # (docker/GoDFIR-toolz/roles on the repo-root roles_path; a checkout
  # without the submodule gets the galaxy imported by ansible-galaxy from
  # its .gitmodules source at the gitlink revision instead). The exact pin
  # is the gitlink, not a version — hence no requirements.yml entry; this
  # range serves galaxy-mode consumers of the packaged collection.
  get_sybers.godfir_toolz: ">=0.1.0,<1.0.0"
build_ignore:
  - "roles/*/molecule"
  - "*.pyc"
