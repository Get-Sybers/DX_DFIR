---
# Build (and hardening-verify) the get-sybers/* tool images — the images role
# delegating to the GoDFIR-toolz build galaxy over the submodule's images.yml
# manifest (no set given = every manifest image). Run before first processing
# on a fresh host, or after a submodule (gitlink) bump.
- name: Build the hardened DX_DFIR tool images
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "build-images | run dxdfir_images"
      ansible.builtin.include_role:
        name: dxdfir_images
