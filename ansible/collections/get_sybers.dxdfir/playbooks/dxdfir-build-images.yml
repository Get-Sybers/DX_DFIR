---
# Build (and hardening-verify) the get-sybers/* tool images from their in-repo,
# ansible-hardened Dockerfiles. Run before first processing on a fresh host,
# or after changing anything under docker/.
- name: Build the hardened DX_DFIR tool images
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "build-images | run dxdfir_images"
      ansible.builtin.include_role:
        name: dxdfir_images
