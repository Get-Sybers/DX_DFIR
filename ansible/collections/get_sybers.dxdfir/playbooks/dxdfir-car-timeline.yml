---
# The playbook holds the decisions; the role groups, the tasks act.
- name: "DFIR | build a unified time-ordered CAR timeline"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-car-timeline | run the car role (timeline)"
      ansible.builtin.include_role:
        name: dxdfir_car
      vars:
        dxdfir_car_action: timeline
