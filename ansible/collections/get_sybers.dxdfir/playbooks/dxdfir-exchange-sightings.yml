---
# The playbook holds the decisions; the role groups, the tasks act.
- name: "DFIR | turn indicator-match alerts into STIX sightings pushed back to OpenCTI"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-exchange-sightings | run the exchange role (sightings)"
      ansible.builtin.include_role:
        name: dxdfir_exchange
      vars:
        dxdfir_exchange_action: sightings
