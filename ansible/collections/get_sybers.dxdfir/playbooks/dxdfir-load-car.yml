---
# The playbook holds the decisions; the role groups, the tasks act.
- name: "DFIR | bulk-load the materialised CAR into the Elastic stack"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-load-car | run the car-load role (load)"
      ansible.builtin.include_role:
        name: dxdfir_car_load
      vars:
        dxdfir_car_load_action: load
