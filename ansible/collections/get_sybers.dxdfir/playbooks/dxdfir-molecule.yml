---
# The playbook holds the decisions. Containerised molecule against the HOST
# daemon: the repo and /tmp are mounted at identical paths, so every bind a
# role hands the daemon is valid on the host. A role whose operator-supplied
# fixture is absent is SKIPPED with a note, never failed.
- name: "DFIR | run the collection's molecule scenarios, containerised"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: false
  vars:
    dxdfir_molecule_repo_root: "{{ playbook_dir | dirname | dirname | dirname | dirname }}"
    # the containerised molecule runner, PULLED from the registry — never built
    # here. GoDFIR-toolz images.yml lists get-sybers/molecule under
    # non_tool_repos and godfir_build is explicit that consumers pull the
    # published images and do not build. The pull goes through
    # get_sybers.godfir_run.godfir_images (below), so the registry
    # (ghcr.io/get-sybers/godfir-toolz) is sourced there, not reproduced here;
    # this is the local name the run uses. Pinned by tag, never :latest (§31).
    dxdfir_molecule_image: get-sybers/molecule:26.9.0-r2
    # The per-tool lane scenarios moved upstream with the run machinery: the
    # get_sybers.godfir_run lanes are molecule-tested in that collection and the
    # playbooks include them DIRECTLY (group_vars wires their godfir_* inputs).
    # What remains DX_DFIR-specific is evidence discovery, tested offline here.
    dxdfir_molecule_roles:
      - dxdfir_evidence
      - dxdfir_stack
  tasks:
    - name: "dxdfir-molecule | the runner image is present (pulled from the registry, never built)"
      ansible.builtin.include_role:
        name: get_sybers.godfir_run.godfir_images
        tasks_from: ensure_present
      vars:
        godfir_images_required: ["{{ dxdfir_molecule_image }}"]
        # the runner is a non_tool_repo (no `release:` in images.yml), so pin its
        # tag from the ref above; ensure_present pulls <registry>/molecule:<tag>
        # and tags it to this local name
        godfir_images_tag: "{{ dxdfir_molecule_image | regex_replace('^.*:', '') }}"

    - name: "dxdfir-molecule | resolve each scenario's fixture requirement"
      ansible.builtin.set_fact:
        dxdfir_molecule_plan: >-
          {{ dxdfir_molecule_plan | default([]) + [{
               'role': item,
               'fixture_var': (dxdfir_molecule_fixtures[item] | default({})).var | default(''),
               'fixture': (dxdfir_molecule_fixtures[item] | default({'value': 'n/a'})).value | default('n/a'),
             }] }}
      vars:
        # no role needs an operator-supplied binary fixture any more (the lanes
        # that did are tested upstream); dxdfir_evidence ships its own tree fixture
        dxdfir_molecule_fixtures: {}
      loop: "{{ dxdfir_molecule_roles }}"

    - name: "dxdfir-molecule | note every skipped scenario (fixture not provided)"
      ansible.builtin.debug:
        msg: >-
          skipped {{ item.role }} — provide {{ item.fixture_var }}
          (binary fixture, not shipped; see the role README)
      loop: "{{ dxdfir_molecule_plan | selectattr('fixture', 'equalto', '') | list }}"
      loop_control:
        label: "{{ item.role }}"

    # no self-judgement here: the verdict is taken over the registered LIST below
    - name: "dxdfir-molecule | molecule test, one containerised run per role"
      community.docker.docker_container:
        name: "dxdfir-molecule-{{ item.role }}"
        image: "{{ dxdfir_molecule_image }}"
        pull: false
        detach: false
        cleanup: true
        output_logs: true
        working_dir: "{{ dxdfir_molecule_repo_root }}/ansible/collections/get_sybers.dxdfir/roles/{{ item.role }}"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "{{ dxdfir_molecule_repo_root }}:{{ dxdfir_molecule_repo_root }}"
          - "/tmp:/tmp"
        command: >-
          molecule test{{ '' if item.fixture == 'n/a'
             else ' -- -e ' ~ item.fixture_var ~ '=' ~ item.fixture }}
      loop: "{{ dxdfir_molecule_plan | rejectattr('fixture', 'equalto', '') | list }}"
      loop_control:
        label: "{{ item.role }}"
      register: dxdfir_molecule_results
      failed_when: false

    - name: "dxdfir-molecule | judge each scenario"
      ansible.builtin.assert:
        that:
          - item.status | default(1) | int == 0
        fail_msg: >-
          {{ item.item.role }} molecule test FAILED
          (rc={{ item.status | default('?') }}
          {{ item.msg | default('') }}):
          {{ (item.container.Output | default(''))[-1500:] }}
        quiet: true
      loop: "{{ dxdfir_molecule_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.role }} rc={{ item.status | default('?') }}"
      when: dxdfir_molecule_results is not skipped

    - name: "dxdfir-molecule | summary"
      ansible.builtin.debug:
        msg: >-
          molecule: {{ dxdfir_molecule_plan | rejectattr('fixture', 'equalto', '') | list | length }} passed,
          {{ dxdfir_molecule_plan | selectattr('fixture', 'equalto', '') | list | length }} skipped (missing fixtures)
