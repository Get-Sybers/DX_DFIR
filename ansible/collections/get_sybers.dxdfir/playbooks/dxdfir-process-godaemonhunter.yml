---
# The playbook holds the decisions; the imported get_sybers.godfir_run lane
# reads its godfir_* inputs straight from group_vars (evidence geography) —
# no wrapper role, no second variable namespace.
- name: "DFIR | process Linux hosts with godaemonhunter (loose logs + disk-image surfaces)"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-process-godaemonhunter | discover the evidence (disk images + linux hosts)"
      ansible.builtin.include_role:
        name: dxdfir_evidence
      vars:
        dxdfir_evidence_host_dir: "{{ dxdfir_linux_dir }}"

    - name: "dxdfir-process-godaemonhunter | run the godaemonhunter lane"
      ansible.builtin.include_role:
        name: get_sybers.godfir_run.godfir_godaemonhunter
