---
# The playbook holds the decisions. It selects the role and passes the pipeline;
# the role groups, the tasks act (one-action-per-task).
- name: "DFIR | process Windows hosts with gowindowlicker (event logs + disk-image artefacts)"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-process-gowindowlicker | run the gowindowlicker role"
      ansible.builtin.include_role:
        name: dxdfir_gowindowlicker
