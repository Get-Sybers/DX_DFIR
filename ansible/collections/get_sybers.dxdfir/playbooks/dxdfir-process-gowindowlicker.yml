---
# The playbook holds the decisions; the imported get_sybers.godfir_run lane
# reads its godfir_* inputs straight from group_vars (evidence geography) —
# no wrapper role, no second variable namespace.
- name: "DFIR | process Windows hosts with gowindowlicker (event logs + disk-image artefacts)"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-process-gowindowlicker | discover the evidence (disk images + winevt hosts)"
      ansible.builtin.include_role:
        name: dxdfir_evidence
      vars:
        dxdfir_evidence_host_dir: "{{ dxdfir_winevt_dir }}"

    - name: "dxdfir-process-gowindowlicker | run the gowindowlicker lane"
      ansible.builtin.include_role:
        name: get_sybers.godfir_run.godfir_gowindowlicker
