---
# The playbook holds the decisions. It selects the role;
# the role groups, the tasks act (one-action-per-task).
- name: "DFIR | process disk images / VM exports with Plaso"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-process-plaso | run the plaso role"
      ansible.builtin.include_role:
        name: dxdfir_plaso
