---
# The playbook holds the decisions; the role groups, the tasks act.
# Drives the dxdfir_stack role around docker/elastic.
- name: "DFIR | stack deploy"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-stack-deploy | run the stack role (deploy)"
      ansible.builtin.include_role:
        name: dxdfir_stack
      vars:
        dxdfir_stack_action: deploy
        # deploy's decisions: an absent stack is its normal starting point
        # (dxdfir_stack_when_absent stays `continue`); an engine-less host
        # gets docker installed and a stopped daemon started; images will
        # be pulled, so gate capacity first. Secrets and TLS material come
        # from the inventory layer (group_vars dxdfir_elastic_*) on every
        # deploy — nothing to opt into.
        dxdfir_stack_install_docker: true
        dxdfir_stack_start_docker: true
        dxdfir_stack_pull_gate: true
