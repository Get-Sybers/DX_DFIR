---
# The playbook holds the decisions; the role groups, the tasks act.
# Drives the dxdfir_stack role around docker/elastic.
- name: "DFIR | stack start"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-stack-start | run the stack role (start)"
      ansible.builtin.include_role:
        name: dxdfir_stack
      vars:
        dxdfir_stack_action: start
        # start's decisions: it starts an EXISTING stack, so an absent one is
        # flagged (deploy is the verb that creates — and the one that installs
        # a missing engine); a stopped docker daemon is started, and a start
        # may still pull, so gate capacity first.
        dxdfir_stack_when_absent: fail
        dxdfir_stack_start_docker: true
        dxdfir_stack_pull_gate: true
