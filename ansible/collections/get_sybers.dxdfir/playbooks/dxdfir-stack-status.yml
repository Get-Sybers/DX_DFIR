---
# The playbook holds the decisions; the role groups, the tasks act.
# Drives the dxdfir_stack role over the inventory-defined analysis stack.
- name: "DFIR | stack status"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-stack-status | run the stack role (status)"
      ansible.builtin.include_role:
        name: dxdfir_stack
      vars:
        dxdfir_stack_action: status
        # status's decision: an absent stack is the ANSWER — report "no
        # stack" and end cleanly, never a failure and never a reason to
        # touch the env.
        dxdfir_stack_when_absent: report
