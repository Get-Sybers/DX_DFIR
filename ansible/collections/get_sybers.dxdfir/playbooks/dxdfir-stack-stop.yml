---
# The playbook holds the decisions; the role groups, the tasks act.
# Drives the dxdfir_stack role around docker/elastic.
- name: "DFIR | stack stop"
  hosts: "{{ dxdfir_hosts | default('localhost') }}"
  connection: "{{ dxdfir_connection | default('local') }}"
  gather_facts: true
  tasks:
    - name: "dxdfir-stack-stop | run the stack role (stop)"
      ansible.builtin.include_role:
        name: dxdfir_stack
      vars:
        dxdfir_stack_action: stop
        # stop's decision: an absent stack is flagged — nothing to stop.
        dxdfir_stack_when_absent: fail
