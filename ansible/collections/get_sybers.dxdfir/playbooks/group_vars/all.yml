---
# The inventory-layer wiring of the Elastic analysis backend — the one
# definition every role references (roles keep bare-run fallbacks; inventory
# wins; host_vars/vault beat this file; -e beats everything). Playbook-adjacent
# so it loads for every run whatever inventory is passed (the CLI's
# `-i localhost,` included). Semantics: roles/dxdfir_stack/README.md.

# in-tree execution is the supported layout (docs/reference/ansible-standards.md)
dxdfir_repo_root: "{{ playbook_dir }}/../../../.."

# ---- identity
dxdfir_elastic_stack_name: byakugan
dxdfir_elastic_label_key: com.get-sybers.stack
dxdfir_elastic_legacy_project: byakugan

# ---- images and topology
# the ONE Elastic pin; every stack image rides it
dxdfir_elastic_version: "9.4.3"
dxdfir_elastic_images:
  elasticsearch: "docker.elastic.co/elasticsearch/elasticsearch:{{ dxdfir_elastic_version }}"
  kibana: "docker.elastic.co/kibana/kibana:{{ dxdfir_elastic_version }}"
  fleet-server: "docker.elastic.co/elastic-agent/elastic-agent:{{ dxdfir_elastic_version }}"
  filebeat: "docker.elastic.co/beats/filebeat:{{ dxdfir_elastic_version }}"
dxdfir_elastic_network: byakugan_default
dxdfir_elastic_volumes:
  certs: byakugan_certs
  esdata: byakugan_esdata
  kibanadata: byakugan_kibanadata
  fleetdata: byakugan_fleetdata
  filebeatdata: byakugan_filebeatdata
dxdfir_elastic_bind: 127.0.0.1
dxdfir_elastic_es_port: 9200
dxdfir_elastic_kibana_port: 5601
dxdfir_elastic_fleet_port: 8220
dxdfir_elastic_es_heap: 1g
dxdfir_elastic_namespace: default
dxdfir_elastic_ingest_dir: "{{ dxdfir_repo_root }}/data_store/processed"

# ---- secrets: file-backed, generated once, operator-overridable (rotation: stack README)
dxdfir_elastic_secrets_dir: "{{ dxdfir_repo_root }}/ansible/inventory/secrets/{{ inventory_hostname }}"
dxdfir_elastic_password: >-
  {{ lookup('ansible.builtin.password',
            dxdfir_elastic_secrets_dir ~ '/elastic_password length=24 chars=ascii_letters,digits') }}
dxdfir_elastic_kibana_system_password: >-
  {{ lookup('ansible.builtin.password',
            dxdfir_elastic_secrets_dir ~ '/kibana_system_password length=24 chars=ascii_letters,digits') }}
dxdfir_elastic_byakugan_loader_password: >-
  {{ lookup('ansible.builtin.password',
            dxdfir_elastic_secrets_dir ~ '/byakugan_loader_password length=24 chars=ascii_letters,digits') }}
# Kibana encryption keys (>= 32 chars; Fleet needs the saved-objects one)
dxdfir_elastic_kibana_saved_objects_key: >-
  {{ lookup('ansible.builtin.password',
            dxdfir_elastic_secrets_dir ~ '/kibana_saved_objects_key length=64 chars=ascii_letters,digits') }}
dxdfir_elastic_kibana_security_key: >-
  {{ lookup('ansible.builtin.password',
            dxdfir_elastic_secrets_dir ~ '/kibana_security_key length=64 chars=ascii_letters,digits') }}
dxdfir_elastic_kibana_reporting_key: >-
  {{ lookup('ansible.builtin.password',
            dxdfir_elastic_secrets_dir ~ '/kibana_reporting_key length=64 chars=ascii_letters,digits') }}
# empty = fleet-server requests one from Kibana with the elastic credentials on first boot
dxdfir_elastic_fleet_service_token: ""

# ---- deploy artifacts (the contract for tools outside ansible)
dxdfir_elastic_env_file: "{{ dxdfir_elastic_secrets_dir }}/elastic.env"
dxdfir_elastic_certs_dir: "{{ dxdfir_elastic_secrets_dir }}/certs"
dxdfir_elastic_ca_file: "{{ dxdfir_elastic_certs_dir }}/ca/ca.crt"
# the compose-era operator .env: read once by deploy to import secrets, never written, never required
dxdfir_elastic_legacy_env_file: "{{ dxdfir_repo_root }}/docker/elastic/.env"
