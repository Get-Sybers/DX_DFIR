---
# The workstation's host vars — PLAYBOOK-ADJACENT so they apply under every
# inventory source: the default ansible/inventory (ansible.cfg) and the
# front-end's `-i localhost,` alike. An inventory-file var would not reach a
# `-i localhost,` run (the host is a fresh entry), and the play would then
# discover a different python without the module deps.
#
# The interpreter running ansible-playbook — the venv's: its site-packages
# hold the module deps the collections import on the controller
# (cryptography for community.crypto, the docker SDK). Interpreter discovery
# lands on the system python, which has neither.
ansible_python_interpreter: "{{ ansible_playbook_python }}"

# Where the stack's published ports bind. The inventory default (group_vars,
# 127.0.0.1) keeps the stack loopback-only; the workstation publishes it on
# its primary address instead so a browser on the LAN reaches Kibana at
# http://<this host's ip>:5601. The role derives the TLS IP SAN and Kibana's
# public base URL from the same value, and docker then publishes ONLY on that
# address — 127.0.0.1:<port> no longer answers; use the host's ip there too.
# Elasticsearch (TLS + auth) and Fleet Server follow onto the same address.
dxdfir_elastic_bind: "{{ ansible_default_ipv4['address'] }}"
