---
# Pinned — never :latest, never a bare branch (ANSIBLE-STANDARDS: infra galaxy §2).
collections:
  - name: community.docker
    version: "3.10.3"
  # ansible.cfg enables the ansible.posix.profile_tasks callback for per-task
  # timing on every run — a runtime dependency, not a nice-to-have.
  - name: ansible.posix
    version: "2.1.0"
  # dxdfir_stack generates the stack's CA + node certificates host-side as
  # state modules (no cert scripts); needs the `cryptography` python lib on
  # the target, which ansible-core itself already depends on.
  - name: community.crypto
    version: "2.26.9"
  # The BUILD galaxy: GoDFIR-toolz supplies the image inventory (images.yml)
  # and the godfir_build role dxdfir_images delegates to — installed FROM THE
  # SUBMODULE, so the gitlink stays the only pin (no version here on purpose:
  # the checked-out submodule IS the version). The dir path resolves against
  # the CWD of the ansible-galaxy run: install from the repo root, as
  # setup-environment.sh and CI do.
  - name: docker/GoDFIR-toolz
    type: dir
