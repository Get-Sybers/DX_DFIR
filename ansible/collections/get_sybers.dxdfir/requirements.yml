---
# Pinned — never :latest, never a bare branch (ANSIBLE-STANDARDS: infra galaxy §2).
collections:
  - name: community.docker
    version: "3.10.3"
  # ansible.cfg enables the ansible.posix.profile_tasks callback for per-task
  # timing on every run — a runtime dependency, not a nice-to-have.
  - name: ansible.posix
    version: "2.1.0"
  # dxdfir_stack generates the stack's CA + node certificates host-side as
  # state modules (no cert scripts); needs the `cryptography` python lib on
  # the target, which ansible-core itself already depends on.
  - name: community.crypto
    version: "2.26.9"
  # NOT here: the BUILD galaxy (get_sybers.godfir_toolz — the image inventory
  # and the godfir_build role dxdfir_images delegates to). Its pin is the
  # GITLINK and it is never installed as a copy: the committed symlink
  # ansible/collections/ansible_collections/get_sybers/godfir_toolz resolves
  # it IN PLACE from the submodule checkout (repo-root ansible.cfg puts that
  # tree first on collections_path). Only a checkout without the submodule
  # falls back to importing it from the source the repo root declares
  # (.gitmodules URL at the gitlink revision — setup-environment.sh). Its
  # dependency range is satisfied by the exact pins above.
