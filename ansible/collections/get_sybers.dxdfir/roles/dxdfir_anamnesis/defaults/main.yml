---
# Discovery only — the run spec + gate live in get_sybers.godfir_run.godfir_anamnesis.
dxdfir_anamnesis_repo_root: "{{ role_path }}/../../../../.."
dxdfir_anamnesis_memory_lane: >-
  {{ ((lookup('file', dxdfir_anamnesis_repo_root ~ '/evidence-taxonomy/memory.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('memory', true) }}
dxdfir_anamnesis_memory_dir: "{{ dxdfir_anamnesis_repo_root }}/data_store/raw/{{ dxdfir_anamnesis_memory_lane }}"
dxdfir_anamnesis_collection: ""
dxdfir_anamnesis_out_dir: >-
  {{ dxdfir_anamnesis_repo_root }}/data_store/processed/anamnesis{{
  ('/' ~ dxdfir_anamnesis_collection) if dxdfir_anamnesis_collection | length > 0 else '' }}
# the persistent symbol cache (symsrv layout): accumulates across runs
dxdfir_anamnesis_symbols_dir: "{{ dxdfir_anamnesis_repo_root }}/data_store/dependencies/memprocfs-symbols"
dxdfir_anamnesis_image: ""
dxdfir_anamnesis_force: false
dxdfir_anamnesis_plugins: ""
