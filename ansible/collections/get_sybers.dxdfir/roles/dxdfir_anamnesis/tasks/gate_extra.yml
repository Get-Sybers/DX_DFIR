---
# memory output gate, included at the end of dxdfir_lane's process block: some
# plugin produced output, UNLESS there were no images (images == 0). Per-plugin
# failures are NORMAL (Windows plugins error without symbols), so this gates on
# output, not failed==0 (dxdfir_lane_require_no_failures is false for this lane). A
# trusted literal assert — dxdfir_lane_summaries (one per run; this lane has one)
# + dxdfir_lane_verify are in scope from the shared process step. The anamnesis
# summary counts its inputs as `images`.
- name: "anamnesis-process | assert output was produced for the images present"
  ansible.builtin.assert:
    that:
      - dxdfir_lane_verify.matched | int > 0 or (dxdfir_lane_summaries | first).images | int == 0
    fail_msg: >-
      memory produced no JSONL at all though memory images were present (symbols
      unavailable for every plugin?).
    quiet: true
