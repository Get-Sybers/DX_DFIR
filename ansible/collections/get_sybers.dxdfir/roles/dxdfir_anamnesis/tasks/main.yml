---
# dxdfir_anamnesis: discover the memory tree + symbol cache and delegate the
# confined run to get_sybers.godfir_run.godfir_anamnesis (imported by URL).
- name: "anamnesis | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_anamnesis_memory_dir | length > 0
    fail_msg: "dxdfir_anamnesis needs a non-empty dxdfir_anamnesis_memory_dir."
    quiet: true
  tags: [always]

- name: "anamnesis | run the get-sybers anamnesis lane"
  ansible.builtin.include_role:
    name: get_sybers.godfir_run.godfir_anamnesis
  vars:
    godfir_anamnesis_memory_dir: "{{ dxdfir_anamnesis_memory_dir }}"
    godfir_anamnesis_out_dir: "{{ dxdfir_anamnesis_out_dir }}"
    godfir_anamnesis_symbols_dir: "{{ dxdfir_anamnesis_symbols_dir }}"
    godfir_anamnesis_image: "{{ dxdfir_anamnesis_image }}"
    godfir_anamnesis_force: "{{ dxdfir_anamnesis_force }}"
    godfir_anamnesis_plugins: "{{ dxdfir_anamnesis_plugins }}"
  tags: [always]
