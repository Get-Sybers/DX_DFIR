---
# Discovery/orchestration only — the confined CAR run lives in
# get_sybers.godfir_run.godfir_byakugan (build/verify/timeline). This role
# resolves the processed + CAR trees and delegates the chosen action.
dxdfir_byakugan_action: build
dxdfir_byakugan_repo_root: "{{ role_path }}/../../../../.."

# the processed tree build reads, and the materialised CAR tree
dxdfir_byakugan_processed_dir: "{{ dxdfir_byakugan_repo_root }}/data_store/processed"
dxdfir_byakugan_dir: "{{ dxdfir_byakugan_repo_root }}/data_store/processed/byakugan"
dxdfir_byakugan_image: ""

# build: rebuild sources whose stores already exist; also derived + STIX passes
dxdfir_byakugan_rebuild: false
dxdfir_byakugan_derive: false
dxdfir_byakugan_stix: false

# timeline: source, destination (empty = beside the stores) and filters
dxdfir_byakugan_timeline_dir: "{{ dxdfir_byakugan_dir }}"
dxdfir_byakugan_timeline_out_dir: ""
dxdfir_byakugan_timeline_force: false
dxdfir_byakugan_timeline_host: ""
dxdfir_byakugan_timeline_after: ""
dxdfir_byakugan_timeline_before: ""

# verify: where verify.txt lands (empty = beside the stores)
dxdfir_byakugan_verify_out_dir: ""
