---
# dxdfir_byakugan: materialise + verify + timeline the MITRE CAR from processed evidence.
# One role, three actions (dxdfir_byakugan_action); the playbook picks the action.

# Which CAR action to run: build (materialise stores), verify (correctness gate),
# or timeline (unified time-ordered CAR).
dxdfir_byakugan_action: build

# Repo root is five levels up from this role
# (roles/dxdfir_byakugan -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_byakugan_repo_root: "{{ role_path }}/../../../../.."

# Processed evidence tree the batch build reads from, and the materialised CAR tree.
dxdfir_byakugan_processed_dir: "{{ dxdfir_byakugan_repo_root }}/data_store/processed"
dxdfir_byakugan_dir: "{{ dxdfir_byakugan_repo_root }}/data_store/processed/byakugan"

# The tool contract the actions are driven from — the single source of truth
# for the byakugan image's per-sub-tool env vars (BYAKUGAN_BUILD_*,
# BYAKUGAN_TIMELINE_*, BYAKUGAN_VERIFY_*) and mounts (/input ro, /output). The
# external Byakugan engine is cloned + built into the image at the repo-root
# sources.yml pin.
dxdfir_byakugan_contract: "{{ dxdfir_byakugan_repo_root }}/docker/GoDFIR-toolz/byakugan/contract.yml"
# Empty = the contract's image (get-sybers/byakugan:latest); set to pin a digest.
dxdfir_byakugan_image: ""
# PYTHONPATH for the image supply-chain guard (get_sybers_dxdfir.images); a
# deployed run installs the package instead.
dxdfir_byakugan_python_path: "{{ dxdfir_byakugan_repo_root }}/python"

# build: rebuild sources whose car_relationships.jsonl already exists (BYAKUGAN_BUILD_FORCE).
dxdfir_byakugan_rebuild: false
# build: also run the derived relationship pass into car_inferred.jsonl (BYAKUGAN_BUILD_DERIVE).
dxdfir_byakugan_derive: false
# build: also derive the STIX 2.1 bundle from the finished stores (BYAKUGAN_BUILD_STIX).
dxdfir_byakugan_stix: false

# timeline: the source car dir (or a tree to aggregate), where timeline.jsonl
# lands (empty = beside the stores, in the timeline dir itself) and the filters.
dxdfir_byakugan_timeline_dir: "{{ dxdfir_byakugan_dir }}"
dxdfir_byakugan_timeline_out_dir: ""
dxdfir_byakugan_timeline_force: false
dxdfir_byakugan_timeline_host: ""
dxdfir_byakugan_timeline_after: ""
dxdfir_byakugan_timeline_before: ""

# verify: where the gate report verify.txt lands (empty = beside the stores, in
# the CAR dir itself). The run is judged on the summary's status == ok.
dxdfir_byakugan_verify_out_dir: ""
