---
argument_specs:
  main:
    short_description: "Materialise, verify and timeline the MITRE CAR from processed evidence."
    description:
      - >-
        Normalises every processed source into the MITRE CAR data model via the
        external Byakugan engine, which runs entirely inside the hardened
        get-sybers/byakugan container (cloned + built at the repo-root
        sources.yml pin) and is driven from its contract by the shared
        dxdfir_lane skeleton. Three actions selected by dxdfir_byakugan_action:
        build (`byakugan build`: per-source car_<object>.jsonl for each
        populated object, car_relationships.jsonl always written — the
        done/skip marker — car_inferred.jsonl with the derive pass), verify
        (`byakugan verify`: the engine's own correctness gate — the tree is
        its read-only input mount, the report verify.txt is written through
        the output mount, beside the stores by default — judged on the
        summary's status ok) and timeline (`byakugan timeline`: one
        property-rich, time-ordered CAR timeline).
    options:
      dxdfir_byakugan_action:
        type: str
        required: false
        default: build
        choices: [build, verify, timeline]
        description: "Which CAR action to run."
      dxdfir_byakugan_processed_dir:
        type: str
        required: false
        description: "Processed evidence tree the batch build reads from (default data_store/processed)."
      dxdfir_byakugan_dir:
        type: str
        required: false
        description: "The materialised CAR tree the build writes and verify/timeline read (default data_store/processed/byakugan)."
      dxdfir_byakugan_contract:
        type: str
        required: false
        description: "The byakugan contract.yml the runs are built from (default docker/GoDFIR-toolz/byakugan/contract.yml)."
      dxdfir_byakugan_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the contract's (get-sybers/byakugan:latest); e.g. a digest pin."
      dxdfir_byakugan_python_path:
        type: str
        required: false
        description: "PYTHONPATH for the image supply-chain guard (get_sybers_dxdfir.images); in-repo runs."
      dxdfir_byakugan_rebuild:
        type: bool
        required: false
        default: false
        description: "build: rebuild sources whose car_relationships.jsonl already exists (BYAKUGAN_BUILD_FORCE)."
      dxdfir_byakugan_derive:
        type: bool
        required: false
        default: false
        description: "build: also run the derived relationship pass into car_inferred.jsonl (BYAKUGAN_BUILD_DERIVE)."
      dxdfir_byakugan_stix:
        type: bool
        required: false
        default: false
        description: "build: also derive the STIX 2.1 bundle from the finished stores (BYAKUGAN_BUILD_STIX)."
      dxdfir_byakugan_timeline_dir:
        type: str
        required: false
        description: "timeline: a source's car dir, or a tree to aggregate (default the whole car tree)."
      dxdfir_byakugan_timeline_out_dir:
        type: str
        required: false
        default: ""
        description: "timeline: the directory timeline.jsonl is written to (empty = the timeline dir itself)."
      dxdfir_byakugan_timeline_force:
        type: bool
        required: false
        default: false
        description: "timeline: rewrite an existing timeline.jsonl (BYAKUGAN_TIMELINE_FORCE)."
      dxdfir_byakugan_timeline_host:
        type: str
        required: false
        description: "timeline: only events whose source_host matches."
      dxdfir_byakugan_timeline_after:
        type: str
        required: false
        description: "timeline: only events at/after this ISO timestamp."
      dxdfir_byakugan_timeline_before:
        type: str
        required: false
        description: "timeline: only events at/before this ISO timestamp."
      dxdfir_byakugan_verify_out_dir:
        type: str
        required: false
        default: ""
        description: "verify: the directory the gate report verify.txt is written to (empty = the CAR tree itself, beside the stores)."
