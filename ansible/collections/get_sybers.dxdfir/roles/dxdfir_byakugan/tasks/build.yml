---
# Materialise the per-source CAR stores (car.db + superset.db + car_<object>.jsonl
# + car_relationships.jsonl) from the processed tree, via the external engine.
# On any failure the rescue surfaces the engine's stdout/stderr as one diagnostic.
- name: "car-build | materialise and verify | build"
  block:
    - name: "car-build | run the CAR engine"
      ansible.builtin.command:
        argv: "{{ dxdfir_byakugan_build_argv }}"
      environment:
        PYTHONPATH: "{{ dxdfir_byakugan_python_path }}"
      register: dxdfir_byakugan_run
      changed_when: dxdfir_byakugan_run.rc == 0

    - name: "car-build | verify CAR stores landed on disk"
      ansible.builtin.find:
        paths: "{{ dxdfir_byakugan_dir }}"
        patterns: ["car.db", "car_*.jsonl"]
        recurse: true
      register: dxdfir_byakugan_verify
      when: dxdfir_byakugan_in | length == 0
  rescue:
    - name: "car-build | surface engine diagnostics"
      ansible.builtin.fail:
        msg: >-
          dxdfir_byakugan build failed.
          Stdout: {{ dxdfir_byakugan_run.stdout | default('(no output)') | trim | truncate(1000) }}
          Stderr: {{ dxdfir_byakugan_run.stderr | default('') | trim | truncate(1000) }}
