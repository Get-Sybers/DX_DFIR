---
# dxdfir_byakugan: materialise/verify/timeline the CAR. The role GROUPS; the playbook
# DECIDES the action. Every action is one confined run of the multi-tool
# get-sybers/byakugan image, driven from its contract
# (docker/GoDFIR-toolz/byakugan/contract.yml) by the shared dxdfir_lane skeleton;
# the engine's own idempotence (a source whose car.db exists is skipped unless
# BYAKUGAN_BUILD_FORCE) lives in the engine, not a task's `when:`.

- name: "car | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_byakugan_action in ['build', 'verify', 'timeline']
      - dxdfir_byakugan_dir | length > 0
    fail_msg: >-
      dxdfir_byakugan needs dxdfir_byakugan_action (build|verify|timeline) and a non-empty
      dxdfir_byakugan_dir.
    quiet: true
  tags: [always]

- name: "car | run the CAR action | {{ dxdfir_byakugan_action }}"
  ansible.builtin.include_tasks: "{{ dxdfir_byakugan_action }}.yml"
  tags: [always]
