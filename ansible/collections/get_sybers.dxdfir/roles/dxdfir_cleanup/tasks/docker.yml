---
# Remove the hardened dxdfir tool images so the next build is clean. Default: the
# hardened tool set, found by the `com.get-sybers.hardened=true` label the build
# stamps on every tool image — so the set is whatever was actually built, with no
# static list (and no `python -c`) to drift. `--all-dxdfir`
# (dxdfir_cleanup_all_dxdfir) removes every get-sybers/* image present instead.
# Only touches images actually on the host. Discovery is native docker API
# (docker_host_info) and runs even under --check; the destructive
# docker_image/docker_prune tasks report there without acting.
#
# The whole action is wrapped in block/rescue: a docker daemon that is unreachable
# or errors degrades to a clear skip, never a hard play failure.
- name: "cleanup-docker | remove the hardened tool images"
  block:
    # The hardened tool images carry com.get-sybers.hardened=true; select by
    # that label so the target set is exactly what the build produced.
    - name: "cleanup-docker | resolve the hardened tool images present"
      community.docker.docker_host_info:
        images: true
        images_filters:
          label: com.get-sybers.hardened=true
      register: dxdfir_cleanup_hardened
      when: not (dxdfir_cleanup_all_dxdfir | bool)

    - name: "cleanup-docker | list every image present"
      community.docker.docker_host_info:
        images: true
      register: dxdfir_cleanup_present
      when: dxdfir_cleanup_all_dxdfir | bool

    # RepoTags is null/empty on dangling or re-tag leftovers (`<none>:<none>`
    # in the CLI) — select('string') plus the '<none>' reject keep those out,
    # since removing them by that pseudo-name errors; the prune below is how
    # dangling layers go.
    - name: "cleanup-docker | choose the images to remove"
      ansible.builtin.set_fact:
        dxdfir_cleanup_targets: >-
          {{ (_tags | select('match', '^get-sybers/') | list)
             if (dxdfir_cleanup_all_dxdfir | bool) else _tags }}
      vars:
        _source: >-
          {{ dxdfir_cleanup_present.images | default([])
             if (dxdfir_cleanup_all_dxdfir | bool)
             else dxdfir_cleanup_hardened.images | default([]) }}
        _tags: >-
          {{ _source | map(attribute='RepoTags') | flatten | select('string')
             | reject('equalto', '') | reject('search', '<none>') | unique | list }}

    - name: "cleanup-docker | remove the target images"
      community.docker.docker_image:
        name: "{{ item }}"
        state: absent
        force_absent: true
      loop: "{{ dxdfir_cleanup_targets }}"

    - name: "cleanup-docker | prune dangling layers"
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: true
      register: dxdfir_cleanup_prune
      changed_when: >-
        (dxdfir_cleanup_prune.images | default([]) | length) > 0
        or (dxdfir_cleanup_prune.images_space_reclaimed | default(0) | int) > 0
      when: dxdfir_cleanup_dangling | bool

  rescue:
    - name: "cleanup-docker | image cleanup skipped (docker unavailable or errored)"
      ansible.builtin.debug:
        msg: >-
          Skipping docker image cleanup — {{ ansible_failed_result.msg | default('a docker command failed') }}.
          Evidence/CAR cleanup is unaffected; re-run `dxdfir cleanup docker` once the docker daemon is reachable.
