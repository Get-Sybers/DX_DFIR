---
- name: "deploy-sofelk | write the compose env file"
  ansible.builtin.copy:
    dest: "{{ dxdfir_deploy_sofelk_env_file }}"
    mode: "0644"
    content: |
      ELASTIC_VERSION={{ dxdfir_deploy_sofelk_elastic_version }}
      SOFELK_REF={{ dxdfir_deploy_sofelk_sofelk_ref }}
      SOFELK_INGEST_DIR={{ dxdfir_deploy_sofelk_ingest_dir }}

- name: "deploy-sofelk | build + bring up the SOF-ELK stack"
  community.docker.docker_compose_v2:
    project_src: "{{ dxdfir_deploy_sofelk_compose_dir }}"
    env_files:
      - "{{ dxdfir_deploy_sofelk_env_file }}"
    build: "{{ 'always' if dxdfir_deploy_sofelk_build | bool else 'never' }}"
    state: present
  register: dxdfir_deploy_sofelk_up

- name: "deploy-sofelk | read back the running services"
  community.docker.docker_compose_v2:
    project_src: "{{ dxdfir_deploy_sofelk_compose_dir }}"
    env_files:
      - "{{ dxdfir_deploy_sofelk_env_file }}"
  register: dxdfir_deploy_sofelk_state

- name: "deploy-sofelk | assert the sof-elk + elasticsearch services are running"
  ansible.builtin.assert:
    that:
      - >-
          dxdfir_deploy_sofelk_state.containers
          | selectattr('Service', 'equalto', 'sof-elk')
          | selectattr('State', 'equalto', 'running') | list | length > 0
      - >-
          dxdfir_deploy_sofelk_state.containers
          | selectattr('Service', 'equalto', 'elasticsearch')
          | selectattr('State', 'equalto', 'running') | list | length > 0
    fail_msg: "the SOF-ELK stack is not fully running: {{ dxdfir_deploy_sofelk_state.containers | map(attribute='Name') | list }}"
    quiet: true
