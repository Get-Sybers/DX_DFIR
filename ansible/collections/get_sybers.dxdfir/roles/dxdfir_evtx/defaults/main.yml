---

# Repo root is five levels up from this role
# (roles/dxdfir_evtx -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_evtx_repo_root: "{{ role_path }}/../../../../.."

# The logs/winevt subdir comes from the shared evidence taxonomy (evidence-taxonomy/),
# the one source of truth for where sort files evidence AND where this role reads
# it — the two can't drift. A missing taxonomy file falls back to the conventional subdir.
dxdfir_evtx_evtx_lane: >-
  {{ ((lookup('file', dxdfir_evtx_repo_root ~ '/evidence-taxonomy/logs_winevt.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('logs/winevt', true) }}
dxdfir_evtx_evtx_dir: "{{ dxdfir_evtx_repo_root }}/data_store/raw/{{ dxdfir_evtx_evtx_lane }}"
dxdfir_evtx_out_dir: "{{ dxdfir_evtx_repo_root }}/data_store/processed/windows_logs"
# Output base — one folder per log holding goevtx.jsonl. Override directly to
# send output to a custom location.

# Disk-image inputs (optional): a directory of disk images (E01/raw/VMDK/…).
# When set, WindowsEventLogs (.evtx) are exported from every image by the plaso
# image's image_export sub-tool into the stage dir, and goevtx parses that stage
# alongside dxdfir_evtx_evtx_dir, so the lane consumes images directly. Empty
# (default) => loose .evtx only.
dxdfir_evtx_image_src: ""
# Where the image exports land: one folder per image, reused across runs (an
# image already exported is not re-pulled unless force). Pinned to ONE canonical
# stage — the same the dxdfir_signatures hayabusa run reads — so the parse and
# the detection lane share the export instead of each re-pulling the image.
dxdfir_evtx_stage_dir: "{{ dxdfir_evtx_repo_root }}/data_store/processed/windows_logs/_extracted_evtx"
# Export from every Volume Shadow Copy too (PLASO_IMAGE_EXPORT_VSS).
dxdfir_evtx_vss: false

# The tool contracts the lane is driven from — the single source of truth for
# each image's env vars and mounts.
dxdfir_evtx_contract: "{{ dxdfir_evtx_repo_root }}/docker/GoDFIR-toolz/goevtx/contract.yml"
dxdfir_evtx_plaso_contract: "{{ dxdfir_evtx_repo_root }}/docker/GoDFIR-toolz/plaso/contract.yml"
# Empty = the contract's image (get-sybers/goevtx:latest — the static-Go .evtx
# parser on go-evtx, built FROM scratch from docker/GoDFIR-toolz/goevtx); set to
# pin a digest. Likewise for the plaso image the export step runs.
dxdfir_evtx_image: ""
dxdfir_evtx_plaso_image: ""

dxdfir_evtx_force: false
