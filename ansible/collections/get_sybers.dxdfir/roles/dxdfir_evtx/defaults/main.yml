---
# Backend to target; the playbook overrides this to select the pipeline.
dxdfir_evtx_pipeline: elastic

# Repo root is five levels up from this role
# (roles/dxdfir_evtx -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_evtx_repo_root: "{{ role_path }}/../../../../.."

dxdfir_evtx_evtx_dir: "{{ dxdfir_evtx_repo_root }}/data_store/raw/logs/winevt"
dxdfir_evtx_elastic_out_dir: "{{ dxdfir_evtx_repo_root }}/data_store/processed/windows_logs"
dxdfir_evtx_sofelk_out_dir: "{{ dxdfir_evtx_repo_root }}/data_store/processed/sofelk/windows_logs"
# Resolved output base for the selected pipeline — consumed by
# tasks/process.yml. Override directly to send output to a custom location.
dxdfir_evtx_out_dir: "{{ dxdfir_evtx_elastic_out_dir if dxdfir_evtx_pipeline == 'elastic' else dxdfir_evtx_sofelk_out_dir }}"

# Disk-image inputs (optional): a disk image (E01/raw/VMDK) or a directory of them.
# When set, WindowsEventLogs (.evtx) are extracted with log2timeline/plaso
# image_export.py into the stage dir and processed alongside dxdfir_evtx_evtx_dir, so
# the lane consumes images directly. Empty (default) => loose .evtx only.
dxdfir_evtx_image_src: ""
# Where --image-src extractions land. Per-image subdirs, reused across runs (an
# image whose logs are already staged is not re-pulled). Pinned to ONE canonical
# stage for BOTH pipelines — the same default the dxdfir_signatures hayabusa lane
# uses — so the elastic run, the sofelk run and the detection lane all share the
# extraction instead of each re-pulling the image.
dxdfir_evtx_stage_dir: "{{ dxdfir_evtx_repo_root }}/data_store/processed/windows_logs/_extracted_evtx"
# Include Volume Shadow Copies when extracting from a disk image.
dxdfir_evtx_vss: false
# Container providing image_export.py for disk-image extraction (already shipped for
# the disk/signature lanes).
dxdfir_evtx_plaso_image: "get-sybers/plaso:latest"

# Hayabusa (Sigma detection) over the same .evtx this lane collects — loose or
# image-extracted. Enrichment: a missing binary or zero detections is a note, not a
# failure, so leaving this on is safe even without the binary provisioned.
dxdfir_evtx_hayabusa: true
# Dir holding the hayabusa binary (+ rules/). Empty => the processor's default,
# data_store/dependencies/hayabusa under the CWD.
dxdfir_evtx_hayabusa_dir: "{{ dxdfir_evtx_repo_root }}/data_store/dependencies/hayabusa"
# Sigma rules dir (empty => rules/ beside the binary).
dxdfir_evtx_hayabusa_rules: ""

# EvtxECmd is now the static-Go goevtx (get-sybers/goevtx, on go-evtx) — no .NET
# runtime, no DLL to supply, no operator release. Built FROM scratch from
# docker/GoDFIR-toolz/goevtx by the dxdfir_images role. Override the tag if
# needed:
dxdfir_evtx_image: "get-sybers/goevtx:latest"

# In-repo runs use PYTHONPATH; a deployed run installs the package instead.
dxdfir_evtx_python_path: "{{ dxdfir_evtx_repo_root }}/python"
dxdfir_evtx_force: false

# The processor command argv, handed to the shared dxdfir_lane process step. This
# is the one genuinely per-lane piece; the run/verify/gate skeleton is shared.
dxdfir_evtx_argv: >-
  {{ ['python3', '-m', 'get_sybers_dxdfir.evtx', '--out-dir', dxdfir_evtx_out_dir, '--image', dxdfir_evtx_image]
  + (['--evtx-dir', dxdfir_evtx_evtx_dir] if dxdfir_evtx_evtx_dir | length > 0 else [])
  + (['--image-src', dxdfir_evtx_image_src, '--plaso-image', dxdfir_evtx_plaso_image]
  + (['--stage-dir', dxdfir_evtx_stage_dir] if dxdfir_evtx_stage_dir | length > 0 else [])
  + (['--vss'] if dxdfir_evtx_vss | bool else [])
  if dxdfir_evtx_image_src | length > 0 else [])
  + (['--hayabusa', '--hayabusa-dir', dxdfir_evtx_hayabusa_dir]
  + (['--hayabusa-rules', dxdfir_evtx_hayabusa_rules] if dxdfir_evtx_hayabusa_rules | length > 0 else [])
  if dxdfir_evtx_hayabusa | bool else [])
  + (['--force'] if dxdfir_evtx_force | bool else []) }}
