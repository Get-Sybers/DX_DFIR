---
argument_specs:
  main:
    short_description: "Windows Event Logs (.evtx) -> EvtxECmd normalised JSON."
    description:
      - >-
        Discovers .evtx under dxdfir_evtx_evtx_dir, runs EvtxECmd (in a container) per
        log, and writes <base>_EvtxECmd_Output.json (+ .xml sidecar) grouped by the
        source sub-dir (host). Idempotent: a log whose .json output already exists is
        skipped.
      - >-
        .evtx are parsed by goevtx (get-sybers/goevtx), a static-Go EvtxECmd
        substitute on go-evtx — no .NET runtime, no DLL to supply, built FROM
        scratch from docker/GoDFIR-toolz/goevtx.
    options:
      dxdfir_evtx_evtx_dir:
        type: str
        required: false
        description: "Directory tree of loose .evtx logs to parse (recursed)."
      dxdfir_evtx_image_src:
        type: str
        required: false
        description: >-
          Optional disk image (E01/raw/VMDK) or directory of images. When set,
          WindowsEventLogs (.evtx) are extracted with log2timeline/plaso
          image_export.py into dxdfir_evtx_stage_dir and parsed alongside
          dxdfir_evtx_evtx_dir, so the lane can consume images directly.
      dxdfir_evtx_stage_dir:
        type: str
        required: false
        description: >-
          Where dxdfir_evtx_image_src extractions land (default
          data_store/processed/windows_logs/_extracted_evtx — one canonical stage
          shared by both pipelines and the dxdfir_signatures hayabusa lane).
          Per-image subdirs; an image already staged is not re-extracted.
      dxdfir_evtx_vss:
        type: bool
        required: false
        default: false
        description: "Include Volume Shadow Copies when extracting from a disk image."
      dxdfir_evtx_plaso_image:
        type: str
        required: false
        default: "get-sybers/plaso:latest"
        description: "Container providing image_export.py for disk-image extraction."
      dxdfir_evtx_hayabusa:
        type: bool
        required: false
        default: true
        description: >-
          Also run Hayabusa (Sigma detection) over the same .evtx this lane collects,
          writing <out-dir>/hayabusa/timeline.jsonl. Enrichment: a missing binary or
          zero detections is a note, not a failure.
      dxdfir_evtx_hayabusa_dir:
        type: str
        required: false
        description: "Dir holding the hayabusa binary (+ rules/)."
      dxdfir_evtx_hayabusa_rules:
        type: str
        required: false
        description: "Sigma rules dir for Hayabusa (empty => rules/ beside the binary)."
      dxdfir_evtx_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/windows_logs); override to send output to a custom location."
      dxdfir_evtx_image:
        type: str
        required: false
        default: "get-sybers/goevtx:latest"
        description: >-
          The image the processor runs: goevtx, the static-Go EvtxECmd substitute
          (built FROM scratch from docker/GoDFIR-toolz/goevtx). Override to pin
          a digest.
      dxdfir_evtx_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dxdfir package (in-repo/dev runs)."
      dxdfir_evtx_force:
        type: bool
        required: false
        default: false
        description: "Reparse logs that already have output."
