---
argument_specs:
  main:
    short_description: "Windows Event Logs (.evtx) -> goevtx JSON Lines."
    description:
      - >-
        Runs the self-orchestrating get-sybers/goevtx image over
        dxdfir_evtx_evtx_dir from its contract (GOEVTX_* env vars, /input +
        /output mounts): every .evtx (by extension or ElfFile signature) is
        parsed into its own folder holding goevtx.jsonl, one record per event;
        the folder is the log's path relative to the input dir with separators
        folded to _. Idempotent: a log whose output already exists is skipped
        unless dxdfir_evtx_force.
      - >-
        With dxdfir_evtx_image_src set, the plaso image's image_export sub-tool
        first exports WindowsEventLogs from every disk image under it into
        dxdfir_evtx_stage_dir, and goevtx parses that stage too.
    options:
      dxdfir_evtx_evtx_dir:
        type: str
        required: false
        description: "Directory tree of loose .evtx logs to parse (recursed)."
      dxdfir_evtx_image_src:
        type: str
        required: false
        description: >-
          Optional directory of disk images (E01/raw/VMDK/…). When set,
          WindowsEventLogs are exported from every image by the plaso image's
          image_export sub-tool into dxdfir_evtx_stage_dir and parsed alongside
          dxdfir_evtx_evtx_dir.
      dxdfir_evtx_stage_dir:
        type: str
        required: false
        description: >-
          Where the image exports land (default
          data_store/processed/windows_logs/_extracted_evtx — the one canonical
          stage the dxdfir_signatures hayabusa run reads too). One folder per
          image; an image already exported is not re-pulled unless force.
      dxdfir_evtx_vss:
        type: bool
        required: false
        default: false
        description: "Export from every Volume Shadow Copy too (PLASO_IMAGE_EXPORT_VSS)."
      dxdfir_evtx_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/windows_logs); override to send output to a custom location."
      dxdfir_evtx_contract:
        type: str
        required: false
        description: "The goevtx contract.yml the parse run is built from (default docker/GoDFIR-toolz/goevtx/contract.yml)."
      dxdfir_evtx_plaso_contract:
        type: str
        required: false
        description: "The plaso contract.yml the image_export run is built from (default docker/GoDFIR-toolz/plaso/contract.yml)."
      dxdfir_evtx_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the contract's (get-sybers/goevtx:latest); e.g. a digest pin."
      dxdfir_evtx_plaso_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the plaso contract's (get-sybers/plaso:latest) for the export step."
      dxdfir_evtx_force:
        type: bool
        required: false
        default: false
        description: "Reparse logs (and re-export images) that already have output."
