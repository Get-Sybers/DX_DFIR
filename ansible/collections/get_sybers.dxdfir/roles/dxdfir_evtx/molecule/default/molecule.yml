---
# offline by design: the galaxy dep is the git submodule, resolved via roles_path
prerun: false
dependency:
  name: galaxy
  enabled: false
driver:
  name: default            # delegated — the role runs the goevtx container itself
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    # resolve the role under test from the collection's roles/ dir (molecule no
    # longer adds the role's parent to the roles path by itself)
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/../../../../../docker/GoDFIR-toolz/roles
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
