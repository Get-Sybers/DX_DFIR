---
# evtx output gate, included at the end of dxdfir_lane's process block: goevtx
# produced JSON, UNLESS there genuinely were no logs to process (files == 0). A
# trusted literal assert — dxdfir_lane_run + dxdfir_lane_verify are in scope from the
# shared process step.
- name: "evtx-process | assert output matches what was processed"
  ansible.builtin.assert:
    that:
      - dxdfir_lane_verify.matched | int > 0 or (dxdfir_lane_run.stdout | from_json).files | int == 0
    fail_msg: >-
      evtx produced no JSON though logs were present.
    quiet: true
