---
# .evtx -> goevtx JSON Lines, delegated to dxdfir_lane (semantics: README.md);
# with image_src set, plaso's image_export stages the logs out of disk images first.

- name: "evtx | assert inputs"
  ansible.builtin.assert:
    that:
      # at least one input source: loose .evtx or disk images
      - (dxdfir_evtx_evtx_dir | length > 0) or (dxdfir_evtx_image_src | length > 0)
    fail_msg: >-
      dxdfir_evtx needs an input source
      (dxdfir_evtx_evtx_dir or dxdfir_evtx_image_src).
    quiet: true
  tags: [always]

# in order: the optional image export, goevtx over the loose logs, goevtx over the stage
- name: "evtx | declare the runs"
  ansible.builtin.set_fact:
    dxdfir_evtx_runs: >-
      {{ ([{'name': 'image_export',
            'contract': dxdfir_evtx_plaso_contract,
            'image': dxdfir_evtx_plaso_image,
            'subtool': 'image_export',
            'env': {'PLASO_IMAGE_EXPORT_ARTIFACT_FILTERS': 'WindowsEventLogs',
                    'PLASO_IMAGE_EXPORT_VSS': dxdfir_evtx_vss,
                    'PLASO_IMAGE_EXPORT_FORCE': dxdfir_evtx_force},
            'mounts': [{'host': dxdfir_evtx_image_src, 'path': '/input', 'mode': 'ro'},
                       {'host': dxdfir_evtx_stage_dir, 'path': '/output', 'mode': 'rw'}]}]
          if dxdfir_evtx_image_src | length > 0 else [])
       + ([{'name': 'goevtx',
            'contract': dxdfir_evtx_contract,
            'image': dxdfir_evtx_image,
            'env': {'GOEVTX_FORCE': dxdfir_evtx_force},
            'mounts': [{'host': dxdfir_evtx_evtx_dir, 'path': '/input', 'mode': 'ro'},
                       {'host': dxdfir_evtx_out_dir, 'path': '/output', 'mode': 'rw'}]}]
          if dxdfir_evtx_evtx_dir | length > 0 else [])
       + ([{'name': 'goevtx-staged',
            'contract': dxdfir_evtx_contract,
            'image': dxdfir_evtx_image,
            'env': {'GOEVTX_FORCE': dxdfir_evtx_force},
            'mounts': [{'host': dxdfir_evtx_stage_dir, 'path': '/input', 'mode': 'ro'},
                       {'host': dxdfir_evtx_out_dir, 'path': '/output', 'mode': 'rw'}]}]
          if dxdfir_evtx_image_src | length > 0 else []) }}
  tags: [always]

- name: "evtx | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dxdfir_lane
  vars:
    dxdfir_lane_name: evtx
    dxdfir_lane_runs: "{{ dxdfir_evtx_runs }}"
    dxdfir_lane_verify_dir: "{{ dxdfir_evtx_out_dir }}"
    dxdfir_lane_verify_glob: "goevtx.jsonl"
  tags: [always]
