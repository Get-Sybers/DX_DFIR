---
# dxdfir_evtx: .evtx -> EvtxECmd JSON. The role GROUPS; the playbook DECIDES.
# Idempotence (skip logs whose .json output exists) lives in the Python
# processor, not in a task's `when:`. This role asserts its own input rules, then
# delegates the shared preflight + process skeleton to dxdfir_lane.

- name: "evtx | assert inputs"
  ansible.builtin.assert:
    that:
      # At least one input source: loose .evtx (evtx_dir) or disk images (image_src).
      - (dxdfir_evtx_evtx_dir | length > 0) or (dxdfir_evtx_image_src | length > 0)
    fail_msg: >-
      dxdfir_evtx needs an input source
      (dxdfir_evtx_evtx_dir or dxdfir_evtx_image_src).
    quiet: true
  tags: [always]

# role_path resolves to THIS role here — capture the lane-specific preflight file
# so dxdfir_lane includes evtx's check (the goevtx image is present), not its own.
- name: "evtx | resolve lane-specific task paths"
  ansible.builtin.set_fact:
    dxdfir_evtx_preflight_extra: "{{ role_path }}/tasks/preflight_extra.yml"
    dxdfir_evtx_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]

# Output lands under the resolved dxdfir_evtx_out_dir default — the shared
# tasks only consume it.
- name: "evtx | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dxdfir_lane
  vars:
    dxdfir_lane_name: evtx
    dxdfir_lane_module: get_sybers_dxdfir.evtx
    dxdfir_lane_python_path: "{{ dxdfir_evtx_python_path }}"
    dxdfir_lane_images: ["{{ dxdfir_evtx_image }}", "{{ dxdfir_evtx_plaso_image }}"]
    dxdfir_lane_input_checks: >-
      {{ [{'name': 'evtx dir', 'path': dxdfir_evtx_evtx_dir}]
         if dxdfir_evtx_evtx_dir | length > 0 else [] }}
    dxdfir_lane_argv: "{{ dxdfir_evtx_argv }}"
    dxdfir_lane_verify_dir: "{{ dxdfir_evtx_out_dir }}"
    dxdfir_lane_verify_glob: "*_EvtxECmd_Output.json"
    dxdfir_lane_preflight_extra: "{{ dxdfir_evtx_preflight_extra }}"
    dxdfir_lane_gate_extra: "{{ dxdfir_evtx_gate_extra }}"
  tags: [always]
