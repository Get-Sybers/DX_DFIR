---
# Lane-specific evtx preflight, included by dxdfir_lane's shared preflight (after
# the docker + input-dir checks, before the module/image guards). The parser is
# goevtx (get-sybers/goevtx) — a static-Go .evtx parser, no .NET, no DLL
# to supply. The only precondition is that its image exists.

- name: "evtx-preflight | inspect the goevtx image"
  # Inspect the image that will actually run (dxdfir_evtx_image), not just the
  # default tag — so a dxdfir_evtx_image digest-pin override is validated too.
  ansible.builtin.command: "docker image inspect {{ dxdfir_evtx_image }}"
  register: dxdfir_evtx_image_inspect
  changed_when: false
  failed_when: false

- name: "evtx-preflight | assert the goevtx image exists"
  ansible.builtin.assert:
    that:
      - dxdfir_evtx_image_inspect.rc == 0
    fail_msg: >-
      goevtx image {{ dxdfir_evtx_image }} not found. Build it with
      `ansible-playbook playbooks/dxdfir-build-images.yml` (from
      docker/GoDFIR-toolz/goevtx).
    quiet: true
