---

dxdfir_godaemonhunter_repo_root: "{{ role_path }}/../../../../.."

# a collection-scoped run lands one level below the leaf: processed/daemonhunter/<collection>/
dxdfir_godaemonhunter_collection: ""

# subdirs from the shared evidence taxonomy (evidence-taxonomy/)
# loose Linux logs / staged root trees, one folder per host: logs/linux/<host>/
dxdfir_godaemonhunter_linux_lane: >-
  {{ ((lookup('file', dxdfir_godaemonhunter_repo_root ~ '/evidence-taxonomy/logs_linux.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('logs/linux', true) }}
dxdfir_godaemonhunter_linux_dir: "{{ dxdfir_godaemonhunter_repo_root }}/data_store/raw/{{ dxdfir_godaemonhunter_linux_lane }}"
# the disk-image family: every image is a host the parsers run ON (no export)
dxdfir_godaemonhunter_input_lane: >-
  {{ ((lookup('file', dxdfir_godaemonhunter_repo_root ~ '/evidence-taxonomy/disk_images.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('disk_images', true) }}
dxdfir_godaemonhunter_input_dir: "{{ dxdfir_godaemonhunter_repo_root }}/data_store/raw/{{ dxdfir_godaemonhunter_input_lane }}"
dxdfir_godaemonhunter_vm_lane: >-
  {{ ((lookup('file', dxdfir_godaemonhunter_repo_root ~ '/evidence-taxonomy/vm_files.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('VM_files', true) }}
dxdfir_godaemonhunter_vm_dir: "{{ dxdfir_godaemonhunter_repo_root }}/data_store/raw/{{ dxdfir_godaemonhunter_vm_lane }}"

# processed/daemonhunter/[<collection>/]<subtool>/<host>/<item>/<subtool>.jsonl
# and the Layer-1 knowledge store: processed/daemonhunter/[<collection>/]knowledge/<host>/
dxdfir_godaemonhunter_out_dir: >-
  {{ dxdfir_godaemonhunter_repo_root }}/data_store/processed/daemonhunter{{
  ('/' ~ dxdfir_godaemonhunter_collection) if dxdfir_godaemonhunter_collection | length > 0 else '' }}
# the disk-backed scratch bound at /work per image: hunt pulls the linux-core
# surface there while it runs and removes it after (the container's own tmpfs
# is 1 GiB — /var/log alone can exceed it)
dxdfir_godaemonhunter_work_dir: >-
  {{ dxdfir_godaemonhunter_repo_root }}/data_store/processed/_scratch/daemonhunter{{
  ('/' ~ dxdfir_godaemonhunter_collection) if dxdfir_godaemonhunter_collection | length > 0 else '' }}

# what counts as a disk image inside a tree (see dxdfir_gowindowlicker)
dxdfir_godaemonhunter_image_regex: '(?i).*\.(e01|ex01|raw|dd|img|vmdk|vhd|vhdx|qcow2|qcow|vdi|dmg|sparseimage|aff4|001|bin)$'
dxdfir_godaemonhunter_exclude_regex: '(?i).*(-flat\.vmdk|-s[0-9]{3,}\.vmdk|\.e(0[2-9]|[1-9][0-9]|[a-z]{2}))$'

# the contract the lane is driven from; every parser is a sub-tool of the one image
dxdfir_godaemonhunter_contract: "{{ dxdfir_godaemonhunter_repo_root }}/docker/GoDFIR-toolz/godaemonhunter/contract.yml"
# empty = the contract's image; set to pin a digest
dxdfir_godaemonhunter_image: ""
# The layers come from the contract (its layer1/layer2 keys — the registry
# hunt runs): Layer 1 builds the host's knowledge store (identity, accounts,
# network; gomachost and gomacusers are the Mac's), Layer 2 are the daemon
# parsers run with that store mounted. A new parser in the image needs no
# change here. The literal lists below are only the fallback for a contract
# that predates the keys. A parser that finds nothing on a host exits 1 by
# design; the lists are the whole matrix, not per OS.
dxdfir_godaemonhunter_contract_data: >-
  {{ (lookup('file', dxdfir_godaemonhunter_contract, errors='ignore') | default('', true) | from_yaml) or {} }}
dxdfir_godaemonhunter_layer1: >-
  {{ dxdfir_godaemonhunter_contract_data.layer1
  | default(['gohost', 'gousers', 'gonetwork', 'gomachost', 'gomacusers'], true) }}
dxdfir_godaemonhunter_layer2: >-
  {{ dxdfir_godaemonhunter_contract_data.layer2
  | default(['gojournal', 'goauditd', 'gowtmp', 'gosyslog', 'gounit', 'gocron', 'goshell', 'gotrash', 'goctl', 'golaunchd'], true) }}
dxdfir_godaemonhunter_force: false
