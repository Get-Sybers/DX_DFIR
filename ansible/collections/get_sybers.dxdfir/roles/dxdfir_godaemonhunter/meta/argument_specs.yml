---
argument_specs:
  main:
    short_description: "Linux hosts -> the godaemonhunter parse, one folder per parser, host and item."
    description:
      - >-
        Runs the get-sybers/godaemonhunter image's parsers over every HOST from
        the image's contract. A host is a folder directly under
        dxdfir_godaemonhunter_linux_dir (logs/linux/<host>/ — a staged root
        filesystem or a pile of its logs) or a disk image under
        dxdfir_godaemonhunter_input_dir / dxdfir_godaemonhunter_vm_dir, first
        exported once by dxdfir_export into the shared stage. Per host, Layer 1
        (dxdfir_godaemonhunter_layer1) builds the knowledge store
        <out_dir>/knowledge/<host>/, then Layer 2 (dxdfir_godaemonhunter_layer2)
        runs with it mounted at /knowledge and writes
        <out_dir>/<subtool>/<host>/<item>/<subtool>.jsonl — one confined run per
        (parser, host), so the tree is host-centric. Idempotent per item: a
        parser skips an item with valid output unless
        dxdfir_godaemonhunter_force. A parser with nothing to parse (a Windows
        image) or a failed item is tolerated; the gate is "some parser produced
        output, or no artefacts".
      - >-
        With dxdfir_godaemonhunter_collection set, the output and the export
        stage land one level below their leaves
        (processed/daemonhunter/<collection>/, processed/_extracted/<collection>/).
    options:
      dxdfir_godaemonhunter_collection:
        type: str
        required: false
        default: ""
        description: "The collection this run is scoped to (the CLI passes it); scopes the output and stage paths."
      dxdfir_godaemonhunter_linux_dir:
        type: str
        required: false
        description: "Loose Linux evidence, one folder per host (default data_store/raw/logs/linux); files at its root are reported, not parsed."
      dxdfir_godaemonhunter_input_dir:
        type: str
        required: false
        description: "Disk-image tree (E01/raw/img/dd/vmdk/vhd/vhdx/aff), recursed; exported by dxdfir_export."
      dxdfir_godaemonhunter_vm_dir:
        type: str
        required: false
        description: "VM export folders (one sub-folder per VM); optional — exported when the directory exists."
      dxdfir_godaemonhunter_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/daemonhunter[/<collection>]); knowledge/<host>/ and <subtool>/<host>/<item>/ beneath it."
      dxdfir_godaemonhunter_stage_dir:
        type: str
        required: false
        description: "The shared export stage (default data_store/processed/_extracted[/<collection>]); one folder per image."
      dxdfir_godaemonhunter_layer1:
        type: list
        elements: str
        required: false
        description: "The knowledge-store parsers run first per host (default gohost, gousers, gonetwork)."
      dxdfir_godaemonhunter_layer2:
        type: list
        elements: str
        required: false
        description: "The daemon parsers run per host with the store mounted (default every Layer-2 parser)."
      dxdfir_godaemonhunter_contract:
        type: str
        required: false
        description: "The contract.yml the runs are built from (default docker/GoDFIR-toolz/godaemonhunter/contract.yml)."
      dxdfir_godaemonhunter_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the contract's (get-sybers/godaemonhunter:latest); e.g. a digest pin."
      dxdfir_godaemonhunter_plaso_contract:
        type: str
        required: false
        description: "The plaso contract.yml the export runs are built from (default docker/GoDFIR-toolz/plaso/contract.yml)."
      dxdfir_godaemonhunter_plaso_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the plaso contract's (get-sybers/plaso:latest) for the export."
      dxdfir_godaemonhunter_vss:
        type: bool
        required: false
        default: false
        description: "Also export from Volume Shadow Copies (PLASO_IMAGE_EXPORT_VSS)."
      dxdfir_godaemonhunter_force:
        type: bool
        required: false
        default: false
        description: "Re-export images and reparse items that already have output."
