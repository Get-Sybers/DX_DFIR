---
argument_specs:
  main:
    short_description: "Linux hosts -> the godaemonhunter parse, one folder per parser, host and item."
    description:
      - >-
        Runs the get-sybers/godaemonhunter image's parsers over every HOST from
        the image's contract. A host is a folder directly under
        dxdfir_godaemonhunter_linux_dir (logs/linux/<host>/ — a staged root
        filesystem or a pile of its logs) — per host, Layer 1
        (dxdfir_godaemonhunter_layer1) builds the knowledge store
        <out_dir>/knowledge/<host>/, then Layer 2 (dxdfir_godaemonhunter_layer2)
        runs with it mounted at /knowledge, one confined run per (parser,
        host) — or a disk image under dxdfir_godaemonhunter_input_dir /
        dxdfir_godaemonhunter_vm_dir (E01/Ex01, raw, VMDK, VHDX, VHD, QCOW2,
        VDI), which the parsers run ON: one layered hunt run per image
        (GODAEMONHUNTER_IMAGE), the image's baked-in gomount pulling the
        linux-core surface out of the root volume into /work — bound to
        dxdfir_godaemonhunter_work_dir — while the layers run; nothing is
        exported. Either way the tree is host-centric:
        <out_dir>/<subtool>/<host>/<item>/<subtool>.jsonl and
        <out_dir>/knowledge/<host>/. Idempotent per item: a parser skips an
        item with valid output unless dxdfir_godaemonhunter_force. A parser
        with nothing to parse (a Windows image) or a failed item is tolerated;
        the gate is "some parser produced output, or no artefacts".
      - >-
        With dxdfir_godaemonhunter_collection set, the output and the scratch
        land one level below their leaves
        (processed/daemonhunter/<collection>/, processed/_scratch/daemonhunter/<collection>/).
    options:
      dxdfir_godaemonhunter_collection:
        type: str
        required: false
        default: ""
        description: "The collection this run is scoped to (the CLI passes it); scopes the output and scratch paths."
      dxdfir_godaemonhunter_linux_dir:
        type: str
        required: false
        description: "Loose Linux evidence, one folder per host (default data_store/raw/logs/linux); files at its root are reported, not parsed."
      dxdfir_godaemonhunter_input_dir:
        type: str
        required: false
        description: "Disk-image tree (E01/Ex01, raw/dd/img, VMDK, VHDX, VHD, QCOW2, VDI), recursed; every image a host the parsers run on."
      dxdfir_godaemonhunter_vm_dir:
        type: str
        required: false
        description: "VM export folders (one sub-folder per VM); optional — read when the directory exists."
      dxdfir_godaemonhunter_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/daemonhunter[/<collection>]); knowledge/<host>/ and <subtool>/<host>/<item>/ beneath it."
      dxdfir_godaemonhunter_work_dir:
        type: str
        required: false
        description: "Disk-backed scratch bound at /work per image (default data_store/processed/_scratch/daemonhunter[/<collection>]); the linux-core surface pulled off an image lives there only while its parsers run."
      dxdfir_godaemonhunter_image_regex:
        type: str
        required: false
        description: "What counts as a disk image inside a tree (a case-insensitive regex over the whole name)."
      dxdfir_godaemonhunter_exclude_regex:
        type: str
        required: false
        description: "The parts of another item, never hosts (a VMDK's -flat/-sNNN extents, an EWF set's .E02… segments)."
      dxdfir_godaemonhunter_layer1:
        type: list
        elements: str
        required: false
        description: "The knowledge-store parsers run first per host (default gohost, gousers, gonetwork)."
      dxdfir_godaemonhunter_layer2:
        type: list
        elements: str
        required: false
        description: "The daemon parsers run per host with the store mounted (default every Layer-2 parser)."
      dxdfir_godaemonhunter_contract:
        type: str
        required: false
        description: "The contract.yml the runs are built from (default docker/GoDFIR-toolz/godaemonhunter/contract.yml)."
      dxdfir_godaemonhunter_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the contract's (get-sybers/godaemonhunter:latest); e.g. a digest pin."
      dxdfir_godaemonhunter_force:
        type: bool
        required: false
        default: false
        description: "Reparse items that already have output."
