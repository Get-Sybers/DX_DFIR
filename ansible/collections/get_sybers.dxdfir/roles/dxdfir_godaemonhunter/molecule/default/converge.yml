---
- name: Converge
  hosts: localhost
  gather_facts: true
  vars:
    dxdfir_godaemonhunter_linux_dir: /tmp/dxdfir_godaemonhunter_molecule/linux
    # no disk images: the export declares no run, the plaso image is never needed
    dxdfir_godaemonhunter_input_dir: /tmp/dxdfir_godaemonhunter_molecule/images
    dxdfir_godaemonhunter_vm_dir: ""
    dxdfir_godaemonhunter_out_dir: /tmp/dxdfir_godaemonhunter_molecule/out
    dxdfir_godaemonhunter_stage_dir: /tmp/dxdfir_godaemonhunter_molecule/_extracted
    # Uses the default image (get-sybers/godaemonhunter); build it first with
    # playbooks/dxdfir-build-images.yml.
  tasks:
    - name: "converge | run dxdfir_godaemonhunter"
      ansible.builtin.include_role:
        name: dxdfir_godaemonhunter
