---
# godaemonhunter output gate, included at the end of dxdfir_lane's process
# block instead of the default one: some parser produced output, UNLESS no
# parser found an artefact to parse (a Windows image in the export is NORMAL:
# the whole matrix exits 1 by design and lights up when Linux content
# arrives). Per-item failures are tolerated (dxdfir_lane_require_no_failures
# is false). A trusted literal assert — dxdfir_lane_summaries +
# dxdfir_lane_verify are in scope from the shared process step.
- name: "godaemonhunter-process | assert output was produced for the artefacts present"
  ansible.builtin.assert:
    that:
      - >-
        dxdfir_lane_verify.matched | int > 0
        or (dxdfir_lane_summaries | map(attribute='inputs') | map('int') | sum) == 0
    fail_msg: >-
      godaemonhunter produced no output at all though artefacts were present
      (every parser container failed?).
    quiet: true
