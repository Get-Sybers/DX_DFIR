---
# dxdfir_godaemonhunter: discover the loose Linux hosts and the disk images
# (shared dxdfir_evidence), then delegate to
# get_sybers.godfir_run.godfir_godaemonhunter (imported by URL).
- name: "godaemonhunter | assert inputs"
  ansible.builtin.assert:
    that:
      - (dxdfir_godaemonhunter_linux_dir | length > 0) or (dxdfir_godaemonhunter_input_dir | length > 0)
    fail_msg: >-
      dxdfir_godaemonhunter needs an input source (dxdfir_godaemonhunter_linux_dir
      or dxdfir_godaemonhunter_input_dir).
    quiet: true
  tags: [always]

- name: "godaemonhunter | discover disk images + loose Linux hosts"
  ansible.builtin.include_role:
    name: dxdfir_evidence
  vars:
    dxdfir_evidence_trees:
      - "{{ dxdfir_godaemonhunter_input_dir }}"
      - "{{ dxdfir_godaemonhunter_vm_dir }}"
    dxdfir_evidence_host_dir: "{{ dxdfir_godaemonhunter_linux_dir }}"
  tags: [always]

- name: "godaemonhunter | run the get-sybers godaemonhunter lane"
  ansible.builtin.include_role:
    name: get_sybers.godfir_run.godfir_godaemonhunter
  vars:
    godfir_godaemonhunter_images: "{{ dxdfir_evidence_images }}"
    godfir_godaemonhunter_hosts: "{{ dxdfir_evidence_hosts }}"
    godfir_godaemonhunter_out_dir: "{{ dxdfir_godaemonhunter_out_dir }}"
    godfir_godaemonhunter_work_dir: "{{ dxdfir_godaemonhunter_work_dir }}"
    godfir_godaemonhunter_image: "{{ dxdfir_godaemonhunter_image }}"
    godfir_godaemonhunter_force: "{{ dxdfir_godaemonhunter_force }}"
  tags: [always]
