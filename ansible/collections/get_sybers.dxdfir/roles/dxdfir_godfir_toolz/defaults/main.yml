---

# Repo root is five levels up from this role
# (roles/dxdfir_godfir_toolz -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_godfir_toolz_repo_root: "{{ role_path }}/../../../../.."

# Disk-image tree (E01/raw/img/dd/vmdk/vhd/vhdx/aff), recursed — same input
# family dxdfir_plaso reads, since this lane pulls its own artefact set out of the
# same evidence images. The disk_images subdir comes from the shared evidence
# taxonomy (evidence-taxonomy/), the one source of truth for where sort files
# evidence AND where this role reads it — the two can't drift. A missing taxonomy
# file falls back to the conventional subdir.
dxdfir_godfir_toolz_input_lane: >-
  {{ ((lookup('file', dxdfir_godfir_toolz_repo_root ~ '/evidence-taxonomy/disk_images.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('disk_images', true) }}
dxdfir_godfir_toolz_input_dir: "{{ dxdfir_godfir_toolz_repo_root }}/data_store/raw/{{ dxdfir_godfir_toolz_input_lane }}"
# VMware VM export folders (one per VM) — optional, mirrors dxdfir_plaso. The
# VM_files subdir is likewise taken from the taxonomy.
dxdfir_godfir_toolz_vm_lane: >-
  {{ ((lookup('file', dxdfir_godfir_toolz_repo_root ~ '/evidence-taxonomy/vm_files.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('VM_files', true) }}
dxdfir_godfir_toolz_vm_dir: "{{ dxdfir_godfir_toolz_repo_root }}/data_store/raw/{{ dxdfir_godfir_toolz_vm_lane }}"
dxdfir_godfir_toolz_out_dir: "{{ dxdfir_godfir_toolz_repo_root }}/data_store/processed/godfir-toolz"
# Output base — consumed by
# tasks/process.yml. Override directly to send output to a custom location.
# The hardened in-repo Plaso image, used for artefact extraction (image_export.py)
# and the SRUM two-step (log2timeline.py/psort.py) — build with dxdfir-build-images.
dxdfir_godfir_toolz_plaso_image: "get-sybers/plaso:latest"
# Also extract from Volume Shadow Copies during artefact extraction.
dxdfir_godfir_toolz_vss: false
# In-repo runs use PYTHONPATH; a deployed run installs the package instead.
dxdfir_godfir_toolz_python_path: "{{ dxdfir_godfir_toolz_repo_root }}/python"
dxdfir_godfir_toolz_force: false

# The processor command argv, handed to the shared dxdfir_lane process step. This
# is the one genuinely per-lane piece; the run/verify/gate skeleton is shared.
dxdfir_godfir_toolz_argv: >-
  {{ ['python3', '-m', 'get_sybers_dxdfir.godfir_toolz',
  '--input-dir', dxdfir_godfir_toolz_input_dir,
  '--vm-dir', dxdfir_godfir_toolz_vm_dir,
  '--out-dir', dxdfir_godfir_toolz_out_dir,
  '--plaso-image', dxdfir_godfir_toolz_plaso_image]
  + (['--vss'] if dxdfir_godfir_toolz_vss | bool else [])
  + (['--force'] if dxdfir_godfir_toolz_force | bool else []) }}
