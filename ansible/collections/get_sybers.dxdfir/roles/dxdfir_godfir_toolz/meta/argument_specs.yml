---
argument_specs:
  main:
    short_description: "disk images -> GoDFIR-toolz artefact parse, one output dir per host."
    description:
      - >-
        Discovers disk images under dxdfir_godfir_toolz_input_dir (and VM exports under
        dxdfir_godfir_toolz_vm_dir), extracts the godfir-toolz artefact set (registry hives +
        transaction logs, Amcache, jump lists/lnk, Recycle Bin $I records, Windows
        Timeline database, SRUM database, resident $MFT) with a plaso YAML collection
        filter, then runs each hardened GoDFIR-toolz container over what was pulled
        out (gore, gojle, gole, goamcache, goappcompat, gosbe, gorb, gomft) plus
        goese for SRUM (one JSONL per provider table, when SRUDB.dat was
        extracted) and goprefetch for Prefetch. Idempotent at the
        host level: a host output dir that already holds any file is skipped unless
        dxdfir_godfir_toolz_force.
    options:
      dxdfir_godfir_toolz_input_dir:
        type: str
        required: false
        description: "Disk-image tree (E01/raw/img/dd/vmdk/vhd/vhdx/aff), recursed."
      dxdfir_godfir_toolz_vm_dir:
        type: str
        required: false
        description: "VMware VM export folders (one sub-folder per VM); optional."
      dxdfir_godfir_toolz_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/godfir-toolz); override to send output to a custom location."
      dxdfir_godfir_toolz_plaso_image:
        type: str
        required: false
        default: "get-sybers/plaso:latest"
        description: >-
          The hardened in-repo Plaso image, used for artefact EXTRACTION only
          (image_export.py against a YAML collection filter). SRUM and Prefetch
          are parsed by the Linux-native Go substitutes (get-sybers/goese,
          get-sybers/goprefetch), not Plaso.
      dxdfir_godfir_toolz_vss:
        type: bool
        required: false
        default: false
        description: "Also extract from Volume Shadow Copies during artefact extraction."
      dxdfir_godfir_toolz_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dxdfir package (in-repo/dev runs)."
      dxdfir_godfir_toolz_force:
        type: bool
        required: false
        default: false
        description: "Reprocess hosts that already have output."
