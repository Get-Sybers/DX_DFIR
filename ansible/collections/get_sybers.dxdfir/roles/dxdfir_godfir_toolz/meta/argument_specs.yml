---
argument_specs:
  main:
    short_description: "disk images -> GoDFIR-toolz artefact parse, one folder per sub-tool and item."
    description:
      - >-
        Exports the godfir-toolz artefact set (registry hives + transaction logs,
        Amcache, jump lists/.lnk, Recycle Bin $I records, Windows Timeline
        database, SRUM database, Prefetch, resident $MFT) out of every disk image
        under dxdfir_godfir_toolz_input_dir (and dxdfir_godfir_toolz_vm_dir when
        it exists) with the plaso image's image_export sub-tool and the role's
        filter file, then runs the two multi-tool matrices over the export from
        their contracts — gowindowlicker's lick sweep (the Windows parser dozen)
        and godaemonhunter's hunt (the Linux daemon matrix): every sub-tool
        content-detects its artefacts and writes
        <out_dir>/<subtool>/<item>/<subtool>.jsonl. Idempotent per item: a
        sub-tool skips an item with valid output unless
        dxdfir_godfir_toolz_force. A matrix with nothing to parse or a failed
        item is tolerated; the gate is "some tool produced output, or no
        artefacts".
    options:
      dxdfir_godfir_toolz_input_dir:
        type: str
        required: false
        description: "Disk-image tree (E01/raw/img/dd/vmdk/vhd/vhdx/aff), recursed."
      dxdfir_godfir_toolz_vm_dir:
        type: str
        required: false
        description: "VM export folders (one sub-folder per VM); optional — exported when the directory exists."
      dxdfir_godfir_toolz_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/godfir-toolz); one folder per sub-tool."
      dxdfir_godfir_toolz_stage_dir:
        type: str
        required: false
        description: "Where the artefact export lands (default <out_dir>/_extracted); one folder per image."
      dxdfir_godfir_toolz_toolz_dir:
        type: str
        required: false
        description: "The GoDFIR-toolz submodule root holding every <tool>/contract.yml."
      dxdfir_godfir_toolz_plaso_contract:
        type: str
        required: false
        description: "The plaso contract.yml the export runs are built from."
      dxdfir_godfir_toolz_filter_file:
        type: str
        required: false
        description: "The image_export filter file (plaso yaml_filter_file format) declaring the artefact set."
      dxdfir_godfir_toolz_plaso_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the plaso contract's (get-sybers/plaso:latest) for the export."
      dxdfir_godfir_toolz_vss:
        type: bool
        required: false
        default: false
        description: "Also export from Volume Shadow Copies (PLASO_IMAGE_EXPORT_VSS)."
      dxdfir_godfir_toolz_force:
        type: bool
        required: false
        default: false
        description: "Re-export images and reparse items that already have output."
