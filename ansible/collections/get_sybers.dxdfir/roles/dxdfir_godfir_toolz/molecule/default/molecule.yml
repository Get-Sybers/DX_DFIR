---
driver:
  name: default            # delegated — the role runs the tool containers itself
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    # resolve the role under test from the collection's roles/ dir (molecule no
    # longer adds the role's parent to the roles path by itself)
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
