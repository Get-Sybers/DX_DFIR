---
# A parseable forensic image is large/binary, so no fixture ships in-repo. Point
# this at a small raw/E01 Windows image (with at least one registry hive or
# Amcache.hve for the scenario to produce anything) to run the scenario:
#   molecule test -- -e molecule_sample_image=/path/tiny.raw
- name: Prepare
  hosts: localhost
  gather_facts: false
  vars:
    molecule_in: /tmp/dxdfir_godfir_toolz_molecule/in
    molecule_out: /tmp/dxdfir_godfir_toolz_molecule/out
    molecule_sample_image: ""
  tasks:
    - name: "molecule-prepare | require a sample disk image"
      ansible.builtin.assert:
        that:
          - molecule_sample_image | length > 0
        fail_msg: >-
          Provide -e molecule_sample_image=<path/to/raw-or-E01-image> (large/binary;
          not shipped). It should contain at least one Windows registry hive or
          Amcache.hve for the scenario to produce output.
        quiet: true

    - name: "molecule-prepare | start from a clean scenario dir"
      ansible.builtin.file:
        path: "{{ molecule_out | dirname }}"
        state: absent

    - name: "molecule-prepare | image input dir exists"
      ansible.builtin.file:
        path: "{{ molecule_in }}"
        state: directory
        mode: "0755"

    # Keep the source extension: libewf globs EWF segment files BY EXTENSION, so
    # an E01 renamed .raw fails to open ("unsupported extension").
    - name: "molecule-prepare | stage the sample image"
      ansible.builtin.copy:
        src: "{{ molecule_sample_image }}"
        dest: "{{ molecule_in }}/sample{{ molecule_sample_image | splitext | last }}"
        mode: "0644"
