---
# godfir-toolz output gate, included at the end of dxdfir_lane's process block
# instead of the default one: the export's own index (image_export.jsonl) is not
# tool output, so the gate reads the Go tools' summaries — some tool produced
# output, UNLESS no tool found an artefact to parse (a non-Windows image is
# NORMAL, not a failure). Per-item failures are tolerated
# (dxdfir_lane_require_no_failures is false). A trusted literal assert —
# dxdfir_lane_summaries + dxdfir_lane_verify are in scope from the shared
# process step.
- name: "godfir-toolz-process | assert output was produced for the artefacts present"
  ansible.builtin.assert:
    that:
      - >-
        (dxdfir_lane_verify.files | map(attribute='path')
         | reject('search', '/_extracted/') | list | length > 0)
        or (dxdfir_lane_summaries | rejectattr('tool', 'equalto', 'plaso')
            | map(attribute='inputs') | map('int') | sum) == 0
    fail_msg: >-
      godfir-toolz produced no output at all though artefacts were exported
      (every tool container failed?).
    quiet: true
