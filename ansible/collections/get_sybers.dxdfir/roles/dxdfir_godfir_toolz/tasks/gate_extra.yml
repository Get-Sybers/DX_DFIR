---
# godfir-toolz output gate, included at the end of dxdfir_lane's process block: some
# host produced output, UNLESS there were no images or nothing but empties
# (images == empty — a non-Windows image with no artefact set is NORMAL, not a
# failure). Per-image failures are tolerated (dxdfir_lane_require_no_failures is
# false for this lane), so this gates on output. A trusted literal assert —
# dxdfir_lane_run + dxdfir_lane_verify are in scope from the shared process step.
- name: "godfir-toolz-process | assert output was produced for the images present"
  ansible.builtin.assert:
    that:
      - >-
        dxdfir_lane_verify.matched | int > 0 or
        ((dxdfir_lane_run.stdout | from_json).images | int ==
         (dxdfir_lane_run.stdout | from_json).empty | int)
    fail_msg: >-
      godfir-toolz produced no output at all though disk images were present
      (every tool container failed?).
    quiet: true
