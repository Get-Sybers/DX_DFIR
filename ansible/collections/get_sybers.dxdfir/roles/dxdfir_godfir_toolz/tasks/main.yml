---
# Disk images -> the GoDFIR-toolz artefact parse: export, the Windows Go
# tools, godaemonhunter's hunt — all contract-driven runs delegated to
# dxdfir_lane (semantics: README.md). Content decides; exits 1/3 tolerated.

- name: "godfir-toolz | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_godfir_toolz_input_dir | length > 0
      - dxdfir_godfir_toolz_tools | length > 0
    fail_msg: >-
      dxdfir_godfir_toolz needs a non-empty dxdfir_godfir_toolz_input_dir and at
      least one tool in dxdfir_godfir_toolz_tools.
    quiet: true
  tags: [always]

# the VM-export tree is optional: declared only when it exists
- name: "godfir-toolz | stat the optional VM-export tree"
  ansible.builtin.stat:
    path: "{{ dxdfir_godfir_toolz_vm_dir }}"
  when: dxdfir_godfir_toolz_vm_dir | length > 0
  register: dxdfir_godfir_toolz_vm_stat
  tags: [always]

# facts persist for the whole play, so the run list is reset before accumulating
- name: "godfir-toolz | start from an empty run list"
  ansible.builtin.set_fact:
    dxdfir_godfir_toolz_runs: []
  tags: [always]

- name: "godfir-toolz | one image_export run per image tree"
  ansible.builtin.set_fact:
    dxdfir_godfir_toolz_runs: >-
      {{ dxdfir_godfir_toolz_runs + [{
           'name': 'image_export:' ~ (item | basename),
           'contract': dxdfir_godfir_toolz_plaso_contract,
           'image': dxdfir_godfir_toolz_plaso_image,
           'subtool': 'image_export',
           'env': {'PLASO_IMAGE_EXPORT_FILTER_FILE': '/filters/godfir-toolz.yaml',
                   'PLASO_IMAGE_EXPORT_VSS': dxdfir_godfir_toolz_vss,
                   'PLASO_IMAGE_EXPORT_FORCE': dxdfir_godfir_toolz_force},
           'mounts': [{'host': item, 'path': '/input', 'mode': 'ro'},
                      {'host': dxdfir_godfir_toolz_stage_dir, 'path': '/output', 'mode': 'rw'},
                      {'host': dxdfir_godfir_toolz_filter_file, 'path': '/filters/godfir-toolz.yaml', 'mode': 'ro'}],
         }] }}
  loop: >-
    {{ [dxdfir_godfir_toolz_input_dir]
       + ([dxdfir_godfir_toolz_vm_dir]
          if (dxdfir_godfir_toolz_vm_stat.stat | default({})).isdir | default(false) else []) }}
  tags: [always]

- name: "godfir-toolz | one run per Go tool over the export"
  ansible.builtin.set_fact:
    dxdfir_godfir_toolz_runs: >-
      {{ dxdfir_godfir_toolz_runs + [{
           'name': item,
           'contract': dxdfir_godfir_toolz_toolz_dir ~ '/' ~ item ~ '/contract.yml',
           'env': dict([[(item | upper) ~ '_FORCE', dxdfir_godfir_toolz_force]]),
           'mounts': [{'host': dxdfir_godfir_toolz_stage_dir, 'path': '/input', 'mode': 'ro'},
                      {'host': dxdfir_godfir_toolz_out_dir ~ '/' ~ item, 'path': '/output', 'mode': 'rw'}],
         }] }}
  loop: "{{ dxdfir_godfir_toolz_tools }}"
  tags: [always]

# the Linux matrix is ONE entry: hunt's layering is internal, and over a
# Windows-only export it exits 1 by design (lights up when Linux content arrives)
- name: "godfir-toolz | the Linux matrix in one run (godaemonhunter hunt)"
  ansible.builtin.set_fact:
    dxdfir_godfir_toolz_runs: >-
      {{ dxdfir_godfir_toolz_runs + [{
           'name': 'godaemonhunter',
           'contract': dxdfir_godfir_toolz_toolz_dir ~ '/godaemonhunter/contract.yml',
           'subtool': 'hunt',
           'env': {'GODAEMONHUNTER_FORCE': dxdfir_godfir_toolz_force},
           'mounts': [{'host': dxdfir_godfir_toolz_stage_dir, 'path': '/input', 'mode': 'ro'},
                      {'host': dxdfir_godfir_toolz_out_dir ~ '/godaemonhunter', 'path': '/output', 'mode': 'rw'}],
         }] }}
  tags: [always]

# the export tree pre-exists (container-writable) so the ro-mount check passes on a fresh host
- name: "godfir-toolz | ensure the export tree exists"
  ansible.builtin.file:
    path: "{{ dxdfir_godfir_toolz_stage_dir }}"
    state: directory
    mode: "0777"
  tags: [always]

- name: "godfir-toolz | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dxdfir_lane
  vars:
    dxdfir_lane_name: godfir-toolz
    dxdfir_lane_runs: "{{ dxdfir_godfir_toolz_runs }}"
    dxdfir_lane_verify_dir: "{{ dxdfir_godfir_toolz_out_dir }}"
    dxdfir_lane_verify_glob: "*.jsonl"
    dxdfir_lane_require_no_failures: false
    dxdfir_lane_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]
