---
# dxdfir_godfir_toolz: disk images -> the GoDFIR-toolz artefact parse. The role
# GROUPS; the playbook DECIDES. Three kinds of run, each a contract-driven
# container: the plaso image's image_export sub-tool pulls the godfir-toolz
# artefact set out of every image into the export tree (a filter file mounted
# read-only, PLASO_IMAGE_EXPORT_FILTER_FILE), then each self-orchestrating Go
# tool image (gore, gojle, gole, goamcache, goappcompat, gosbe, gorb, gomft,
# goese, goprefetch) content-detects its artefacts anywhere under that tree and
# writes one folder per item under <out_dir>/<tool>/, and godaemonhunter — the
# Linux matrix in ONE image — runs `hunt` (every stream, the default) over the
# same tree: Layer 1 builds the image's knowledge store, the daemon parsers run
# enriched by it, one aggregate summary line. Each tool skips items with
# valid output unless <TOOL>_FORCE. A tool with nothing to parse (a non-Windows
# image for the Go tools, a non-Linux export for godaemonhunter) exits 1 and a
# tool with a failed item exits 3 — both tolerated
# (dxdfir_lane_require_no_failures=false), so the gate is purely "some tool
# produced output, or there were no artefacts". No routing logic — content
# decides, as everywhere else. This role asserts its own input
# rules and declares the runs, then delegates the shared build + preflight +
# process skeleton to dxdfir_lane.

- name: "godfir-toolz | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_godfir_toolz_input_dir | length > 0
      - dxdfir_godfir_toolz_tools | length > 0
    fail_msg: >-
      dxdfir_godfir_toolz needs a non-empty dxdfir_godfir_toolz_input_dir and at
      least one tool in dxdfir_godfir_toolz_tools.
    quiet: true
  tags: [always]

# The VM-export tree is optional: an export run is declared for it when it exists.
- name: "godfir-toolz | stat the optional VM-export tree"
  ansible.builtin.stat:
    path: "{{ dxdfir_godfir_toolz_vm_dir }}"
  when: dxdfir_godfir_toolz_vm_dir | length > 0
  register: dxdfir_godfir_toolz_vm_stat
  tags: [always]

# Facts persist for the whole play (a serial "process all"), so the run list is
# reset before it is accumulated.
- name: "godfir-toolz | start from an empty run list"
  ansible.builtin.set_fact:
    dxdfir_godfir_toolz_runs: []
  tags: [always]

- name: "godfir-toolz | one image_export run per image tree"
  ansible.builtin.set_fact:
    dxdfir_godfir_toolz_runs: >-
      {{ dxdfir_godfir_toolz_runs + [{
           'name': 'image_export:' ~ (item | basename),
           'contract': dxdfir_godfir_toolz_plaso_contract,
           'image': dxdfir_godfir_toolz_plaso_image,
           'subtool': 'image_export',
           'env': {'PLASO_IMAGE_EXPORT_FILTER_FILE': '/filters/godfir-toolz.yaml',
                   'PLASO_IMAGE_EXPORT_VSS': dxdfir_godfir_toolz_vss,
                   'PLASO_IMAGE_EXPORT_FORCE': dxdfir_godfir_toolz_force},
           'mounts': [{'host': item, 'path': '/input', 'mode': 'ro'},
                      {'host': dxdfir_godfir_toolz_stage_dir, 'path': '/output', 'mode': 'rw'},
                      {'host': dxdfir_godfir_toolz_filter_file, 'path': '/filters/godfir-toolz.yaml', 'mode': 'ro'}],
         }] }}
  loop: >-
    {{ [dxdfir_godfir_toolz_input_dir]
       + ([dxdfir_godfir_toolz_vm_dir]
          if (dxdfir_godfir_toolz_vm_stat.stat | default({})).isdir | default(false) else []) }}
  tags: [always]

- name: "godfir-toolz | one run per Go tool over the export"
  ansible.builtin.set_fact:
    dxdfir_godfir_toolz_runs: >-
      {{ dxdfir_godfir_toolz_runs + [{
           'name': item,
           'contract': dxdfir_godfir_toolz_toolz_dir ~ '/' ~ item ~ '/contract.yml',
           'env': dict([[(item | upper) ~ '_FORCE', dxdfir_godfir_toolz_force]]),
           'mounts': [{'host': dxdfir_godfir_toolz_stage_dir, 'path': '/input', 'mode': 'ro'},
                      {'host': dxdfir_godfir_toolz_out_dir ~ '/' ~ item, 'path': '/output', 'mode': 'rw'}],
         }] }}
  loop: "{{ dxdfir_godfir_toolz_tools }}"
  tags: [always]

# The Linux matrix joins as ONE entry (GoDFIR-toolz docs/linux decisions
# 15–17): godaemonhunter is a multi-tool image, so the lane names its
# `hunt` sub-tool — every stream, the default. The layering is internal
# (Layer 1 -> <out>/knowledge -> enriched daemon parsers), so no
# per-parser ordering or knowledge plumbing here. Over a Windows-only
# export it finds nothing and exits 1 — tolerated by design, exactly like
# a Go tool over a non-Windows image; it lights up when Linux content
# reaches the tree (the native linux-core export is the plan's P2).
- name: "godfir-toolz | the Linux matrix in one run (godaemonhunter hunt)"
  ansible.builtin.set_fact:
    dxdfir_godfir_toolz_runs: >-
      {{ dxdfir_godfir_toolz_runs + [{
           'name': 'godaemonhunter',
           'contract': dxdfir_godfir_toolz_toolz_dir ~ '/godaemonhunter/contract.yml',
           'subtool': 'hunt',
           'env': {'GODAEMONHUNTER_FORCE': dxdfir_godfir_toolz_force},
           'mounts': [{'host': dxdfir_godfir_toolz_stage_dir, 'path': '/input', 'mode': 'ro'},
                      {'host': dxdfir_godfir_toolz_out_dir ~ '/godaemonhunter', 'path': '/output', 'mode': 'rw'}],
         }] }}
  tags: [always]

# The export tree is every Go tool's read-only input, but it does not exist
# before the first export run — create it (container-writable) ahead of the
# build so the read-only-mount check passes on a fresh host.
- name: "godfir-toolz | ensure the export tree exists"
  ansible.builtin.file:
    path: "{{ dxdfir_godfir_toolz_stage_dir }}"
    state: directory
    mode: "0777"
  tags: [always]

- name: "godfir-toolz | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dxdfir_lane
  vars:
    dxdfir_lane_name: godfir-toolz
    dxdfir_lane_runs: "{{ dxdfir_godfir_toolz_runs }}"
    dxdfir_lane_verify_dir: "{{ dxdfir_godfir_toolz_out_dir }}"
    dxdfir_lane_verify_glob: "*.jsonl"
    dxdfir_lane_require_no_failures: false
    dxdfir_lane_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]
