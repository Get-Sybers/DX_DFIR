---
argument_specs:
  main:
    short_description: "Windows hosts -> the gowindowlicker parse, one folder per parser, host and item."
    description:
      - >-
        Runs the get-sybers/gowindowlicker image's parsers over every HOST from
        the image's contract. A host is a folder of loose event logs directly
        under dxdfir_gowindowlicker_winevt_dir (logs/winevt/<host>/*.evtx —
        goevtx only, one confined run per host) or a disk image under
        dxdfir_gowindowlicker_input_dir / dxdfir_gowindowlicker_vm_dir (E01/Ex01,
        raw, VMDK, VHDX, VHD, QCOW2, VDI), which the parsers run ON: one sweep
        run per image (GOWINDOWLICKER_IMAGE), the image's baked-in gomount
        pulling every parser's artefact set out of the OS volume into /work —
        bound to dxdfir_gowindowlicker_work_dir — while they run; nothing is
        exported. The sweep writes <out_dir>/<subtool>/<host>/<item>/<subtool>.jsonl
        — the item the artefact's volume path, separators folded to _ — so the
        tree is host-centric. Idempotent per item: a parser skips an item with
        valid output unless dxdfir_gowindowlicker_force. A parser with nothing
        to parse or a failed item is tolerated; the gate is "some parser
        produced output, or no artefacts".
      - >-
        With dxdfir_gowindowlicker_collection set, the output and the scratch
        land one level below their leaves
        (processed/windowlicker/<collection>/, processed/_scratch/windowlicker/<collection>/).
    options:
      dxdfir_gowindowlicker_collection:
        type: str
        required: false
        default: ""
        description: "The collection this run is scoped to (the CLI passes it); scopes the output and scratch paths."
      dxdfir_gowindowlicker_winevt_dir:
        type: str
        required: false
        description: "Loose Windows event logs, one folder per host (default data_store/raw/logs/winevt); logs at its root are reported, not parsed."
      dxdfir_gowindowlicker_input_dir:
        type: str
        required: false
        description: "Disk-image tree (E01/Ex01, raw/dd/img, VMDK, VHDX, VHD, QCOW2, VDI), recursed; every image a host the parsers run on."
      dxdfir_gowindowlicker_vm_dir:
        type: str
        required: false
        description: "VM export folders (one sub-folder per VM); optional — read when the directory exists."
      dxdfir_gowindowlicker_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/windowlicker[/<collection>]); <subtool>/<host>/<item>/ beneath it."
      dxdfir_gowindowlicker_work_dir:
        type: str
        required: false
        description: >-
          Disk-backed scratch bound at /work per image (default data_store/processed/_scratch/windowlicker[/<collection>]); the artefact sets pulled
          off an image live there only while its parsers run.
      dxdfir_gowindowlicker_image_regex:
        type: str
        required: false
        description: "What counts as a disk image inside a tree (a case-insensitive regex over the whole name)."
      dxdfir_gowindowlicker_exclude_regex:
        type: str
        required: false
        description: "The parts of another item, never hosts (a VMDK's -flat/-sNNN extents, an EWF set's .E02… segments)."
      dxdfir_gowindowlicker_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the contract's (get-sybers/gowindowlicker:latest); e.g. a digest pin."
      dxdfir_gowindowlicker_force:
        type: bool
        required: false
        default: false
        description: "Reparse items that already have output."
