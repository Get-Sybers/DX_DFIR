---
- name: Converge
  hosts: localhost
  gather_facts: true
  vars:
    dxdfir_gowindowlicker_winevt_dir: /tmp/dxdfir_gowindowlicker_molecule/winevt
    # no disk images: no per-image sweep run is declared, only the loose host's goevtx
    dxdfir_gowindowlicker_input_dir: /tmp/dxdfir_gowindowlicker_molecule/images
    dxdfir_gowindowlicker_vm_dir: ""
    dxdfir_gowindowlicker_out_dir: /tmp/dxdfir_gowindowlicker_molecule/out
    dxdfir_gowindowlicker_work_dir: /tmp/dxdfir_gowindowlicker_molecule/_scratch
    # Uses the default image (get-sybers/gowindowlicker); build it first with
    # playbooks/dxdfir-build-images.yml.
  tasks:
    - name: "converge | run dxdfir_gowindowlicker"
      ansible.builtin.include_role:
        name: dxdfir_gowindowlicker
