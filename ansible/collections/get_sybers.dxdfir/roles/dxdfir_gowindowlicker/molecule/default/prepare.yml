---
# A .evtx is binary, so no fixture ships in-repo. Point this at a sample log to run
# the scenario (goevtx rides the bundled gowindowlicker image — nothing else needed):
#   molecule test -- -e molecule_sample_evtx=/path/Security.evtx
- name: Prepare
  hosts: localhost
  gather_facts: false
  vars:
    molecule_winevt_in: /tmp/dxdfir_gowindowlicker_molecule/winevt
    molecule_out: /tmp/dxdfir_gowindowlicker_molecule/out
    molecule_sample_evtx: ""
  tasks:
    - name: "molecule-prepare | require a sample .evtx"
      ansible.builtin.assert:
        that:
          - molecule_sample_evtx | length > 0
        fail_msg: >-
          Provide -e molecule_sample_evtx=<path/to/*.evtx> (binary; not shipped).
        quiet: true

    - name: "molecule-prepare | start from a clean scenario dir"
      ansible.builtin.file:
        path: "{{ molecule_out | dirname }}"
        state: absent

    - name: "molecule-prepare | one host folder under the event-log tree"
      ansible.builtin.file:
        path: "{{ molecule_winevt_in }}/HOST01"
        state: directory
        mode: "0755"

    - name: "molecule-prepare | stage the sample .evtx"
      ansible.builtin.copy:
        src: "{{ molecule_sample_evtx }}"
        dest: "{{ molecule_winevt_in }}/HOST01/Security.evtx"
        mode: "0644"
