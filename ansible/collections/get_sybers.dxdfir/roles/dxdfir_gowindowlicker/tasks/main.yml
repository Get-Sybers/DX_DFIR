---
# dxdfir_gowindowlicker: discover the loose event-log hosts and the disk images
# (shared dxdfir_evidence), then delegate the run to
# get_sybers.godfir_run.godfir_gowindowlicker (imported by URL).
- name: "gowindowlicker | assert inputs"
  ansible.builtin.assert:
    that:
      - (dxdfir_gowindowlicker_winevt_dir | length > 0) or (dxdfir_gowindowlicker_input_dir | length > 0)
    fail_msg: >-
      dxdfir_gowindowlicker needs an input source (dxdfir_gowindowlicker_winevt_dir
      or dxdfir_gowindowlicker_input_dir).
    quiet: true
  tags: [always]

- name: "gowindowlicker | discover disk images + loose event-log hosts"
  ansible.builtin.include_role:
    name: dxdfir_evidence
  vars:
    dxdfir_evidence_trees:
      - "{{ dxdfir_gowindowlicker_input_dir }}"
      - "{{ dxdfir_gowindowlicker_vm_dir }}"
    dxdfir_evidence_host_dir: "{{ dxdfir_gowindowlicker_winevt_dir }}"
  tags: [always]

- name: "gowindowlicker | run the get-sybers gowindowlicker lane"
  ansible.builtin.include_role:
    name: get_sybers.godfir_run.godfir_gowindowlicker
  vars:
    godfir_gowindowlicker_images: "{{ dxdfir_evidence_images }}"
    godfir_gowindowlicker_winevt_hosts: "{{ dxdfir_evidence_hosts | map(attribute='export') | list }}"
    godfir_gowindowlicker_out_dir: "{{ dxdfir_gowindowlicker_out_dir }}"
    godfir_gowindowlicker_work_dir: "{{ dxdfir_gowindowlicker_work_dir }}"
    godfir_gowindowlicker_image: "{{ dxdfir_gowindowlicker_image }}"
    godfir_gowindowlicker_force: "{{ dxdfir_gowindowlicker_force }}"
  tags: [always]
