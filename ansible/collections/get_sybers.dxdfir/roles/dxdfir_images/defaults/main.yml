---
# Repo root is five levels up from this role
# (roles/dxdfir_images -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_images_repo_root: "{{ role_path }}/../../../../.."

# The get_sybers image namespace: every built tool image is tagged
# <namespace>/<name>:latest (e.g. get-sybers/plaso:latest). One knob renames
# the whole family; the build contract asserts against it too.
dxdfir_images_namespace: get-sybers

# Run-as uid/gid baked into every built image's USER. dxdfir_runtime_uid/gid is the
# single override knob — set it via extra-var or inventory (e.g.
# -e dxdfir_runtime_uid=3000) to move all images + their runs off 2000; unset, it
# defaults to 2000 here. Passed as build args to each Dockerfile and asserted in
# the build contract, so the build and the runtime share one uid. (get-sybers/volatility
# is built from the third_party/piiat-mem submodule — Get-Sybers/PIIAT-Mem#2.)
dxdfir_images_uid: "{{ dxdfir_runtime_uid | default(2000) }}"
# gid follows the uid unless explicitly set, so setting only dxdfir_runtime_uid
# still yields a matched USER <uid>:<uid>, never <uid>:2000.
dxdfir_images_gid: "{{ dxdfir_runtime_gid | default(dxdfir_runtime_uid | default(2000)) }}"

# DX_DFIR's own docker/ build context (yara, suricata, zeek, plaso) — each
# Dockerfile COPYs the shared ansible hardening playbook
# (docker/hardening/harden.yml) from here.
dxdfir_images_context: "{{ dxdfir_images_repo_root }}/docker"

# The GoDFIR-toolz submodule root. EvtxECmd, the whole Eric Zimmerman tool
# family, and the GoDFIR Go tools (goevtx/gomft/gorb/goprefetch/goese/
# goamcache/goappcompat) build from here; the
# submodule carries its own hardening/harden.yml (COPYd by its Dockerfiles).
dxdfir_images_eztools_context: "{{ dxdfir_images_repo_root }}/third_party/GoDFIR-toolz"

# The build-it-yourself image set. Every runtime tool container is built from
# an in-repo (or submodule), ansible-hardened Dockerfile — nothing is pulled
# from a third party at runtime. Each entry: name (the <namespace>/<name> tag,
# and — for the docker/ context — the dir under docker/) — the build is verified
# against the hardening contract afterwards.
dxdfir_images_set:
  - signatures    # the whole detection lane in one image: yara + suricata + hayabusa
  - zeek
  - volatility
  - plaso
  # The last still-.NET Eric Zimmerman tool — built from the ONE parameterized
  # eztool/Dockerfile in the GoDFIR-toolz submodule, tool selected via build args
  # (see dxdfir_images_build_overrides). Every other EZ tool is now a Go substitute.
  - sqlecmd
  # GoDFIR Go tools, each FROM scratch (no shell, no python, just the static Go
  # binary) from its OWN subdir in the submodule:
  #   goprefetch replaces PECmd            — XP->Win11 .pf, MAM-compressed included
  #   goese      replaces SrumECmd/SumECmd — SRUDB.dat / SUM Current.mdb
  #   gorb       replaces RBCmd (drops .NET) — Recycle Bin $I records
  #   gomft      replaces MFTECmd (drops .NET, on go-ntfs) — $MFT
  #   goevtx     replaces EvtxECmd (drops .NET, on go-evtx) — .evtx
  #   goamcache/goappcompat replace AmcacheParser/AppCompatCacheParser (regparser)
  #   gore/gosbe replace RECmd/SBECmd (regparser, dirty-hive .LOG replay)
  #   gole/gojle replace LECmd/JLECmd (golnk/mscfb) — .lnk / jump lists
  #   gowxt      replaces WxTCmd (modernc sqlite) — ActivitiesCache.db (built, #88)
  - goprefetch
  - goese
  - gorb
  - gomft
  - goevtx
  - goamcache
  - goappcompat
  - gore
  - gosbe
  - gole
  - gojle
  - gowxt

# Rebuild even when an image already exists (docker build cache still applies).
dxdfir_images_force: false

# Per-image build context/dockerfile overrides.
#   - volatility: the PIIAT-Mem submodule (its own docker/ context carries harden.yml).
#   - sqlecmd (the last .NET EZ tool): the GoDFIR-toolz submodule root (context =
#     the submodule root so eztool/Dockerfile reaches its hardening/harden.yml).
#   - every goX tool: FROM scratch, so each context is its OWN subdir under the
#     submodule (go.mod/main.go live there).
dxdfir_images_build_overrides:
  volatility:
    context: "{{ dxdfir_images_repo_root }}/third_party/piiat-mem/docker"
    dockerfile: "Dockerfile"
  sqlecmd: {context: "{{ dxdfir_images_eztools_context }}", dockerfile: "eztool/Dockerfile", args: {EZTOOL: "SQLECmd"}}
  goprefetch: {context: "{{ dxdfir_images_eztools_context }}/goprefetch", dockerfile: "Dockerfile"}
  goese: {context: "{{ dxdfir_images_eztools_context }}/goese", dockerfile: "Dockerfile"}
  gorb: {context: "{{ dxdfir_images_eztools_context }}/gorb", dockerfile: "Dockerfile"}
  gomft: {context: "{{ dxdfir_images_eztools_context }}/gomft", dockerfile: "Dockerfile"}
  goevtx: {context: "{{ dxdfir_images_eztools_context }}/goevtx", dockerfile: "Dockerfile"}
  goamcache: {context: "{{ dxdfir_images_eztools_context }}/goamcache", dockerfile: "Dockerfile"}
  goappcompat: {context: "{{ dxdfir_images_eztools_context }}/goappcompat", dockerfile: "Dockerfile"}
  gore: {context: "{{ dxdfir_images_eztools_context }}/gore", dockerfile: "Dockerfile"}
  gosbe: {context: "{{ dxdfir_images_eztools_context }}/gosbe", dockerfile: "Dockerfile"}
  gole: {context: "{{ dxdfir_images_eztools_context }}/gole", dockerfile: "Dockerfile"}
  gojle: {context: "{{ dxdfir_images_eztools_context }}/gojle", dockerfile: "Dockerfile"}
  gowxt: {context: "{{ dxdfir_images_eztools_context }}/gowxt", dockerfile: "Dockerfile"}
