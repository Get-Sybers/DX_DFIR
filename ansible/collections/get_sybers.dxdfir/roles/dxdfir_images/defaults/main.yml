---
# Repo root is five levels up from this role
# (roles/dxdfir_images -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_images_repo_root: "{{ role_path }}/../../../../.."

# The get_sybers image namespace: every built tool image is tagged
# <namespace>/<name>:latest (e.g. get-sybers/plaso:latest). One knob renames
# the whole family; the build contract asserts against it too.
dxdfir_images_namespace: get-sybers

# Run-as uid/gid baked into every built image's USER. dxdfir_runtime_uid/gid is the
# single override knob — set it via extra-var or inventory (e.g.
# -e dxdfir_runtime_uid=3000) to move all images + their runs off 2000; unset, it
# defaults to 2000 here. Passed as build args to each Dockerfile and asserted in
# the build contract, so the build and the runtime share one uid. (get-sybers/volatility
# is built from the third_party/piiat-mem submodule — Get-Sybers/PIIAT-Mem#2.)
dxdfir_images_uid: "{{ dxdfir_runtime_uid | default(2000) }}"
# gid follows the uid unless explicitly set, so setting only dxdfir_runtime_uid
# still yields a matched USER <uid>:<uid>, never <uid>:2000.
dxdfir_images_gid: "{{ dxdfir_runtime_gid | default(dxdfir_runtime_uid | default(2000)) }}"

# DX_DFIR's own docker/ build context (yara, suricata, zeek, plaso) — each
# Dockerfile COPYs the shared ansible hardening playbook
# (docker/hardening/harden.yml) from here.
dxdfir_images_context: "{{ dxdfir_images_repo_root }}/docker"

# The GoDFIR-toolz submodule root. EvtxECmd, the whole Eric Zimmerman tool
# family, and the GoDFIR Go tools (goevtx/gomft/gorb/goprefetch/goese/
# goamcache/goappcompat) build from here; the
# submodule carries its own hardening/harden.yml (COPYd by its Dockerfiles).
dxdfir_images_eztools_context: "{{ dxdfir_images_repo_root }}/docker/GoDFIR-toolz"

# The tool-image inventory — the ONE source of truth (repo-root images.yml),
# shared with the Python runtime guard (get_sybers_dxdfir.images). Each entry:
# name (+ optional context / dockerfile / args / ref). Add or change an image in
# images.yml, in ONE place. sources.yml carries the clone-at-build pins a `ref`
# points at.
dxdfir_images_manifest: >-
  {{ (lookup('file', dxdfir_images_repo_root ~ '/images.yml', errors='ignore') | default('', true) | from_yaml) or {} }}
dxdfir_images_sources: >-
  {{ (lookup('file', dxdfir_images_repo_root ~ '/sources.yml', errors='ignore') | default('', true) | from_yaml) or {} }}
# Names to build, in manifest order; build.yml resolves each one's build context,
# dockerfile and args (incl. a sources.yml `ref` -> <NAME>_REF) from its entry.
dxdfir_images_set: "{{ (dxdfir_images_manifest.images | default([])) | map(attribute='name') | list }}"

# Rebuild even when an image already exists (docker build cache still applies).
dxdfir_images_force: false

# Per-image build context / dockerfile / args now live in images.yml (one entry
# per image); tasks/build.yml resolves them from the manifest entry, including a
# `ref` -> <NAME>_REF build-arg whose sha comes from sources.yml (e.g. byakugan
# -> BYAKUGAN_REF). No separate overrides map — the manifest is the single source.
