---

dxdfir_images_repo_root: "{{ role_path }}/../../../../.."

# one knob renames the whole image family
dxdfir_images_namespace: get-sybers

# dxdfir_runtime_uid/gid is the single run-as knob: build args + contract asserts share it
dxdfir_images_uid: "{{ dxdfir_runtime_uid | default(2000) }}"
# gid follows the uid unless set, so a lone uid override still yields a matched USER
dxdfir_images_gid: "{{ dxdfir_runtime_gid | default(dxdfir_runtime_uid | default(2000)) }}"

# the GoDFIR-toolz submodule root: the build tree for every tool image
dxdfir_images_context: "{{ dxdfir_images_repo_root }}/docker/GoDFIR-toolz"

# the ONE inventory is the submodule's own root images.yml at the gitlink pin (see README)
dxdfir_images_manifest: >-
  {{ (lookup('file', dxdfir_images_context ~ '/images.yml', errors='ignore') | default('', true) | from_yaml) or {} }}
# names to build; empty = every manifest image, in manifest order
dxdfir_images_set: "{{ (dxdfir_images_manifest.images | default([])) | map(attribute='name') | list }}"

# rebuild even when present (docker build cache still applies)
dxdfir_images_force: false

# offline save/load: the manifest's built refs + the inventory layer's stack images, no hardcoded lists
dxdfir_images_tar_dir: "{{ dxdfir_images_repo_root }}/data_store/docker_images"
dxdfir_images_built_refs: >-
  {{ dxdfir_images_set
     | map('regex_replace', '^', dxdfir_images_namespace ~ '/')
     | map('regex_replace', '$', ':latest') | list }}
dxdfir_images_elastic_images: "{{ dxdfir_elastic_images | default({}) }}"
# save: only print the two sets and the tar dir, then stop (--list)
dxdfir_images_list_only: false

# ensure_built: full refs a calling play is about to run; missing ones get built
dxdfir_images_required: []

# verify: refs about to RUN — the build galaxy's gate behind the deploy-side freeze
dxdfir_images_verify_images: []
