---
argument_specs:
  main:
    short_description: "Build + verify the ansible-hardened get-sybers/* tool images."
    description:
      - >-
        Builds every runtime tool container from its Dockerfile in the
        GoDFIR-toolz submodule (context docker/GoDFIR-toolz, one directory per
        image), each of which runs the canonical ansible hardening playbook
        (hardening/harden.yml at the context root) inside the build and
        squashes the result: uid 0 renamed 'ansible' and locked, sudo/su/pkexec
        and the account-manipulation suite removed, every setuid/setgid bit
        stripped, package managers and pip removed (nothing installable at
        runtime), and the tool runs as a fixed non-root user (uid 2000). A shell
        and python remain because ansible IS the container's only execution path
        (its local connection needs them); attack surface is closed at the
        entry, not by deletion — the pinned ansible ENTRYPOINT runs an
        allow-listed run role, so a shell exists but nothing can invoke it.
        After each build the role asserts the contract statically (USER 2000:2000,
        pinned ENTRYPOINT, hardened label) AND from inside the running container. Nothing in the pipeline pulls a
        third-party tool image at runtime; the analysis backend (the Elastic
        stack under docker/elastic) is deployed separately with compose.
    options:
      dxdfir_images_context:
        type: str
        required: false
        description: "The GoDFIR-toolz submodule build context holding <name>/Dockerfile dirs and the canonical hardening/harden.yml."
      dxdfir_images_set:
        type: list
        elements: str
        required: false
        description: "Bare image names to build; each builds the get-sybers/<name>:latest tag. Default: every image in the repo-root images.yml manifest."
      dxdfir_images_force:
        type: bool
        required: false
        default: false
        description: "Rebuild images that already exist (docker layer cache still applies)."
  ensure_built:
    short_description: "Ensure a set of pinned tool images is built (build the missing ones)."
    description:
      - >-
        Reusable, idempotent gate (tasks/ensure_built.yml): reads the local image
        facts and BUILDS any requested image that is not built, before a play runs
        a container from it — a missing image self-heals in place, an already-built
        one is a no-op. Presence + self-heal only; the run-time supply-chain guard
        still enforces the hardened contract at run time.
    options:
      dxdfir_images_required:
        type: list
        elements: str
        required: false
        default: []
        description: "Full image refs the calling play needs built, e.g. get-sybers/goevtx:latest."
