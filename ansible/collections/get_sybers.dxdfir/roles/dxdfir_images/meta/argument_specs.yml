---
argument_specs:
  main:
    short_description: "Build + verify the hardened get-sybers/* tool images through the GoDFIR-toolz build galaxy."
    description:
      - >-
        The DEPLOY galaxy's face of the tool images. Building is DELEGATED to
        the GoDFIR-toolz collection's godfir_build role
        (godfir_build, resolved from the submodule checkout via roles_path so
        the gitlink is the only pin), run over the submodule tree: the
        manifest it resolves (images.yml), the contexts it builds and the
        revision it stamps (com.get-sybers.src) are all the pin's. Every
        built image is hardening-verified there — the static contract (fixed
        non-root USER, com.get-sybers.hardened label), a shell-free
        docker-export filesystem scan for the removed surface
        (apt/dpkg/sudo/pip/ansible), and the image's own /etc/dfir-hardened
        posture declaration held to the actual filesystem (shell=false /
        python=false). This role keeps the deploy-shaped decisions and
        mechanisms: the set to build, the single-source run-as uid/gid knob,
        the offline save/load packaging and the ensure_built lane gate.
        Nothing in the pipeline pulls a third-party tool image at runtime; the
        analysis backend (the Elastic stack) is deployed separately by the
        dxdfir_stack role.
    options:
      dxdfir_images_context:
        type: str
        required: false
        description: "The GoDFIR-toolz submodule build context holding <name>/Dockerfile dirs and the canonical hardening/harden.yml."
      dxdfir_images_set:
        type: list
        elements: str
        required: false
        description:
          - "Bare image names to build; each builds the get-sybers/<name>:latest
            tag. Default: every image in the GoDFIR-toolz submodule's
            images.yml manifest."
      dxdfir_images_force:
        type: bool
        required: false
        default: false
        description: "Rebuild images that already exist (docker layer cache still applies)."
  ensure_built:
    short_description: "Ensure a set of pinned tool images is built (build the missing ones)."
    description:
      - >-
        Reusable, idempotent gate (tasks/ensure_built.yml): reads the local image
        facts and BUILDS any requested image that is not built, before a play runs
        a container from it — a missing image self-heals in place, an already-built
        one is a no-op. Presence + self-heal only; the run-time supply-chain guard
        still enforces the hardened contract at run time.
    options:
      dxdfir_images_required:
        type: list
        elements: str
        required: false
        default: []
        description: "Full image refs the calling play needs built, e.g. get-sybers/gowindowlicker:latest."
  save:
    short_description: "Save the analysis images as tarballs for an offline host."
    description:
      - >-
        The offline mechanism's save half (tasks/save.yml): every built
        get-sybers/* image from the manifest (must already exist — never
        pulled) and every Elastic stack image (inventory
        dxdfir_elastic_images, pulled at the pin) exported one tarball each
        into dxdfir_images_tar_dir. Idempotent: an archive already holding
        the right image is left alone.
    options:
      dxdfir_images_tar_dir:
        type: str
        required: false
        description: "The tarball directory (default data_store/docker_images)."
      dxdfir_images_list_only:
        type: bool
        required: false
        default: false
        description: "Only print the two image sets and the tar dir, then stop."
  load:
    short_description: "Load every image tarball from the offline dir."
    description:
      - >-
        The offline mechanism's load half (tasks/load.yml): every *.tar in
        dxdfir_images_tar_dir loaded into the local daemon. Verification is
        dxdfir-verify-images.yml, run separately.
    options:
      dxdfir_images_tar_dir:
        type: str
        required: false
        description: "The tarball directory (default data_store/docker_images)."
  verify:
    short_description: "The runtime supply-chain gate (the build galaxy's verify, deploy-faced)."
    description:
      - >-
        Freeze the submodule root and delegate to
        godfir_build tasks_from=verify (the submodule role, on roles_path) - every
        namespace ref in dxdfir_images_verify_images must be a manifest image
        still carrying the hardened contract on this host; refs outside
        get-sybers/* pass untouched. Lane preflights call this before any
        container runs.
    options:
      dxdfir_images_verify_images:
        type: list
        elements: str
        required: false
        default: []
        description: "The image refs the caller is about to run."
  audit:
    short_description: "The full namespace inventory audit (the build galaxy's audit, deploy-faced)."
    description:
      - >-
        Freeze the submodule root and delegate to
        godfir_build tasks_from=audit (the submodule role, on roles_path) - every
        manifest image present and hardened, no unexpected get-sybers/* image
        on the host (allow-list = the manifest + its non_tool_repos). Driven
        by dxdfir-verify-images.yml (`dxdfir verify-images`).
    options: {}
