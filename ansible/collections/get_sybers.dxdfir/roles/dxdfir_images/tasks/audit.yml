---
# The full namespace inventory audit, the deploy galaxy's face of it: freeze
# the submodule root (the lazy include_role-vars trap — see tasks/main.yml)
# and delegate to the build galaxy's audit entry — every manifest image
# present and hardened, no unexpected get-sybers/* image on the host
# (allow-list = the manifest + its non_tool_repos). Driven by
# dxdfir-verify-images.yml (the `dxdfir verify-images` verb).

- name: "images-audit | stat the submodule inventory"
  ansible.builtin.stat:
    path: "{{ dxdfir_images_context }}/images.yml"
  register: dxdfir_images_context_stat

- name: "images-audit | resolve the deploy-side values to concrete strings"
  ansible.builtin.set_fact:
    # empty when the submodule tree is absent: the delegation passes it EMPTY and
    # godfir_build falls back to its own tree (the degraded-path
    # galaxy import at the same pin).
    dxdfir_images_context_resolved: >-
      {{ dxdfir_images_context if dxdfir_images_context_stat.stat.exists else '' }}

- name: "images-audit | audit through the GoDFIR-toolz build galaxy"
  ansible.builtin.include_role:
    name: godfir_build
    tasks_from: audit
  vars:
    godfir_build_root: "{{ dxdfir_images_context_resolved }}"
    godfir_build_uid: "{{ dxdfir_images_uid }}"
    godfir_build_gid: "{{ dxdfir_images_gid }}"
