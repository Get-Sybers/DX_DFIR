---
# The reusable presence + self-heal gate: build whatever in
# dxdfir_images_required is missing (idempotent; safe at the head of every
# container play). The sibling verify.yml still gates the hardened contract.

- name: "ensure-built | read the local image facts"
  community.docker.docker_image_info:
    name: "{{ dxdfir_images_required }}"
  register: dxdfir_images_built_info
  when: dxdfir_images_required | length > 0

- name: "ensure-built | resolve which required images are missing"
  vars:
    # an image present only under another tag is correctly treated as missing
    _present: >-
      {{ (dxdfir_images_built_info.images | default([]))
         | map(attribute='RepoTags') | flatten | select('string') | list }}
  ansible.builtin.set_fact:
    # missing refs mapped to their bare manifest names
    dxdfir_images_to_build: >-
      {{ dxdfir_images_required | reject('in', _present)
         | map('regex_replace', '^[^/]+/([^:]+):.*$', '\1') | list }}
  when: dxdfir_images_required | length > 0

- name: "ensure-built | build the missing tool image(s)"
  ansible.builtin.include_role:
    name: dxdfir_images
  vars:
    # build ONLY what is missing; each build is hardening-verified
    dxdfir_images_set: "{{ dxdfir_images_to_build }}"
  when: dxdfir_images_to_build | default([]) | length > 0
