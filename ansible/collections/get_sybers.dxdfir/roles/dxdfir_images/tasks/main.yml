---
# dxdfir_images: build every get-sybers/* tool image from its ansible-hardened
# Dockerfile (in docker/ or the EZTools-Docker submodule), then VERIFY the
# hardening contract on each. The role GROUPS; the playbook DECIDES which set to
# build (dxdfir_images_set).

- name: "images | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_images_set | length > 0
      - dxdfir_images_context | length > 0
    fail_msg: >-
      dxdfir_images needs a non-empty dxdfir_images_set and the docker/ build
      context (dxdfir_images_context).
    quiet: true
  tags: [always]

- name: "images | preflight"
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags: [always]
  tags: [always]

- name: "images | build + verify each image"
  ansible.builtin.include_tasks: build.yml
  loop: "{{ dxdfir_images_set }}"
  loop_control:
    loop_var: dxdfir_images_name
