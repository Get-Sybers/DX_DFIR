---
- name: "images-preflight | docker daemon reachable"
  ansible.builtin.command: docker version
  register: dxdfir_images_docker
  changed_when: false

# The hardening playbook has ONE canonical home: the GoDFIR-toolz submodule.
# Every tool image builds from the submodule (context = submodule root, or a
# per-tool subdir for the static Go tools), so the Dockerfiles COPY it
# directly — nothing is synced or generated. A checkout that skipped
# submodules has no build contexts at all — fail early and clearly.
- name: "images-preflight | stat the canonical hardening playbook (GoDFIR-toolz submodule)"
  ansible.builtin.stat:
    path: "{{ dxdfir_images_context }}/hardening/harden.yml"
  register: dxdfir_images_harden_stat

- name: "images-preflight | the GoDFIR-toolz submodule is checked out"
  ansible.builtin.assert:
    that:
      - dxdfir_images_harden_stat.stat.exists
    fail_msg: >-
      {{ dxdfir_images_context }}/hardening/harden.yml is missing — the
      GoDFIR-toolz submodule (the canonical home of the hardening playbook and
      of every tool-image build context) is not checked out. Run:
      git submodule update --init --recursive docker/GoDFIR-toolz
    quiet: true

# The pinned source identity every image is stamped with (com.get-sybers.src):
# the GoDFIR-toolz commit the build contexts come from. A pin bump changes it,
# and images-build then replaces any image whose stamp no longer matches.
- name: "images-preflight | resolve the GoDFIR-toolz pin"
  # noqa: command-instead-of-module — read-only rev-parse; the git module clones.
  ansible.builtin.command: git -C {{ dxdfir_images_context | quote }} rev-parse HEAD
  register: dxdfir_images_src
  changed_when: false

- name: "images-preflight | keep the pin as a fact"
  ansible.builtin.set_fact:
    dxdfir_images_src_sha: "{{ dxdfir_images_src.stdout | trim }}"
