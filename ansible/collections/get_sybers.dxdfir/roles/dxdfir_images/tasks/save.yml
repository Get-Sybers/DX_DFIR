---
# THE offline image mechanism, save half: every analysis image to one tarball
# each under dxdfir_images_tar_dir, carried to the offline host and loaded there
# (tasks/load.yml). In the pull model the get-sybers/* tool images are pulled
# from the registry (via godfir_images) then exported; the Elastic stack images
# are pulled at the inventory's pin and exported too.
- name: "images-save | the offline image sets"
  ansible.builtin.debug:
    msg:
      - "tool images (pulled from the registry): {{ dxdfir_images_refs | join(', ') }}"
      - "elastic stack (inventory dxdfir_elastic_images): {{ dxdfir_images_elastic_images.values() | list | join(', ') }}"
      - "tar dir: {{ dxdfir_images_tar_dir }}"

- name: "images-save | save both sets"
  when: not (dxdfir_images_list_only | bool)
  block:
    - name: "images-save | the elastic set is defined"
      ansible.builtin.assert:
        that:
          - dxdfir_images_elastic_images | length > 0
        fail_msg: >-
          dxdfir_elastic_images is empty — the inventory layer
          (playbooks/group_vars/all.yml) defines the Elastic stack's image set;
          run through the playbooks, or set it when using the role bare.
        quiet: true

    - name: "images-save | the tar dir exists"
      ansible.builtin.file:
        path: "{{ dxdfir_images_tar_dir }}"
        state: directory
        mode: "0755"

    - name: "images-save | pull the tool images from the registry"
      ansible.builtin.include_role:
        name: get_sybers.godfir_run.godfir_images
        tasks_from: ensure_present
      vars:
        godfir_images_required: "{{ dxdfir_images_refs }}"
        godfir_images_namespace: "{{ dxdfir_images_namespace }}"

    - name: "images-save | export the tool images"
      community.docker.docker_image_export:
        names: ["{{ item }}"]
        path: "{{ dxdfir_images_tar_dir }}/{{ item | regex_replace('[/:]', '_') }}.tar"
      loop: "{{ dxdfir_images_refs }}"

    - name: "images-save | pull the elastic stack images at the pin"
      community.docker.docker_image:
        name: "{{ item }}"
        source: pull
      loop: "{{ dxdfir_images_elastic_images.values() | unique | list }}"
      register: dxdfir_images_save_pull
      retries: 3
      delay: 5
      until: dxdfir_images_save_pull is not failed

    - name: "images-save | export the elastic stack images"
      community.docker.docker_image_export:
        names: ["{{ item }}"]
        path: "{{ dxdfir_images_tar_dir }}/{{ item | regex_replace('[/:]', '_') }}.tar"
      loop: "{{ dxdfir_images_elastic_images.values() | unique | list }}"
