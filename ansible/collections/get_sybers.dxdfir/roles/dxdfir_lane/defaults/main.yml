---
# Interface consumed by tasks/{preflight,process}.yml. A per-tool lane role sets
# these (in its own defaults/main.yml) and delegates via
# `include_role: name=dxdfir_lane`. Empty/neutral defaults here document the
# contract and keep the shared role importable on its own.

# Short lane token used in task names and diagnostics (e.g. "evtx").
dxdfir_lane_name: lane
# Python module the preflight import-checks (e.g. get_sybers_dxdfir.evtx).
dxdfir_lane_module: ""
# PYTHONPATH for the in-repo processor run + module import (a deployed install drops it).
dxdfir_lane_python_path: ""
# Tool images the supply-chain guard requires (only get-sybers/* are checked).
dxdfir_lane_images: []
# Input dirs that must exist before processing: [{name, path}].
dxdfir_lane_input_checks: []
# The processor command argv — the one genuinely per-lane piece.
dxdfir_lane_argv: []
# Output verification: scan dxdfir_lane_verify_dir for dxdfir_lane_verify_glob
# (empty glob => skip the on-disk verify step).
dxdfir_lane_verify_dir: ""
dxdfir_lane_verify_glob: ""
# Optional lane-specific output gate: a task file (absolute path) with the lane's
# own trusted assert on the run summary (dxdfir_lane_run) + verification
# (dxdfir_lane_verify), included at the end of the process block. Kept as a task —
# not an expression string — because ansible-core rejects evaluating
# variable-sourced templates in `that:`.
dxdfir_lane_gate_extra: ""

# Assert the processor reported zero failures (failed==0). Default: require it.
# Lanes whose processor legitimately exits 0 with per-item failures (plaso
# per-image, volatility per-plugin without symbols, zimmerman per-image) set this
# false and gate purely on their own "produced output unless nothing to do".
dxdfir_lane_require_no_failures: true
# Optional lane-specific preflight task file (absolute path), included after the
# input-dir asserts and before the module/image guards.
dxdfir_lane_preflight_extra: ""
