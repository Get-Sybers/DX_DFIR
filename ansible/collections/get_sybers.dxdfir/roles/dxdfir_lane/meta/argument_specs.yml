---
argument_specs:
  main:
    short_description: "Shared build + preflight + process skeleton for a hardened DFIR tool lane."
    description:
      - >-
        Runs the invariant lane skeleton so it lives once instead of copy-pasted per
        tool. build turns each declared run into a confined `docker run` from the
        tool's contract.yml (-e for each env override, -v for each mount — a host
        bind or a docker named volume — behind cap-drop ALL / no-new-privileges /
        pids-limit / read-only rootfs / tmpfs scratch / no network unless the
        contract opts in / --group-add for the evidence group; a secret_env value
        never reaches argv — it is written to a 0600 --env-file instead).
        preflight checks the docker daemon, self-heals missing get-sybers/* images
        and runs the hardened supply-chain guard on every image. process creates
        the read-write mounts, runs each container in order, parses its single
        JSON summary line, verifies output on disk, asserts failed==0 and the
        output gate, removes every secret env-file, and on any failure surfaces
        every run's summary + stderr as one diagnostic.
      - >-
        A per-tool lane role asserts its own input rules and declares its runs,
        then delegates here via include_role.
    options:
      dxdfir_lane_name:
        type: str
        required: false
        default: lane
        description: "Short lane token used in task names and diagnostics (e.g. evtx)."
      dxdfir_lane_runs:
        type: list
        elements: dict
        required: true
        description: >-
          The runs of the lane, in order — one tool container each:
          {name, contract, image?, subtool?, env{}, secret_env{},
          mounts[{host, path, mode} | {source, volume: true, path, mode}],
          network?}. See defaults/main.yml for the full field reference.
      dxdfir_lane_confinement:
        type: list
        elements: str
        required: false
        description: "The docker run confinement flags applied to every run."
      dxdfir_lane_tmpfs_opts:
        type: str
        required: false
        default: "rw,nosuid,nodev,exec,size=1g"
        description: "tmpfs options for /tmp and every unbound optional read-write contract mount."
      dxdfir_lane_exit_ok:
        type: list
        elements: int
        required: false
        default: [0, 1, 3]
        description: "Exit codes a run may return without failing the lane (the contract's 0/1/3)."
      dxdfir_lane_verify_dir:
        type: str
        required: false
        description: "Output dir scanned for produced artifacts."
      dxdfir_lane_verify_glob:
        type: str
        required: false
        description: "Glob proving output (empty => skip the on-disk verify step and the default gate)."
      dxdfir_lane_gate_extra:
        type: str
        required: false
        description: >-
          Optional lane-specific output-gate task file (absolute path) with the
          lane's own assert on the run summaries + on-disk verification, included
          at the end of the process block instead of the default gate.
      dxdfir_lane_require_no_failures:
        type: bool
        required: false
        default: true
        description: >-
          Assert every run reported failed==0. Set false for lanes whose tools
          tolerate per-item failures (exit 3, partial).
