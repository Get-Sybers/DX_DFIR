---
argument_specs:
  main:
    short_description: "Shared preflight + process skeleton for a hardened DFIR tool lane."
    description:
      - >-
        Runs the invariant lane skeleton so it lives once instead of copy-pasted per
        tool: preflight (docker reachable, each declared input dir exists, the
        processor module imports, every get-sybers/* tool image passes the hardened
        supply-chain guard) and the process block/rescue (run the processor argv,
        verify output on disk, assert failed==0 plus the lane's own gate, and on any
        failure surface the processor's JSON summary + stderr as one diagnostic).
      - >-
        A per-tool lane role asserts its own input rules and builds the interface
        vars below, then delegates here via include_role.
    options:
      dxdfir_lane_name:
        type: str
        required: false
        default: lane
        description: "Short lane token used in task names and diagnostics (e.g. evtx)."
      dxdfir_lane_module:
        type: str
        required: true
        description: "Python module the preflight import-checks (e.g. get_sybers_dxdfir.evtx)."
      dxdfir_lane_python_path:
        type: str
        required: false
        description: "PYTHONPATH for the in-repo processor run and module import check."
      dxdfir_lane_images:
        type: list
        elements: str
        required: false
        default: []
        description: "Tool images to require via the hardened supply-chain guard (only get-sybers/* are checked)."
      dxdfir_lane_input_checks:
        type: list
        elements: dict
        required: false
        default: []
        description: "Input dirs that must exist before processing, each {name, path}."
      dxdfir_lane_argv:
        type: list
        elements: str
        required: true
        description: "The processor command argv — the one genuinely per-lane piece."
      dxdfir_lane_verify_dir:
        type: str
        required: false
        description: "Output dir scanned for produced artifacts."
      dxdfir_lane_verify_glob:
        type: str
        required: false
        description: "Glob proving output (empty => skip the on-disk verify step)."
      dxdfir_lane_gate_extra:
        type: str
        required: false
        description: >-
          Optional lane-specific output-gate task file (absolute path) with the
          lane's own assert on the run summary + on-disk verification, included at
          the end of the process block.
      dxdfir_lane_require_no_failures:
        type: bool
        required: false
        default: true
        description: >-
          Assert the processor reported failed==0. Set false for lanes whose
          processor tolerates per-item failures (exits 0 with failed>0).
      dxdfir_lane_preflight_extra:
        type: str
        required: false
        description: >-
          Optional lane-specific preflight task file (absolute path), included after
          the input-dir asserts and before the module/image guards.
