---
galaxy_info:
  role_name: dxdfir_lane
  namespace: get_sybers
  author: Get-Sybers
  description: >-
    Shared skeleton for the hardened DFIR tool lanes: preflight (docker reachable,
    declared input dirs exist, the processor module imports, every get-sybers/* tool image
    passes the hardened supply-chain guard) and the process block/rescue (run the
    processor, verify output on disk, gate on its JSON summary). Consumed via
    include_role by the per-tool lane roles so the skeleton lives once, not six times.
  company: Get-Sybers
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions: [bookworm, trixie]
  galaxy_tags: [dfir, shared, container]

dependencies: []
