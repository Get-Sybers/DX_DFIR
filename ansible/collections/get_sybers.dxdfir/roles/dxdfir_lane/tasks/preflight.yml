---
# Shared preflight for every hardened tool lane (was copy-pasted into each lane's
# tasks/preflight.yml): fact-find + preconditions BEFORE any container runs or
# files are written. FIND FACTS -> check existence AND location.
#
# The calling lane supplies: dxdfir_lane_module (import-checked), the input dirs
# that must exist (dxdfir_lane_input_checks: [{name, path}]), the tool images to
# supply-chain-guard (dxdfir_lane_images), and — for lane-specific preconditions
# such as evtx's bundled goevtx image — an optional
# dxdfir_lane_preflight_extra task file, included at the point the per-lane checks
# historically ran (after the input-dir asserts, before the module/image guards).

- name: "preflight | docker daemon reachable | {{ dxdfir_lane_name }}"
  ansible.builtin.command: docker version
  register: dxdfir_lane_docker
  changed_when: false

- name: "preflight | stat each declared input dir | {{ dxdfir_lane_name }}"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ dxdfir_lane_input_checks }}"
  loop_control:
    label: "{{ item.name }}"
  register: dxdfir_lane_input_stats

- name: "preflight | input dirs exist and are directories | {{ dxdfir_lane_name }}"
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir is defined and item.stat.isdir
    fail_msg: >-
      {{ item.item.name }} ({{ item.item.path }}) is missing or is not a directory.
    quiet: true
  loop: "{{ dxdfir_lane_input_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Lane-specific preconditions (e.g. evtx's bundled-image vs operator-release
# checks). Runs at the same point the per-lane checks used to.
- name: "preflight | lane-specific checks | {{ dxdfir_lane_name }}"
  ansible.builtin.include_tasks: "{{ dxdfir_lane_preflight_extra }}"
  when: dxdfir_lane_preflight_extra | length > 0

# Most lanes drive a get_sybers_dxdfir.<lane> processor module; verify it imports.
# A lane that ansible drives directly (e.g. memory runs the self-orchestrating
# get-sybers/anamnesis container with no processor module) sets dxdfir_lane_module
# empty and skips this — the image supply-chain guard below still runs.
- name: "preflight | processor module imports | {{ dxdfir_lane_name }}"
  ansible.builtin.command:
    argv: ["python3", "-c", "import {{ dxdfir_lane_module }}"]
  environment:
    PYTHONPATH: "{{ dxdfir_lane_python_path }}"
  register: dxdfir_lane_import
  changed_when: false
  when: dxdfir_lane_module | default('') | length > 0

# Built gate: the precondition for running this lane's containers — every
# get-sybers/* tool image it runs must be built on the host. Idempotent and
# self-healing: a missing image is BUILT here (a no-op when already built), so a
# fresh host or one whose images predate a new tool provisions itself at the head
# of the lane rather than failing a run hours in. Reused from the dxdfir_images
# role; the hardened-contract guard below then enforces label + uid on what runs.
- name: "preflight | ensure this lane's tool images are built | {{ dxdfir_lane_name }}"
  ansible.builtin.include_role:
    name: dxdfir_images
    tasks_from: ensure_built
  vars:
    dxdfir_images_required: "{{ dxdfir_lane_images | select('match', '^get-sybers/') | list }}"

# Supply-chain guard: refuse to start unless every tool image about to run is a
# KNOWN hardened get-sybers/* image (label + uid + expected name). A substituted
# or un-hardened image stops the lane before any evidence is touched. A
# non-get-sybers image (e.g. an operator-supplied .NET runtime) is out of scope
# and passes (require() itself no-ops on it — see images.py).
- name: "preflight | tool images are known hardened get-sybers/* images | {{ dxdfir_lane_name }}"
  ansible.builtin.command:
    argv: ["python3", "-m", "get_sybers_dxdfir.images", "--require", "{{ item }}"]
  environment:
    PYTHONPATH: "{{ dxdfir_lane_python_path }}"
  loop: "{{ dxdfir_lane_images }}"
  register: dxdfir_lane_image_guard
  changed_when: false
  when: item is match('^get-sybers/')
