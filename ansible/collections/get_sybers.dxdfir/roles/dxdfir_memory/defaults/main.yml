---

dxdfir_memory_repo_root: "{{ role_path }}/../../../../.."

# subdir from the shared evidence taxonomy (evidence-taxonomy/)
dxdfir_memory_memory_lane: >-
  {{ ((lookup('file', dxdfir_memory_repo_root ~ '/evidence-taxonomy/memory.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('memory', true) }}
dxdfir_memory_memory_dir: "{{ dxdfir_memory_repo_root }}/data_store/raw/{{ dxdfir_memory_memory_lane }}"
dxdfir_memory_out_dir: "{{ dxdfir_memory_repo_root }}/data_store/processed/memory"
# the contract the lane is driven from; the image is always offline — symbols
# live in the persistent host cache below
dxdfir_memory_contract: "{{ dxdfir_memory_repo_root }}/docker/GoDFIR-toolz/anamnesis/contract.yml"
# the persistent symbol cache (symsrv layout): accumulates across runs; drop PDBs straight in
dxdfir_memory_symbols_dir: "{{ dxdfir_memory_repo_root }}/data_store/dependencies/memprocfs-symbols"
# empty = the contract's image; set to pin a digest
dxdfir_memory_image: ""
dxdfir_memory_force: false
# comma-separated collector names; empty = the default CAR set
dxdfir_memory_plugins: ""
