---
argument_specs:
  main:
    short_description: "memory images -> per-plugin JSON Lines (anamnesis / MemProcFS)."
    description:
      - >-
        Discovers memory images under dxdfir_memory_memory_dir and runs the CAR
        collector set (via the anamnesis container, a native MemProcFS engine — no
        Volatility, no Python), writing one <plugin>.jsonl per image plus car.db.
        Idempotent per collector: one whose valid .jsonl output already exists is
        skipped. The container is always offline (no PDB download, no network
        toggle): the PDB symbols the Windows plugins need live in the
        persistent host cache dxdfir_memory_symbols_dir, bind-mounted
        read-write at /opt/anamnesis/lib/Symbols.
    options:
      dxdfir_memory_memory_dir:
        type: str
        required: false
        description: "Directory tree of memory images to process (recursed); mounted read-only at /input inside the container."
      dxdfir_memory_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/memory); override to send output to a custom location."
      dxdfir_memory_symbols_dir:
        type: str
        required: false
        description: "Persistent MemProcFS symbol cache (default data_store/dependencies/memprocfs-symbols, symsrv layout); mounted read-write at /opt/anamnesis/lib/Symbols so it accumulates across runs."
      dxdfir_memory_contract:
        type: str
        required: false
        description: "The anamnesis contract.yml the lane is driven from (default docker/GoDFIR-toolz/anamnesis/contract.yml)."
      dxdfir_memory_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the contract's (get-sybers/anamnesis:latest); e.g. a digest pin."
      dxdfir_memory_plugins:
        type: str
        required: false
        default: ""
        description: "Comma-separated collector names (ANAMNESIS_PLUGINS); empty = the default CAR set."
      dxdfir_memory_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dxdfir package (in-repo/dev runs)."
      dxdfir_memory_force:
        type: bool
        required: false
        default: false
        description: "Rerun collectors that already have valid output."
