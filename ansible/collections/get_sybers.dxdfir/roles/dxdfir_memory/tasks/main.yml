---
# dxdfir_memory: memory images -> per-plugin JSONL. The role GROUPS; the
# playbook DECIDES. The lane runs the self-orchestrating, env-driven
# get-sybers/anamnesis image directly from its contract
# (docker/GoDFIR-toolz/anamnesis/contract.yml): it discovers images, runs the CAR
# collector set over each with a native MemProcFS engine (no Volatility, no
# Python), is idempotent per plugin, and emits the summary the gate reads. (The
# lane is named "memory" after the evidence it processes; the engine underneath
# is anamnesis.)
# Per-plugin failures are NORMAL (Windows plugins error without symbols), so
# dxdfir_lane_require_no_failures=false and the gate is purely "some plugin produced
# output, or there were no images".

- name: "memory | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_memory_memory_dir | length > 0
    fail_msg: >-
      dxdfir_memory needs a non-empty
      dxdfir_memory_memory_dir.
    quiet: true
  tags: [always]

# role_path resolves to THIS role here — capture the lane-specific output gate so
# dxdfir_lane includes memory's gate, not its default one.
- name: "memory | resolve lane-specific task paths"
  ansible.builtin.set_fact:
    dxdfir_memory_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]

# One run: the anamnesis contract's env (ANAMNESIS_*) and mounts (/mem ro,
# /out, /symbols) — dxdfir_lane builds the confined `docker run` from them.
# The container network stays off unless symbols-online (the contract's one
# `network: optional` case).
- name: "memory | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dxdfir_lane
  vars:
    dxdfir_lane_name: memory
    dxdfir_lane_python_path: "{{ dxdfir_memory_python_path }}"
    dxdfir_lane_runs:
      - name: anamnesis
        contract: "{{ dxdfir_memory_contract }}"
        image: "{{ dxdfir_memory_image }}"
        env:
          ANAMNESIS_FORCE: "{{ dxdfir_memory_force }}"
          ANAMNESIS_SYMBOLS_ONLINE: "{{ dxdfir_memory_symbols_online }}"
          ANAMNESIS_PLUGINS: "{{ dxdfir_memory_plugins }}"
        mounts:
          - {host: "{{ dxdfir_memory_memory_dir }}", path: /mem, mode: ro}
          - {host: "{{ dxdfir_memory_out_dir }}", path: /out, mode: rw}
          - {host: "{{ dxdfir_memory_symbols_dir }}", path: /symbols, mode: rw}
        network: "{{ dxdfir_memory_symbols_online }}"
    dxdfir_lane_verify_dir: "{{ dxdfir_memory_out_dir }}"
    dxdfir_lane_verify_glob: "*.jsonl"
    dxdfir_lane_require_no_failures: false
    dxdfir_lane_gate_extra: "{{ dxdfir_memory_gate_extra }}"
  tags: [always]
