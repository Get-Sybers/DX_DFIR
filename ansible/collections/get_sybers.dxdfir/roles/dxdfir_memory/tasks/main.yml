---
# Memory images -> per-plugin JSONL via the anamnesis image, delegated to
# dxdfir_lane (semantics: README.md). Per-plugin failures are NORMAL without
# symbols — the gate is "some plugin produced output, or there were no images".

- name: "memory | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_memory_memory_dir | length > 0
    fail_msg: >-
      dxdfir_memory needs a non-empty
      dxdfir_memory_memory_dir.
    quiet: true
  tags: [always]

# resolved HERE: role_path templated inside dxdfir_lane would name that role
- name: "memory | resolve lane-specific task paths"
  ansible.builtin.set_fact:
    dxdfir_memory_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]

# One run: the anamnesis contract's env (ANAMNESIS_*) and mounts (/input ro,
# /out rw, the persistent symbol cache rw at /opt/anamnesis/lib/Symbols) —
# dxdfir_lane builds the confined `docker run` from them (and creates every
# rw mount host dir container-writable). The image is always offline
# (contract `network: none`; the engine never downloads a PDB — symbols come
# from the mounted cache), so no network appears here.
- name: "memory | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dxdfir_lane
  vars:
    dxdfir_lane_name: memory
    dxdfir_lane_runs:
      - name: anamnesis
        contract: "{{ dxdfir_memory_contract }}"
        image: "{{ dxdfir_memory_image }}"
        env:
          ANAMNESIS_INPUT_DIR: /input
          ANAMNESIS_FORCE: "{{ dxdfir_memory_force }}"
          ANAMNESIS_PLUGINS: "{{ dxdfir_memory_plugins }}"
        mounts:
          - {host: "{{ dxdfir_memory_memory_dir }}", path: /input, mode: ro}
          - {host: "{{ dxdfir_memory_out_dir }}", path: /out, mode: rw}
          - {host: "{{ dxdfir_memory_symbols_dir }}", path: /opt/anamnesis/lib/Symbols, mode: rw}
    dxdfir_lane_verify_dir: "{{ dxdfir_memory_out_dir }}"
    dxdfir_lane_verify_glob: "*.jsonl"
    dxdfir_lane_require_no_failures: false
    dxdfir_lane_gate_extra: "{{ dxdfir_memory_gate_extra }}"
  tags: [always]
