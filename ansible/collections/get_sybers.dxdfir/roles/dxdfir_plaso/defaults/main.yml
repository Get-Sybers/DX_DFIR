---

# Repo root is five levels up from this role
# (roles/dxdfir_plaso -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_plaso_repo_root: "{{ role_path }}/../../../../.."

# The disk_images and VM_files subdirs come from the shared evidence taxonomy
# (evidence-taxonomy/), the one source of truth for where sort files evidence AND
# where this role reads it — the two can't drift. A missing taxonomy file falls
# back to the conventional subdir.
dxdfir_plaso_input_lane: >-
  {{ ((lookup('file', dxdfir_plaso_repo_root ~ '/evidence-taxonomy/disk_images.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('disk_images', true) }}
dxdfir_plaso_input_dir: "{{ dxdfir_plaso_repo_root }}/data_store/raw/{{ dxdfir_plaso_input_lane }}"
dxdfir_plaso_vm_lane: >-
  {{ ((lookup('file', dxdfir_plaso_repo_root ~ '/evidence-taxonomy/vm_files.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('VM_files', true) }}
dxdfir_plaso_vm_dir: "{{ dxdfir_plaso_repo_root }}/data_store/raw/{{ dxdfir_plaso_vm_lane }}"
# Loose-artefact trees (one folder per host: /var/log copies, mobile filesystem
# dumps, triage output) — parsed by log2timeline as directory sources. Empty =
# no loose sources (opt-in: loose trees can be very large).
dxdfir_plaso_loose_dir: ""
dxdfir_plaso_out_dir: "{{ dxdfir_plaso_repo_root }}/data_store/processed/log2timeline"
# Output base — consumed by
# tasks/process.yml. Override directly to send output to a custom location.
# The custom psort output module lives in the repo (dev-scripts), mounted into psort.
dxdfir_plaso_module: "{{ dxdfir_plaso_repo_root }}/dev-scripts/plaso/l2t_json_dxdfir.py"
# The hardened in-repo image (build with playbooks/dxdfir-build-images.yml).
dxdfir_plaso_image: "get-sybers/plaso:latest"
# In-repo runs use PYTHONPATH; a deployed run installs the package instead.
dxdfir_plaso_python_path: "{{ dxdfir_plaso_repo_root }}/python"
dxdfir_plaso_force: false

# The processor command argv, handed to the shared dxdfir_lane process step. This
# is the one genuinely per-lane piece; the run/verify/gate skeleton is shared.
dxdfir_plaso_argv: >-
  {{ ['python3', '-m', 'get_sybers_dxdfir.plaso', '--input-dir', dxdfir_plaso_input_dir, '--vm-dir', dxdfir_plaso_vm_dir,
  '--loose-dir', dxdfir_plaso_loose_dir,
  '--out-dir', dxdfir_plaso_out_dir, '--module', dxdfir_plaso_module, '--image', dxdfir_plaso_image]
  + (['--force'] if dxdfir_plaso_force | bool else []) }}
