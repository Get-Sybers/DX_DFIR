---
argument_specs:
  main:
    short_description: "disk images / VM exports / loose trees -> Plaso JSON Lines."
    description:
      - >-
        Drives the multi-tool get-sybers/plaso image from its contract: the
        log2timeline sub-tool (PLASO_LOG2TIMELINE_*) over dxdfir_plaso_input_dir
        — and over dxdfir_plaso_vm_dir / dxdfir_plaso_loose_dir when they exist —
        into storage/<source>/<source>.plaso, then the psort sub-tool
        (PLASO_PSORT_*) over storage/ into jsonl/<source>/timeline.jsonl. Each
        sub-tool discovers, batches and skips its own items; a source whose
        output exists is skipped unless dxdfir_plaso_force. Per-source failures
        are tolerated; the gate is "some timeline was produced, or there were no
        sources".
    options:
      dxdfir_plaso_input_dir:
        type: str
        required: false
        description: "Disk-image tree (E01/Ex01/raw/dd/img/vmdk/vhd/vhdx/qcow2/aff4/001/bin), recursed."
      dxdfir_plaso_vm_dir:
        type: str
        required: false
        description: "VM export folders (one sub-folder per VM); optional — processed when the directory exists."
      dxdfir_plaso_loose_dir:
        type: str
        default: ""
        description:
          - Loose-artefact trees, one folder per host (/var/log copies, mobile
            filesystem dumps, triage output), parsed by log2timeline as directory
            sources. Empty disables loose sources (opt-in — trees can be large).
      dxdfir_plaso_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/log2timeline); storage/ and jsonl/ hang off it."
      dxdfir_plaso_storage_dir:
        type: str
        required: false
        description: "Where log2timeline writes <source>/<source>.plaso (default <out_dir>/storage)."
      dxdfir_plaso_jsonl_dir:
        type: str
        required: false
        description: "Where psort writes <source>/timeline.jsonl (default <out_dir>/jsonl)."
      dxdfir_plaso_contract:
        type: str
        required: false
        description: "The plaso contract.yml the runs are built from (default docker/GoDFIR-toolz/plaso/contract.yml)."
      dxdfir_plaso_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the contract's (get-sybers/plaso:latest); e.g. a digest pin."
      dxdfir_plaso_vss:
        type: bool
        required: false
        default: true
        description: "log2timeline: process every VSS store of an image (PLASO_LOG2TIMELINE_VSS)."
      dxdfir_plaso_parsers:
        type: str
        required: false
        default: ""
        description: "log2timeline: parser preset/list (PLASO_LOG2TIMELINE_PARSERS); empty = plaso's default."
      dxdfir_plaso_output_format:
        type: str
        required: false
        default: json_line
        description: "psort: the output module (PLASO_PSORT_OUTPUT_FORMAT)."
      dxdfir_plaso_python_path:
        type: str
        required: false
        description: "PYTHONPATH for the image supply-chain guard (get_sybers_dxdfir.images); in-repo runs."
      dxdfir_plaso_force:
        type: bool
        required: false
        default: false
        description: "Rerun sources that already have a storage file / rendered timeline."
