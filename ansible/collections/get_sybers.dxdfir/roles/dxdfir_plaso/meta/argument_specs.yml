---
argument_specs:
  main:
    short_description: "disk images / VM exports -> enriched Plaso JSON Lines."
    description:
      - >-
        Discovers forensic images under dxdfir_plaso_input_dir (content-first) and VM
        exports under dxdfir_plaso_vm_dir, runs the Plaso two-step (log2timeline.py ->
        .plaso, then psort with the custom l2t_json_dxdfir output module) per source,
        and names each json_line output by the resolved image_hostname. Idempotent:
        an image whose .plaso db and recorded output both exist is skipped.
    options:
      dxdfir_plaso_pipeline:
        type: str
        required: false
        default: elastic
        choices: [elastic, sofelk]
        description: "Which backend to target; selects the output destination."
      dxdfir_plaso_input_dir:
        type: str
        required: false
        description: "Disk-image tree (E01/raw/img/dd/vmdk/vhd/vhdx/aff), recursed."
      dxdfir_plaso_vm_dir:
        type: str
        required: false
        description: "VMware VM export folders (one sub-folder per VM); optional."
      dxdfir_plaso_loose_dir:
        type: str
        default: ""
        description:
          - Loose-artefact trees, one folder per host (/var/log copies, mobile
            filesystem dumps, triage output), parsed by log2timeline as directory
            sources. Empty disables loose sources (opt-in — trees can be large).
      dxdfir_plaso_elastic_out_dir:
        type: str
        required: false
        description: "Elastic-path output dir (default data_store/processed/log2timeline)."
      dxdfir_plaso_sofelk_out_dir:
        type: str
        required: false
        description: "SOF-ELK-path output dir (delivered into SOF-ELK by dxdfir_ingest_sofelk)."
      dxdfir_plaso_out_dir:
        type: str
        required: false
        description: >-
          Resolved output base for the selected pipeline (defaults to the
          elastic/sofelk out dir per dxdfir_plaso_pipeline); override to send
          output to a custom location.
      dxdfir_plaso_module:
        type: str
        required: false
        description: "Path to the l2t_json_dxdfir.py psort output module (dev-scripts/plaso)."
      dxdfir_plaso_image:
        type: str
        required: false
        default: "get-sybers/plaso:latest"
        description: "The hardened in-repo Plaso image (build with playbooks/dxdfir-build-images.yml)."
      dxdfir_plaso_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dxdfir package (in-repo/dev runs)."
      dxdfir_plaso_force:
        type: bool
        required: false
        default: false
        description: "Reprocess images that already have output."
