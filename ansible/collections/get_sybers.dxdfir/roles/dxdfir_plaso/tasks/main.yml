---
# dxdfir_plaso: disk images / VM exports -> enriched Plaso JSONL. The role GROUPS; the
# playbook DECIDES. Idempotence (skip images with a .plaso db + recorded output)
# lives in the Python processor, not in a task's `when:`. This role asserts its own
# input rules, then delegates the shared preflight + process skeleton to dxdfir_lane.
# Per-image failures are tolerated (dxdfir_lane_require_no_failures=false), so the
# gate is purely "some timeline was produced, or there were no sources".

- name: "plaso | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_plaso_input_dir | length > 0
    fail_msg: >-
      dxdfir_plaso needs a non-empty
      dxdfir_plaso_input_dir.
    quiet: true
  tags: [always]

# role_path resolves to THIS role here — capture the lane-specific preflight +
# gate files so dxdfir_lane includes plaso's checks (l2t_json output module) and
# output gate, not its own.
- name: "plaso | resolve lane-specific task paths"
  ansible.builtin.set_fact:
    dxdfir_plaso_preflight_extra: "{{ role_path }}/tasks/preflight_extra.yml"
    dxdfir_plaso_gate_extra: "{{ role_path }}/tasks/gate_extra.yml"
  tags: [always]

# Output lands under the resolved dxdfir_plaso_out_dir default — the shared
# tasks only consume it. Only the
# disk-image input dir is required; dxdfir_plaso_vm_dir is optional (the processor
# tolerates its absence) so it is not declared as an input check.
- name: "plaso | run the shared tool-lane skeleton"
  ansible.builtin.include_role:
    name: dxdfir_lane
  vars:
    dxdfir_lane_name: plaso
    dxdfir_lane_module: get_sybers_dxdfir.plaso
    dxdfir_lane_python_path: "{{ dxdfir_plaso_python_path }}"
    dxdfir_lane_images: ["{{ dxdfir_plaso_image }}"]
    dxdfir_lane_input_checks:
      - name: disk-image input dir
        path: "{{ dxdfir_plaso_input_dir }}"
    dxdfir_lane_argv: "{{ dxdfir_plaso_argv }}"
    dxdfir_lane_verify_dir: "{{ dxdfir_plaso_out_dir }}/jsonl"
    dxdfir_lane_verify_glob: "*.jsonl"
    dxdfir_lane_require_no_failures: false
    dxdfir_lane_preflight_extra: "{{ dxdfir_plaso_preflight_extra }}"
    dxdfir_lane_gate_extra: "{{ dxdfir_plaso_gate_extra }}"
  tags: [always]
