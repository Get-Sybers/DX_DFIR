---
# dxdfir_plaso: discover the source trees (disk images / VM exports / loose) and
# delegate the log2timeline+psort run to get_sybers.godfir_run.godfir_plaso.
- name: "plaso | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_plaso_input_dir | length > 0
    fail_msg: "dxdfir_plaso needs a non-empty dxdfir_plaso_input_dir."
    quiet: true
  tags: [always]

- name: "plaso | run the get-sybers plaso lane"
  ansible.builtin.include_role:
    name: get_sybers.godfir_run.godfir_plaso
  vars:
    godfir_plaso_input_dir: "{{ dxdfir_plaso_input_dir }}"
    godfir_plaso_vm_dir: "{{ dxdfir_plaso_vm_dir }}"
    godfir_plaso_loose_dir: "{{ dxdfir_plaso_loose_dir }}"
    godfir_plaso_out_dir: "{{ dxdfir_plaso_out_dir }}"
    godfir_plaso_image: "{{ dxdfir_plaso_image }}"
    godfir_plaso_vss: "{{ dxdfir_plaso_vss }}"
    godfir_plaso_parsers: "{{ dxdfir_plaso_parsers }}"
    godfir_plaso_output_format: "{{ dxdfir_plaso_output_format }}"
    godfir_plaso_force: "{{ dxdfir_plaso_force }}"
  tags: [always]
