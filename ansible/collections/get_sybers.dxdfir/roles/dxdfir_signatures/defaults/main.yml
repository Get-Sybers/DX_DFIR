---

dxdfir_signatures_repo_root: "{{ role_path }}/../../../../.."

dxdfir_signatures_out_dir: "{{ dxdfir_signatures_repo_root }}/data_store/processed/detections"
# one folder per sub-tool, one per item under it

# empty = all four sub-tools (yara / suricata / hayabusa / scan — README.md)
dxdfir_signatures_lanes: []
# yara sources: files and/or memory (disk images are the scan sub-tool)
dxdfir_signatures_yara_sources: [files, memory]

# subdirs come from the shared evidence taxonomy (evidence-taxonomy/);
# a directory that does not exist is skipped — its run is not declared
dxdfir_signatures_files_dir: "{{ dxdfir_signatures_repo_root }}/data_store/raw/other_raw_data"
dxdfir_signatures_memory_dir: >-
  {{ dxdfir_signatures_repo_root }}/data_store/raw/{{
  ((lookup('file', dxdfir_signatures_repo_root ~ '/evidence-taxonomy/memory.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir | default('memory', true) }}
dxdfir_signatures_pcap_dir: >-
  {{ dxdfir_signatures_repo_root }}/data_store/raw/{{
  ((lookup('file', dxdfir_signatures_repo_root ~ '/evidence-taxonomy/pcaps.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir | default('pcaps', true) }}
dxdfir_signatures_disk_dir: >-
  {{ dxdfir_signatures_repo_root }}/data_store/raw/{{
  ((lookup('file', dxdfir_signatures_repo_root ~ '/evidence-taxonomy/disk_images.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir | default('disk_images', true) }}
dxdfir_signatures_evtx_dir: >-
  {{ dxdfir_signatures_repo_root }}/data_store/raw/{{
  ((lookup('file', dxdfir_signatures_repo_root ~ '/evidence-taxonomy/logs_winevt.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir | default('logs/winevt', true) }}
# the evtx lane's image export, shared: exported once for both lanes
dxdfir_signatures_evtx_stage_dir: "{{ dxdfir_signatures_repo_root }}/data_store/processed/windows_logs/_extracted_evtx"

# operator rulesets, mounted ro; empty = the baked set (docs/Signature-Rules.md)
dxdfir_signatures_yara_rules: ""        # a rules file or compiled index (yara + scan)
dxdfir_signatures_suricata_rules: ""    # a suricata.rules file
dxdfir_signatures_hayabusa_rules: ""    # a Sigma rules directory
# --set entries, e.g. "vars.address-groups.HOME_NET=[10.0.0.0/8]"
dxdfir_signatures_suricata_set: ""
# empty = the contract's default profile (verbose carries the MITRE columns)
dxdfir_signatures_hayabusa_profile: ""
# gomount --filter glob; empty = every file
dxdfir_signatures_scan_filter: ""

# the contract the lane is driven from
dxdfir_signatures_contract: "{{ dxdfir_signatures_repo_root }}/docker/GoDFIR-toolz/signatures/contract.yml"
# empty = the contract's image; set to pin a digest
dxdfir_signatures_image: ""
dxdfir_signatures_force: false
