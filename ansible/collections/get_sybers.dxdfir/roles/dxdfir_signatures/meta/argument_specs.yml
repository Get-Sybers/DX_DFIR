---
argument_specs:
  main:
    short_description: "YARA / Suricata / Hayabusa detection lanes -> JSONL."
    description:
      - >-
        Runs the signature engines over the evidence and writes one <lane>/ folder of
        detection JSONL under the output dir. Standalone — no processor run is needed
        first. YARA covers loose files, disk images (mounted read-only; needs
        /dev/fuse) and memory (Volatility vadyarascan); Suricata covers every capture
        the zeek processor discovers (magic-first); Hayabusa covers loose Windows
        Event Logs AND disk images via the staged image_export extraction it shares
        with the evtx processor (extracted once, reused by both). A source whose host
        prerequisites are missing notes it and produces nothing. Idempotent: a lane
        whose output already exists is skipped.
    options:
      dxdfir_signatures_pipeline:
        type: str
        required: false
        default: elastic
        choices: [elastic, sofelk]
        description: "Which backend to target; selects the output destination."
      dxdfir_signatures_elastic_out_dir:
        type: str
        required: false
        description: "Elastic-path output base (default data_store/processed/signatures)."
      dxdfir_signatures_sofelk_out_dir:
        type: str
        required: false
        description: "SOF-ELK-path output base (delivered into SOF-ELK by dxdfir_ingest_sofelk)."
      dxdfir_signatures_out_dir:
        type: str
        required: false
        description: >-
          Resolved output base for the selected pipeline (defaults to the
          elastic/sofelk out dir per dxdfir_signatures_pipeline); override to send
          output to a custom location.
      dxdfir_signatures_lanes:
        type: list
        elements: str
        required: false
        default: []
        description: "Lanes to run; empty = all. Any of: yara, suricata, hayabusa."
      dxdfir_signatures_stage_dir:
        type: str
        required: false
        default: ""
        description: >-
          Where the hayabusa lane stages disk-image EVTX extractions. Empty => the
          evtx processor's stage (data_store/processed/windows_logs/_extracted_evtx),
          so images staged by either lane are reused, never re-extracted.
      dxdfir_signatures_vss:
        type: bool
        required: false
        default: false
        description: "Include Volume Shadow Copies when staging disk images (hayabusa lane)."
      dxdfir_signatures_yara_sources:
        type: str
        required: false
        default: ""
        description: "YARA sources to run, comma list of files,disk,memory; empty = all."
      dxdfir_signatures_suricata_tuning_file:
        type: str
        required: false
        default: ""
        description: >-
          Per-pcap Suricata tuning file (INI; empty => the processor's default,
          data_store/dependencies/suricata-tuning.conf). Written as an editable
          template on first run; while it holds no real sections — or is not valid —
          HOME_NET is auto-detected per pcap and the derived values are recorded
          into it for the operator to edit. Tuning is reset per pcap.
      dxdfir_signatures_pcap_dir:
        type: str
        required: false
        default: ""
        description: >-
          Directory of captures the suricata sub-lane replays (empty => the
          processor default, data_store/raw/pcaps). A collection sets this to its
          sorted pcaps/ subdir (collection.LANES: signatures ->
          dxdfir_signatures_pcap_dir) so a sorted collection's captures reach
          suricata; without it the sub-lane finds nothing.
      dxdfir_signatures_disk_dir:
        type: str
        required: false
        default: ""
        description: >-
          Directory of disk images the yara disk scan and the hayabusa image-EVTX
          extraction read (empty => the processor default,
          data_store/raw/disk_images). A collection sets this to its sorted
          disk_images/ subdir (collection.LANES: dxdfir_signatures_disk_dir).
      dxdfir_signatures_memory_dir:
        type: str
        required: false
        default: ""
        description: >-
          Directory of memory images the yara memory scan reads (empty => the
          processor default, data_store/raw/memory). A collection sets this to its
          sorted memory/ subdir (collection.LANES: dxdfir_signatures_memory_dir).
      dxdfir_signatures_fetch:
        type: bool
        required: false
        default: false
        description: >-
          Provision rules when online: the YARA lane fetches the pinned
          DetectRaptor ruleset when it has no rules yet (sha256-verified,
          idempotent); other lanes note missing deps.
      dxdfir_signatures_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dxdfir package (in-repo/dev runs)."
      dxdfir_signatures_force:
        type: bool
        required: false
        default: false
        description: "Regenerate lane outputs that already exist."
