---
argument_specs:
  main:
    short_description: "YARA / Suricata / Hayabusa / disk-scan detection sub-tools -> JSONL."
    description:
      - >-
        Drives the multi-tool get-sybers/signatures image from its contract, one
        run per sub-tool and evidence tree: yara over loose files and memory
        images, suricata over the captures, hayabusa over the .evtx trees (loose
        logs and the evtx lane's disk-image export), scan (gomount -> goyara,
        userspace, no /dev/fuse) over the disk images. Each sub-tool discovers,
        batches and skips its own items; output is one folder per item under
        <out_dir>/<subtool>/. An evidence tree that does not exist is skipped.
        Rules are the ones baked into the image unless an operator ruleset is
        given. Standalone — no processor run is needed first.
    options:
      dxdfir_signatures_collection:
        type: str
        required: false
        default: ""
        description: "The collection this run is scoped to (the CLI passes it); every sub-tool's output lands one level down, detections/<sub-tool>/<collection>/."
      dxdfir_signatures_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/detections); one folder per sub-tool."
      dxdfir_signatures_lanes:
        type: list
        elements: str
        required: false
        default: []
        description: "Sub-tools to run; empty = all. Any of: yara, suricata, hayabusa, scan."
      dxdfir_signatures_yara_sources:
        type: list
        elements: str
        required: false
        default: [files, memory]
        description: "The yara sub-tool's sources: files (loose files) and/or memory (raw memory images)."
      dxdfir_signatures_files_dir:
        type: str
        required: false
        description: "Loose files the yara sub-tool scans (default data_store/raw/other_raw_data); every immediate child is a target."
      dxdfir_signatures_memory_dir:
        type: str
        required: false
        description: "Memory images the yara sub-tool scans directly (default data_store/raw/memory)."
      dxdfir_signatures_pcap_dir:
        type: str
        required: false
        description: "Captures the suricata sub-tool replays (default data_store/raw/pcaps)."
      dxdfir_signatures_evtx_dir:
        type: str
        required: false
        description: "Loose .evtx tree the hayabusa sub-tool scans (default data_store/raw/logs/winevt)."
      dxdfir_signatures_evtx_stage_dir:
        type: str
        required: false
        description: >-
          The shared disk-image artefact export (default
          data_store/processed/_extracted[/<collection>], dxdfir_export's stage —
          exported here when no other lane did it yet); every image's export is
          one hayabusa host.
      dxdfir_signatures_disk_dir:
        type: str
        required: false
        description: "Disk images the scan sub-tool streams through goyara (default data_store/raw/disk_images)."
      dxdfir_signatures_yara_rules:
        type: str
        required: false
        default: ""
        description: "Operator YARA ruleset file (yara + scan; SIGNATURES_YARA_RULES / SIGNATURES_SCAN_RULES); empty = the baked DetectRaptor merge."
      dxdfir_signatures_suricata_rules:
        type: str
        required: false
        default: ""
        description: "Operator suricata.rules file (SIGNATURES_SURICATA_RULES); empty = the baked ET Open merge."
      dxdfir_signatures_hayabusa_rules:
        type: str
        required: false
        default: ""
        description: "Operator Sigma rules directory (SIGNATURES_HAYABUSA_RULES); empty = the baked default set."
      dxdfir_signatures_suricata_set:
        type: str
        required: false
        default: ""
        description: "Suricata --set tuning entries, comma- or space-separated key=value (SIGNATURES_SURICATA_SET)."
      dxdfir_signatures_hayabusa_profile:
        type: str
        required: false
        default: ""
        description: "hayabusa output profile (SIGNATURES_HAYABUSA_PROFILE); empty = verbose."
      dxdfir_signatures_scan_filter:
        type: str
        required: false
        default: ""
        description: "scan: gomount --filter glob over the volume paths (SIGNATURES_SCAN_FILTER); empty = every file."
      dxdfir_signatures_contract:
        type: str
        required: false
        description: "The signatures contract.yml the runs are built from (default docker/GoDFIR-toolz/signatures/contract.yml)."
      dxdfir_signatures_image:
        type: str
        required: false
        default: ""
        description: "Image ref overriding the contract's (get-sybers/signatures:latest); e.g. a digest pin."
      dxdfir_signatures_force:
        type: bool
        required: false
        default: false
        description: "Rescan items that already have output (SIGNATURES_<SUBTOOL>_FORCE)."
