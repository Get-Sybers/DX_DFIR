---
- name: Converge
  hosts: localhost
  gather_facts: true
  vars:
    dxdfir_signatures_repo_root: /tmp/dxdfir_signatures_molecule/repo
    dxdfir_signatures_out_dir: /tmp/dxdfir_signatures_molecule/repo/data_store/processed/detections
    dxdfir_signatures_lanes: [yara]
    dxdfir_signatures_yara_sources: [files]
    # the fixture rule, mounted into the image as the operator ruleset
    dxdfir_signatures_yara_rules: /tmp/dxdfir_signatures_molecule/repo/data_store/dependencies/yara-rules/demo.yar
    # the fake repo has no contracts or python package — point both at the real repo.
    dxdfir_signatures_contract: "{{ (playbook_dir + '/../../../../../../../docker/GoDFIR-toolz/signatures/contract.yml') | realpath }}"
  tasks:
    - name: "converge | run dxdfir_signatures (yara over the loose files)"
      ansible.builtin.include_role:
        name: dxdfir_signatures
