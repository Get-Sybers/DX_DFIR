---
# dxdfir_signatures: resolve the evidence trees + output/scratch roots and
# delegate to get_sybers.godfir_run.godfir_signatures, which stats each tree and
# runs a sub-tool per present one. The role GROUPS; the playbook DECIDES.
- name: "signatures | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_signatures_lanes | difference(['yara', 'suricata', 'hayabusa', 'scan']) | length == 0
      - dxdfir_signatures_yara_sources | difference(['files', 'memory']) | length == 0
    fail_msg: >-
      dxdfir_signatures_lanes may only contain yara/suricata/hayabusa/scan and
      dxdfir_signatures_yara_sources only files/memory.
    quiet: true
  tags: [always]

- name: "signatures | run the get-sybers signatures lane"
  ansible.builtin.include_role:
    name: get_sybers.godfir_run.godfir_signatures
  vars:
    godfir_signatures_out_dir: "{{ dxdfir_signatures_out_dir }}"
    godfir_signatures_work_dir: "{{ dxdfir_signatures_work_dir }}"
    godfir_signatures_files_dir: "{{ dxdfir_signatures_files_dir }}"
    godfir_signatures_memory_dir: "{{ dxdfir_signatures_memory_dir }}"
    godfir_signatures_pcap_dir: "{{ dxdfir_signatures_pcap_dir }}"
    godfir_signatures_disk_dir: "{{ dxdfir_signatures_disk_dir }}"
    godfir_signatures_vm_dir: "{{ dxdfir_signatures_vm_dir }}"
    godfir_signatures_evtx_dir: "{{ dxdfir_signatures_evtx_dir }}"
    godfir_signatures_lanes: "{{ dxdfir_signatures_lanes }}"
    godfir_signatures_yara_sources: "{{ dxdfir_signatures_yara_sources }}"
    godfir_signatures_yara_rules: "{{ dxdfir_signatures_yara_rules }}"
    godfir_signatures_suricata_rules: "{{ dxdfir_signatures_suricata_rules }}"
    godfir_signatures_hayabusa_rules: "{{ dxdfir_signatures_hayabusa_rules }}"
    godfir_signatures_suricata_set: "{{ dxdfir_signatures_suricata_set }}"
    godfir_signatures_hayabusa_profile: "{{ dxdfir_signatures_hayabusa_profile }}"
    godfir_signatures_scan_filter: "{{ dxdfir_signatures_scan_filter }}"
    godfir_signatures_image: "{{ dxdfir_signatures_image }}"
    godfir_signatures_force: "{{ dxdfir_signatures_force }}"
  tags: [always]
