---
# dxdfir_stack: bring the Elastic analysis stack up/down. One role, five
# actions (dxdfir_stack_action); the playbook decides.

# Which lifecycle action: deploy | destroy | start | stop | status.
dxdfir_stack_action: status

# Repo root is five levels up from this role.
dxdfir_stack_repo_root: "{{ role_path }}/../../../../.."

# The stack's compose dir.
dxdfir_stack_compose_dir: "{{ dxdfir_stack_repo_root }}/docker/elastic"

# Env file for compose interpolation: the operator's .env next to the compose
# file (copied from .env.example, never committed).
dxdfir_stack_env_file: "{{ dxdfir_stack_compose_dir }}/.env"

# deploy: build images before starting (the stack uses prebuilt images, so this
# is a no-op unless a build is forced).
dxdfir_stack_build: true
# destroy: also remove named volumes (WIPES ingested data).
dxdfir_stack_remove_volumes: false

# The reusable ensure_running gate (tasks/ensure_running.yml) brings these compose
# services up and requires them running — the stack is not "up" until they are.
# deploy and start both run through it; a live-stack consumer can reuse it too.
dxdfir_stack_required_services:
  - elasticsearch
  - kibana

# Pull-capacity gate (tasks/preflight.yml, deploy/start only): free space (GiB)
# the image stores must offer while stack images are still to be pulled — a full
# cold pull of the five services runs ~10 GiB unpacked plus in-flight compressed
# layers. When short, the gate reclaims once (prune) before asserting.
dxdfir_stack_min_free_gib: 15
# The filesystems holding pulled image content: docker's data-root and, with the
# containerd image store, containerd's content store. The tightest one decides.
dxdfir_stack_image_store_paths:
  - /var/lib/docker
  - /var/lib/containerd
# Reclaim may also evict ALL unused images instead of only dangling build
# leftovers. Off by default: it would evict the warm get-sybers/* tool images
# and force full rebuilds.
dxdfir_stack_reclaim_all_images: false
