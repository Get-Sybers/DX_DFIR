---
# OPERATOR CONFIG lives in the inventory (playbooks/group_vars/all.yml,
# dxdfir_elastic_*) — the SINGLE SOURCE OF TRUTH (standards §29). Each shared
# identity, secret and path below REFERENCES its dxdfir_elastic_* counterpart
# directly, the §30 pattern (a role var references the collection var). There is
# NO fallback: a run without the inventory layer leaves dxdfir_elastic_* undefined
# and fails, which is correct — the missing source is the bug, not something to
# paper over with default() (standards §28). Only genuine role behaviour below
# carries a literal default. Semantics and the secret/TLS posture: README.md.
# Variable types: meta/argument_specs.yml.

# ---- role behaviour (the role's own inputs; the playbook flips the toggles)
dxdfir_stack_action: status
# playbook decision — continue | report | fail (an engine-less host answers the same way)
dxdfir_stack_when_absent: continue
# playbook decisions (tasks/docker_ensure.yml); off here, the deploy/start playbooks enable them
dxdfir_stack_install_docker: false
dxdfir_stack_start_docker: false
# false for runtimes that cannot grant memlock (rootless docker) — not a shared
# identity, so a plain role input, not sourced from the inventory
dxdfir_stack_es_memlock: true

# ---- shared identities: the inventory (dxdfir_elastic_*) is the source of truth
dxdfir_stack_name: "{{ dxdfir_elastic_stack_name }}"
dxdfir_stack_label_key: "{{ dxdfir_elastic_label_key }}"
dxdfir_stack_legacy_project: "{{ dxdfir_elastic_legacy_project }}"
# dxdfir_stack_labels is DERIVED from label_key + name (not an operator input),
# so it lives in vars/main.yml (§28), not here.

dxdfir_stack_elastic_version: "{{ dxdfir_elastic_version }}"
dxdfir_stack_network: "{{ dxdfir_elastic_network }}"
dxdfir_stack_volumes: "{{ dxdfir_elastic_volumes }}"
dxdfir_stack_bind: "{{ dxdfir_elastic_bind }}"
dxdfir_stack_es_port: "{{ dxdfir_elastic_es_port }}"
dxdfir_stack_kibana_port: "{{ dxdfir_elastic_kibana_port }}"
dxdfir_stack_fleet_port: "{{ dxdfir_elastic_fleet_port }}"
dxdfir_stack_es_heap: "{{ dxdfir_elastic_es_heap }}"
dxdfir_stack_namespace: "{{ dxdfir_elastic_namespace }}"
dxdfir_stack_ingest_dir: "{{ dxdfir_elastic_ingest_dir }}"
dxdfir_stack_config_dir: "{{ dxdfir_elastic_config_dir }}"
dxdfir_stack_images: "{{ dxdfir_elastic_images }}"
dxdfir_stack_containers:
  elasticsearch: "{{ dxdfir_stack_name }}-elasticsearch"
  kibana: "{{ dxdfir_stack_name }}-kibana"
  fleet-server: "{{ dxdfir_stack_name }}-fleet-server"
  filebeat: "{{ dxdfir_stack_name }}-filebeat"

# ---- secrets and deploy artifacts (the inventory generates and owns them;
# the secrets.yml entry assert is the clean diagnostic when one is missing)
dxdfir_stack_secrets_dir: "{{ dxdfir_elastic_secrets_dir }}"
dxdfir_stack_elastic_password: "{{ dxdfir_elastic_password }}"
dxdfir_stack_kibana_system_password: "{{ dxdfir_elastic_kibana_system_password }}"
dxdfir_stack_byakugan_loader_password: "{{ dxdfir_elastic_byakugan_loader_password }}"
dxdfir_stack_kibana_saved_objects_key: "{{ dxdfir_elastic_kibana_saved_objects_key }}"
dxdfir_stack_kibana_security_key: "{{ dxdfir_elastic_kibana_security_key }}"
dxdfir_stack_kibana_reporting_key: "{{ dxdfir_elastic_kibana_reporting_key }}"
dxdfir_stack_fleet_service_token: "{{ dxdfir_elastic_fleet_service_token }}"
dxdfir_stack_env_file: "{{ dxdfir_elastic_env_file }}"
dxdfir_stack_write_env_file: true
dxdfir_stack_certs_dir: "{{ dxdfir_elastic_certs_dir }}"
dxdfir_stack_ca_file: "{{ dxdfir_elastic_ca_file }}"
dxdfir_stack_legacy_env_file: "{{ dxdfir_elastic_legacy_env_file }}"
# an unprivileged deploy cannot hold node keys root:root 0640 — refuse to weaken unless opted in
dxdfir_stack_allow_world_readable_keys: false
# escalate (sudo) only the privileged deploy tasks — the TLS key lifecycle and the
# docker-engine setup — so node keys land root:root 0640 without running the whole
# play as root. The CLI sets this automatically for the converge verbs
# (`dx deploy stack` / `dx update stack`); it has no effect when already root.
dxdfir_stack_become: false
dxdfir_stack_secrets_group: docker

# 60 x 5s rides out a cold first boot on slow disks; a CI sandbox can shrink it
dxdfir_stack_wait_retries: 60
dxdfir_stack_wait_delay: 5

dxdfir_stack_required_services:
  - elasticsearch
  - kibana

# destroy: also remove named volumes (WIPES ingested data)
dxdfir_stack_remove_volumes: false

# playbook decision: deploy/start enable it; stop/destroy/status stay ungated — they free space
dxdfir_stack_pull_gate: false
# a full cold pull of the four services runs ~10 GiB unpacked plus in-flight compressed layers
dxdfir_stack_min_free_gib: 15
# docker's data-root and (containerd image store) the content store; the tightest decides
dxdfir_stack_image_store_paths:
  - /var/lib/docker
  - /var/lib/containerd
# off by default: reclaiming ALL unused images would evict the warm get-sybers/* tool images
dxdfir_stack_reclaim_all_images: false
