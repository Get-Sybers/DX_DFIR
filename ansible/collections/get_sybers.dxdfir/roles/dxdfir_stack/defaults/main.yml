---
# dxdfir_stack: bring the Elastic analysis stack up/down. One role, five
# actions (dxdfir_stack_action); the playbook decides.

# Which lifecycle action: deploy | destroy | start | stop | status.
dxdfir_stack_action: status

# Repo root is five levels up from this role.
dxdfir_stack_repo_root: "{{ role_path }}/../../../../.."

# The stack's compose dir. NOTE: the inventory layer
# (playbooks/group_vars/all.yml) wires this — with the env file, example and
# project name below — to the shared dxdfir_elastic_* identity, so every
# consumer of the backend references the same values; the defaults here are
# the self-contained fallback for running the role outside those playbooks.
dxdfir_stack_compose_dir: "{{ dxdfir_stack_repo_root }}/docker/elastic"

# The compose project's name (docker-compose.yml `name:`). Preflight reads
# the stack's containers and volumes by its label
# (com.docker.compose.project) — presence comes from gathered facts, BEFORE
# any .env is needed, so a cold host answers cleanly.
dxdfir_stack_project_name: byakugan

# THE PLAYBOOK DECIDES what an absent stack (no containers in any state, no
# named data volumes) means for its action — the role only groups:
#   continue — absence is the action's normal starting point (deploy);
#   report   — say "no stack" and end the host cleanly — the answer, not a
#              failure (status);
#   fail     — flag it: this action has nothing to act on (start/stop/destroy).
# An engine-less or daemon-less host (tasks/docker_ensure.yml) is answered by
# the same decision: no engine means no stack.
dxdfir_stack_when_absent: continue

# MORE PLAYBOOK DECISIONS (tasks/docker_ensure.yml). Install the docker
# engine when the host has none — Docker's own apt repository, Debian/Ubuntu
# families, the exact flow scripts/setup-environment.sh runs, as idempotent
# state modules. Off here; the deploy playbook enables it.
dxdfir_stack_install_docker: false
# Start (and enable) a stopped docker daemon. Off here; the playbooks that
# bring the stack up (deploy/start) enable it — status/stop/destroy never
# start system services.
dxdfir_stack_start_docker: false

# Env file for compose interpolation: the operator's .env next to the compose
# file (never committed). The deploy playbook scaffolds it on a cold host
# (below); operators can also copy .env.example by hand.
dxdfir_stack_env_file: "{{ dxdfir_stack_compose_dir }}/.env"

# COLD-START SCAFFOLD (tasks/env_scaffold.yml): with no .env AND no stack on
# the host at all, generate the .env from .env.example — every `change-me`
# placeholder filled with a locally generated secret — so the out-of-the-box
# deploy needs no manual step. THE DEPLOY PLAYBOOK ENABLES IT; off here so no
# other consumer of the role ever writes secrets. An existing .env is NEVER
# overwritten, and a host still carrying stack containers/volumes is never
# scaffolded for — fresh secrets cannot match the credentials already baked
# into the data volumes (preflight says to restore the operator .env instead).
dxdfir_stack_env_scaffold: false
# The key set's source of truth: keys added to the example flow into the
# scaffold; only placeholder values are generated.
dxdfir_stack_env_example_file: "{{ dxdfir_stack_compose_dir }}/.env.example"
# Generated secret lengths (alphanumeric): passwords (elastic, kibana_system,
# byakugan_loader — Elasticsearch wants >= 6) and *_KEY Kibana encryption keys
# (Kibana wants >= 32 chars; 64 matches the documented `openssl rand -hex 32`).
dxdfir_stack_env_password_length: 24
dxdfir_stack_env_key_length: 64
# Group handed read on the scaffolded .env when deploying as root (0640), so
# docker-group operators can read the credentials without sudo; skipped when
# the group does not exist or the deployer is unprivileged (0600).
dxdfir_stack_env_group: docker

# deploy: build images before starting (the stack uses prebuilt images, so this
# is a no-op unless a build is forced).
dxdfir_stack_build: true
# destroy: also remove named volumes (WIPES ingested data).
dxdfir_stack_remove_volumes: false

# The reusable ensure_running gate (tasks/ensure_running.yml) brings these compose
# services up and requires them running — the stack is not "up" until they are.
# deploy and start both run through it; a live-stack consumer can reuse it too.
dxdfir_stack_required_services:
  - elasticsearch
  - kibana

# Pull-capacity gate (tasks/preflight.yml) — ANOTHER PLAYBOOK DECISION: the
# playbooks whose action pulls images (deploy/start) enable it; off here so
# stop/destroy/status stay ungated — they are how an operator frees space.
dxdfir_stack_pull_gate: false
# Free space (GiB) the image stores must offer while stack images are still
# to be pulled — a full cold pull of the five services runs ~10 GiB unpacked
# plus in-flight compressed layers. When short, the gate reclaims once
# (prune) before asserting.
dxdfir_stack_min_free_gib: 15
# The filesystems holding pulled image content: docker's data-root and, with the
# containerd image store, containerd's content store. The tightest one decides.
dxdfir_stack_image_store_paths:
  - /var/lib/docker
  - /var/lib/containerd
# Reclaim may also evict ALL unused images instead of only dangling build
# leftovers. Off by default: it would evict the warm get-sybers/* tool images
# and force full rebuilds.
dxdfir_stack_reclaim_all_images: false
