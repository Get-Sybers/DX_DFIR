---
# dxdfir_stack: bring the Elastic analysis stack up/down. One role, five
# actions (dxdfir_stack_action); the playbook decides.

# Which lifecycle action: deploy | destroy | start | stop | status.
dxdfir_stack_action: status

# Repo root is five levels up from this role.
dxdfir_stack_repo_root: "{{ role_path }}/../../../../.."

# The stack's compose dir.
dxdfir_stack_compose_dir: "{{ dxdfir_stack_repo_root }}/docker/elastic"

# Env file for compose interpolation: the operator's .env next to the compose
# file (copied from .env.example, never committed).
dxdfir_stack_env_file: "{{ dxdfir_stack_compose_dir }}/.env"

# deploy: build images before starting (the stack uses prebuilt images, so this
# is a no-op unless a build is forced).
dxdfir_stack_build: true
# destroy: also remove named volumes (WIPES ingested data).
dxdfir_stack_remove_volumes: false
