---
argument_specs:
  main:
    short_description: "Bring the Elastic analysis stack up/down via docker compose."
    description:
      - >-
        Lifecycle for the docker-compose Elastic analysis backend: deploy
        (build if needed + bring up + verify running), destroy (down,
        optionally with volumes), start, stop and status. Localhost-only.
        Preflight reads the host first (containers + data volumes by compose
        project label, no .env needed) and THE PLAYBOOK DECIDES the rest:
        what absence means (dxdfir_stack_when_absent — status reports and
        ends, start/stop/destroy flag it, deploy continues), whether a cold
        host scaffolds docker/elastic/.env from .env.example with generated
        secrets (dxdfir_stack_env_scaffold — the deploy playbook), and
        whether the pull-capacity gate runs (dxdfir_stack_pull_gate —
        deploy/start).
    options:
      dxdfir_stack_action:
        type: str
        required: false
        default: status
        choices: [deploy, destroy, start, stop, status]
        description: "Which lifecycle action to run."
      dxdfir_stack_compose_dir:
        type: str
        required: false
        description: "The stack's compose dir (default docker/elastic)."
      dxdfir_stack_project_name:
        type: str
        required: false
        default: byakugan
        description: >-
          The compose project's name (docker-compose.yml `name:`) — preflight
          reads the stack's containers/volumes by its
          com.docker.compose.project label, before any .env is needed.
      dxdfir_stack_when_absent:
        type: str
        required: false
        default: continue
        choices: [continue, report, fail]
        description: >-
          The playbook's decision on an absent stack (no containers, no data
          volumes — and likewise an engine-less or daemon-less host): continue
          (deploy — absence is its starting point), report (status — say "no
          stack" and end the host cleanly), fail (start/stop/destroy — flag
          it, nothing to act on).
      dxdfir_stack_install_docker:
        type: bool
        required: false
        default: false
        description: >-
          Install the docker engine when the host has none (Docker's apt
          repo, Debian/Ubuntu families — the setup-environment.sh flow as
          state modules). Off in defaults; the deploy playbook enables it.
      dxdfir_stack_start_docker:
        type: bool
        required: false
        default: false
        description: >-
          Start (and enable) a stopped docker daemon. Off in defaults; the
          playbooks that bring the stack up (deploy/start) enable it.
      dxdfir_stack_env_file:
        type: str
        required: false
        description: "Env file for compose interpolation (default docker/elastic/.env)."
      dxdfir_stack_env_scaffold:
        type: bool
        required: false
        default: false
        description: >-
          Scaffold a default .env from .env.example (placeholder secrets
          generated, never overwriting an existing .env) — only on a cold
          host with no stack state at all. Off in defaults; the deploy
          playbook enables it.
      dxdfir_stack_env_example_file:
        type: str
        required: false
        description: >-
          The example env the scaffold reads as the key set's source of truth
          (default docker/elastic/.env.example).
      dxdfir_stack_env_password_length:
        type: int
        required: false
        default: 24
        description: "Length of generated placeholder passwords (alphanumeric; Elasticsearch wants >= 6)."
      dxdfir_stack_env_key_length:
        type: int
        required: false
        default: 64
        description: "Length of generated *_KEY encryption keys (alphanumeric; Kibana wants >= 32)."
      dxdfir_stack_env_group:
        type: str
        required: false
        default: docker
        description: >-
          Group handed read on the scaffolded .env (0640) when deploying as
          root; skipped when the group is absent or the deployer is
          unprivileged (0600).
      dxdfir_stack_build:
        type: bool
        required: false
        default: true
        description: "deploy: build images before starting (no-op for the prebuilt elastic stack)."
      dxdfir_stack_remove_volumes:
        type: bool
        required: false
        default: false
        description: "destroy: also remove named volumes (WIPES ingested data)."
      dxdfir_stack_required_services:
        type: list
        elements: str
        required: false
        default: [elasticsearch, kibana]
        description: "Compose services the ensure_running gate brings up and requires for the stack to count as up."
      dxdfir_stack_pull_gate:
        type: bool
        required: false
        default: false
        description: >-
          Run the pull-capacity gate. Off in defaults; the playbooks whose
          action pulls images (deploy/start) enable it — stop/destroy/status
          stay ungated, they are how an operator frees space.
      dxdfir_stack_min_free_gib:
        type: int
        required: false
        default: 15
        description: >-
          Free GiB the image stores must offer while stack images are still
          to be pulled (with the pull gate enabled); when short, the
          preflight reclaims (prune) once before asserting.
      dxdfir_stack_image_store_paths:
        type: list
        elements: str
        required: false
        default: [/var/lib/docker, /var/lib/containerd]
        description: "Filesystems holding pulled image content; the tightest one decides the pull-capacity gate."
      dxdfir_stack_reclaim_all_images:
        type: bool
        required: false
        default: false
        description: "Reclaim may evict ALL unused images, not just dangling ones (evicts warm tool images — off by default)."
  ensure_running:
    short_description: "Ensure the required compose services are running (bring the stack up)."
    description:
      - >-
        Reusable, idempotent gate (tasks/ensure_running.yml): brings the stack up
        (state present — a no-op when already running) and verifies every required
        service came up, before a play depends on the live stack. A stopped stack
        self-heals; deploy and start both run through it.
    options:
      dxdfir_stack_required_services:
        type: list
        elements: str
        required: false
        default: [elasticsearch, kibana]
        description: "Compose services that must be running."
