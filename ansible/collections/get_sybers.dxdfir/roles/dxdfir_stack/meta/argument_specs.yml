---
argument_specs:
  main:
    short_description: "Bring the Elastic-native analysis stack up/down via docker compose."
    description:
      - >-
        Lifecycle for the docker-compose Elastic analysis backend: deploy (build
        if needed + bring up + verify running), destroy (down, optionally with
        volumes), start, stop and status. Localhost-only. The stack uses prebuilt
        images and requires docker/elastic/.env.
    options:
      dxdfir_stack_action:
        type: str
        required: false
        default: status
        choices: [deploy, destroy, start, stop, status]
        description: "Which lifecycle action to run."
      dxdfir_stack_compose_dir:
        type: str
        required: false
        description: "Compose dir for the Elastic stack (default docker/elastic)."
      dxdfir_stack_env_file:
        type: str
        required: false
        description: "Env file for compose interpolation (default docker/elastic/.env)."
      dxdfir_stack_build:
        type: bool
        required: false
        default: true
        description: "deploy: build images before starting (no-op for the prebuilt elastic stack)."
      dxdfir_stack_remove_volumes:
        type: bool
        required: false
        default: false
        description: "destroy: also remove named volumes (WIPES ingested data)."
