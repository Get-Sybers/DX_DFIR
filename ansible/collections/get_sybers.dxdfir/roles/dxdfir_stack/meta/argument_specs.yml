---
argument_specs:
  main:
    short_description: "Deploy and run the Elastic analysis stack from inventory data."
    description:
      - >-
        Lifecycle for the ansible-native Elastic analysis backend: deploy
        (secrets + TLS material + network/volumes/containers in bootstrap
        order, verified), destroy (containers and network, optionally the
        data volumes), start, stop and status. Compose is retired — settings
        live in the inventory (playbooks/group_vars/all.yml,
        dxdfir_elastic_*), secrets in the per-host secret store there, and
        every dxdfir_stack_* value below references its dxdfir_elastic_*
        counterpart with a self-contained fallback. Preflight reads the host
        first (the docker engine, then containers + volumes by label — the
        role's own and the compose-era project label) and THE PLAYBOOK
        DECIDES the rest: what absence means (dxdfir_stack_when_absent),
        whether the engine is installed/started
        (dxdfir_stack_install_docker / dxdfir_stack_start_docker), and
        whether the pull-capacity gate runs (dxdfir_stack_pull_gate).
    options:
      dxdfir_stack_action:
        type: str
        required: false
        default: status
        choices: [deploy, destroy, start, stop, status]
        description: "Which lifecycle action to run."
      dxdfir_stack_name:
        type: str
        required: false
        default: byakugan
        description: "The stack's name: container-name prefix and the ownership label's value."
      dxdfir_stack_label_key:
        type: str
        required: false
        default: com.get-sybers.stack
        description: "The label every stack container/volume carries and every query reads."
      dxdfir_stack_legacy_project:
        type: str
        required: false
        default: byakugan
        description: >-
          The compose-era project label still honoured by presence, status,
          start, stop and destroy; deploy migrates such containers (volumes
          carry over).
      dxdfir_stack_when_absent:
        type: str
        required: false
        default: continue
        choices: [continue, report, fail]
        description: >-
          The playbook's decision on an absent stack (no containers, no data
          volumes — and likewise an engine-less or daemon-less host): continue
          (deploy — absence is its starting point), report (status — say "no
          stack" and end the host cleanly), fail (start/stop/destroy — flag
          it, nothing to act on).
      dxdfir_stack_install_docker:
        type: bool
        required: false
        default: false
        description: >-
          Install the docker engine when the host has none (Docker's apt
          repo, Debian/Ubuntu families — the setup-environment.sh flow as
          state modules). Off in defaults; the deploy playbook enables it.
      dxdfir_stack_start_docker:
        type: bool
        required: false
        default: false
        description: >-
          Start (and enable) a stopped docker daemon. Off in defaults; the
          playbooks that bring the stack up (deploy/start) enable it.
      dxdfir_stack_elastic_version:
        type: str
        required: false
        description: "The pinned Elastic version for every stack image (inventory: dxdfir_elastic_version)."
      dxdfir_stack_network:
        type: str
        required: false
        description: "The stack's docker network (inventory: dxdfir_elastic_network)."
      dxdfir_stack_volumes:
        type: dict
        required: false
        description: >-
          The named volumes (certs/esdata/kibanadata/fleetdata/filebeatdata
          -> docker volume names; inventory: dxdfir_elastic_volumes). certs
          exists for compose-era import/cleanup only — new deploys keep TLS
          material host-side.
      dxdfir_stack_images:
        type: dict
        required: false
        description: "Service -> image (pinned by dxdfir_stack_elastic_version); the pull gate reads this set."
      dxdfir_stack_containers:
        type: dict
        required: false
        description: "Service -> container name (defaults to <stack name>-<service>)."
      dxdfir_stack_secrets_dir:
        type: str
        required: false
        description: >-
          The per-host secret store (inventory: dxdfir_elastic_secrets_dir;
          default ansible/inventory/secrets/<host>). Generated-once files;
          an operator override (host_vars/vault) never materialises one.
      dxdfir_stack_write_env_file:
        type: bool
        required: false
        default: true
        description: >-
          Render the generated elastic.env handoff for tools outside ansible
          (go TUI, python, riskgate); false for vault-only operators feeding
          those tools by environment.
      dxdfir_stack_certs_dir:
        type: str
        required: false
        description: >-
          The stack's TLS tree (inventory: dxdfir_elastic_certs_dir),
          generated host-side by community.crypto state modules and
          bind-mounted read-only into the containers.
      dxdfir_stack_allow_world_readable_keys:
        type: bool
        required: false
        default: false
        description: >-
          Explicit opt-in for an unprivileged deploy to write 0644 node TLS
          keys (it cannot hold them at root:root 0640); without it such a
          deploy fails with the remedy instead of silently weakening key
          permissions.
      dxdfir_stack_secrets_group:
        type: str
        required: false
        default: docker
        description: >-
          Group handed read on the secret store when deploying as root
          (0750/0640); skipped when the group is absent or the deployer is
          unprivileged (0700/0600).
      dxdfir_stack_required_services:
        type: list
        elements: str
        required: false
        default: [elasticsearch, kibana]
        description: >-
          Services the ensure_running gate starts (existing containers only)
          and requires running/healthy for the stack to count as up.
      dxdfir_stack_es_memlock:
        type: bool
        required: false
        default: true
        description: >-
          Unlimited memlock on the elasticsearch container; false for
          runtimes that cannot grant the rlimit (rootless docker).
      dxdfir_stack_wait_retries:
        type: int
        required: false
        default: 60
        description: "Bring-up wait probes (elasticsearch/kibana readiness, the ensure_running gate)."
      dxdfir_stack_wait_delay:
        type: int
        required: false
        default: 5
        description: "Seconds between bring-up wait probes."
      dxdfir_stack_remove_volumes:
        type: bool
        required: false
        default: false
        description: "destroy: also remove named volumes (WIPES ingested data)."
      dxdfir_stack_pull_gate:
        type: bool
        required: false
        default: false
        description: >-
          Run the pull-capacity gate. Off in defaults; the playbooks whose
          action pulls images (deploy/start) enable it — stop/destroy/status
          stay ungated, they are how an operator frees space.
      dxdfir_stack_min_free_gib:
        type: int
        required: false
        default: 15
        description: >-
          Free GiB the image stores must offer while stack images are still
          to be pulled (with the pull gate enabled); when short, the
          preflight reclaims (prune) once before asserting.
      dxdfir_stack_image_store_paths:
        type: list
        elements: str
        required: false
        default: [/var/lib/docker, /var/lib/containerd]
        description: "Filesystems holding pulled image content; the tightest one decides the pull-capacity gate."
      dxdfir_stack_reclaim_all_images:
        type: bool
        required: false
        default: false
        description: "Reclaim may evict ALL unused images, not just dangling ones (evicts warm tool images — off by default)."
  docker_ensure:
    short_description: "Ensure the docker engine: installed, running, group in place."
    description:
      - >-
        Reusable entry point (tasks/docker_ensure.yml), run first by the
        stack preflight and directly by dxdfir-bootstrap.yml
        (scripts/setup-environment.sh drives it once ansible exists): reads
        the engine's state, answers an engine-less or daemon-less host by
        the dxdfir_stack_when_absent decision, installs the engine on the
        install opt-in (Docker's apt repository, Debian/Ubuntu families —
        the flow the setup script used to carry in shell), starts a stopped
        daemon on the start opt-in, and — on those same opt-ins, as root —
        ensures the docker group and the sudo'ing operator's membership.
    options:
      dxdfir_stack_when_absent:
        type: str
        required: false
        default: continue
        choices: [continue, report, fail]
        description: "What an engine-less/daemon-less host means (see main)."
      dxdfir_stack_install_docker:
        type: bool
        required: false
        default: false
        description: "Install the engine when the host has none."
      dxdfir_stack_start_docker:
        type: bool
        required: false
        default: false
        description: "Start (and enable) a stopped daemon."
  ensure_running:
    short_description: "Ensure the required stack services are running (start existing, verify healthy)."
    description:
      - >-
        Reusable, idempotent gate (tasks/ensure_running.yml): starts the
        required services' EXISTING containers (no config change, never a
        deploy) and waits until each is running — and healthy where its
        container defines a healthcheck — before a play depends on the live
        stack. A stopped stack self-heals; a missing one says "deploy
        first". deploy and start both run through it; live-stack consumers
        (dxdfir_car_load) reuse it.
    options:
      dxdfir_stack_required_services:
        type: list
        elements: str
        required: false
        default: [elasticsearch, kibana]
        description: "Services that must be running."
