---
# TLS material host-side as community.crypto state modules (layout and
# migration: README "Secrets and TLS"). Staged: the tree + one-way compose-era
# import, the CA (created once, never regenerated over an import), the instance
# certificates (from the dxdfir_stack_tls_instances matrix, SANs bind-derived),
# then the key/certificate permission posture. The node-key lifecycle is
# escalated by the caller (deploy.yml applies become to this include).

- name: "stack-certs | the tree and the compose-era import"
  ansible.builtin.include_tasks: certs_import.yml

- name: "stack-certs | the certificate authority"
  ansible.builtin.include_tasks: certs_ca.yml

- name: "stack-certs | the instance certificates"
  ansible.builtin.include_tasks: certs_instances.yml

- name: "stack-certs | the key and certificate posture"
  ansible.builtin.include_tasks: certs_perms.yml
