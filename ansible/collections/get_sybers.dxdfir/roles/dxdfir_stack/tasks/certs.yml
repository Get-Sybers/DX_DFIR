---
# TLS material host-side as community.crypto state modules (layout and
# migration: README "Secrets and TLS"). The CA pair is only ever CREATED,
# never regenerated over an import.

- name: "stack-certs | the certs tree exists"
  ansible.builtin.file:
    path: "{{ dxdfir_stack_certs_dir }}/{{ item }}"
    state: directory
    # 0755: public certs traverse via the bind mount; the keys below stay 0640/0600
    mode: "0755"
  loop:
    - ""
    - ca
    - es01
    - fleet-server

# ---- compose-era import (root: the volume mountpoint is readable) ----------
- name: "stack-certs | does a compose-era certs volume exist"
  community.docker.docker_volume_info:
    name: "{{ dxdfir_stack_volumes.certs }}"
  register: dxdfir_stack_certs_volume

- name: "stack-certs | import the compose-era certificates"
  when:
    - dxdfir_stack_certs_volume.exists
    - (ansible_facts.effective_user_id | default(-1)) | int == 0
  block:
    - name: "stack-certs | is the volume's CA there to import"
      ansible.builtin.stat:
        path: "{{ dxdfir_stack_certs_volume.volume.Mountpoint }}/ca/ca.crt"
      register: dxdfir_stack_legacy_ca

    - name: "stack-certs | find the volume's certificate files"
      ansible.builtin.find:
        paths: "{{ dxdfir_stack_certs_volume.volume.Mountpoint }}"
        patterns: ["*.crt", "*.key"]
        recurse: true
      register: dxdfir_stack_legacy_cert_files
      when: dxdfir_stack_legacy_ca.stat.exists

    # per file force: false — the store always wins; a partial volume imports what it has
    - name: "stack-certs | copy the compose-era certificates into the store"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ dxdfir_stack_certs_dir }}/{{ item.path | relpath(dxdfir_stack_certs_volume.volume.Mountpoint) }}"
        remote_src: true
        force: false
        mode: preserve
      loop: "{{ (dxdfir_stack_legacy_cert_files.files | default([]))
                | selectattr('path', 'search', '/(ca|es01|fleet-server)/') | list }}"
      loop_control:
        label: "{{ item.path | relpath(dxdfir_stack_certs_volume.volume.Mountpoint) }}"
      when: dxdfir_stack_legacy_ca.stat.exists

- name: "stack-certs | note the certs volume a non-root deploy cannot import"
  ansible.builtin.debug:
    msg: >-
      a compose-era certs volume ({{ dxdfir_stack_volumes.certs }}) exists but
      this deploy is unprivileged, so its CA cannot be imported — fresh
      certificates will be generated and Fleet agents enrolled against the
      old CA re-enrol. Run the deploy as root to keep the existing CA.
  when:
    - dxdfir_stack_certs_volume.exists
    - (ansible_facts.effective_user_id | default(-1)) | int != 0

# ---- the CA (created once; an imported CA is never regenerated) -------------
- name: "stack-certs | is a CA already in the store"
  ansible.builtin.stat:
    path: "{{ dxdfir_stack_certs_dir }}/ca/ca.crt"
  register: dxdfir_stack_ca_stat

- name: "stack-certs | create the CA"
  when: not dxdfir_stack_ca_stat.stat.exists
  block:
    - name: "stack-certs | CA private key"
      community.crypto.openssl_privatekey:
        path: "{{ dxdfir_stack_certs_dir }}/ca/ca.key"
        mode: "0600"

    - name: "stack-certs | CA signing request"
      community.crypto.openssl_csr:
        path: "{{ dxdfir_stack_certs_dir }}/ca/ca.csr"
        privatekey_path: "{{ dxdfir_stack_certs_dir }}/ca/ca.key"
        common_name: "DX_DFIR {{ dxdfir_stack_name }} CA"
        basic_constraints: ["CA:TRUE"]
        basic_constraints_critical: true
        key_usage: [keyCertSign, cRLSign]
        key_usage_critical: true
        mode: "0644"

    - name: "stack-certs | self-signed CA certificate"
      community.crypto.x509_certificate:
        path: "{{ dxdfir_stack_certs_dir }}/ca/ca.crt"
        csr_path: "{{ dxdfir_stack_certs_dir }}/ca/ca.csr"
        privatekey_path: "{{ dxdfir_stack_certs_dir }}/ca/ca.key"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
        mode: "0644"

# ---- the instance certificates: same instances/SANs as the compose-era
# certutil, so imported certs verify as already-correct; weakening keys is
# never silent — an unprivileged deploy must OPT IN before 0644 keys
- name: "stack-certs | assert the key posture is deliberate"
  ansible.builtin.assert:
    that:
      - (ansible_facts.effective_user_id | default(-1)) | int == 0
        or dxdfir_stack_allow_world_readable_keys | bool
    fail_msg: >-
      an unprivileged deploy cannot hold the node TLS keys at root:root 0640
      (the service containers read them as gid 0), and this role does not
      write world-readable keys without an explicit opt-in. Deploy as root —
      or set dxdfir_stack_allow_world_readable_keys=true to accept 0644 node
      keys under {{ dxdfir_stack_certs_dir }}.
    quiet: true

- name: "stack-certs | instance private keys"
  community.crypto.openssl_privatekey:
    path: "{{ dxdfir_stack_certs_dir }}/{{ item.name }}/{{ item.name }}.key"
    # containers read as uid 1000 gid 0: root deploy = root:root 0640; unprivileged cannot chown gid 0, so 0644 (opted in)
    owner: "{{ 'root' if _root | bool else omit }}"
    group: "{{ 'root' if _root | bool else omit }}"
    mode: "{{ '0640' if _root | bool else '0644' }}"
  vars:
    _root: "{{ (ansible_facts.effective_user_id | default(-1)) | int == 0 }}"
  loop: &dxdfir_stack_tls_instances
    - name: es01
      dns: [elasticsearch, es01, localhost]
    - name: fleet-server
      dns: [fleet-server, localhost]
  loop_control:
    label: "{{ item.name }}"

- name: "stack-certs | instance signing requests"
  community.crypto.openssl_csr:
    path: "{{ dxdfir_stack_certs_dir }}/{{ item.name }}/{{ item.name }}.csr"
    privatekey_path: "{{ dxdfir_stack_certs_dir }}/{{ item.name }}/{{ item.name }}.key"
    common_name: "{{ item.name }}"
    subject_alt_name: >-
      {{ item.dns | map('regex_replace', '^', 'DNS:') | list + ['IP:127.0.0.1'] }}
    mode: "0644"
  loop: *dxdfir_stack_tls_instances
  loop_control:
    label: "{{ item.name }}"

- name: "stack-certs | instance certificates signed by the CA"
  community.crypto.x509_certificate:
    path: "{{ dxdfir_stack_certs_dir }}/{{ item.name }}/{{ item.name }}.crt"
    csr_path: "{{ dxdfir_stack_certs_dir }}/{{ item.name }}/{{ item.name }}.csr"
    provider: ownca
    ownca_path: "{{ dxdfir_stack_certs_dir }}/ca/ca.crt"
    ownca_privatekey_path: "{{ dxdfir_stack_certs_dir }}/ca/ca.key"
    ownca_not_after: "+1095d"
    mode: "0644"
  loop: *dxdfir_stack_tls_instances
  loop_control:
    label: "{{ item.name }}"

# imported material arrives with container-side ownership — pin the tree to the store's posture
- name: "stack-certs | find every private key in the tree"
  ansible.builtin.find:
    paths: "{{ dxdfir_stack_certs_dir }}"
    patterns: ["*.key"]
    recurse: true
  register: dxdfir_stack_cert_keys

- name: "stack-certs | protected private keys"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ 'root' if _root | bool else omit }}"
    group: "{{ 'root' if _root | bool else omit }}"
    mode: >-
      {{ '0600' if (item.path | basename) == 'ca.key'
         else ('0640' if _root | bool else '0644') }}
  vars:
    _root: "{{ (ansible_facts.effective_user_id | default(-1)) | int == 0 }}"
  loop: "{{ dxdfir_stack_cert_keys.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: "stack-certs | note the unprivileged key posture"
  ansible.builtin.debug:
    msg: >-
      unprivileged deploy: the node TLS keys under
      {{ dxdfir_stack_certs_dir }} are world-readable (0644) so the service
      containers (uid 1000, gid 0) can read them through the bind mount.
      Deploy as root to hold them at root:root 0640.
  when: (ansible_facts.effective_user_id | default(-1)) | int != 0

- name: "stack-certs | find every certificate in the tree"
  ansible.builtin.find:
    paths: "{{ dxdfir_stack_certs_dir }}"
    patterns: ["*.crt", "*.csr"]
    recurse: true
  register: dxdfir_stack_cert_certs

- name: "stack-certs | world-readable certificates"
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0644"
  loop: "{{ dxdfir_stack_cert_certs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
