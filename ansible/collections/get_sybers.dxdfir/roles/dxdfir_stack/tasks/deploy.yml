---
# Bring-up from inventory data in bootstrap order (compose's depends_on as
# explicit waits). Thin: each stage is its own file, imported statically so the
# stages stay visible to --list-tasks (§24); the role ACTS in order, the
# playbook DECIDES the action (§5). The rescue around the service bring-up
# surfaces the failed step with the live container states.

- name: "stack-deploy | the secret store"
  ansible.builtin.import_tasks: secrets.yml

# Escalate the WHOLE TLS key lifecycle, not just the final chown: the CSR task
# reads each node key and the signing task reads the CA key, so if creation
# escalates but the reads do not they hit root:root 0640/0600 files as the
# unprivileged user and fail. __dxdfir_stack_escalate is false when already root
# (no double sudo) or when dxdfir_stack_become is unset (a direct playbook run
# that did not opt in; the assert then governs the key posture). become on a
# static import propagates to every imported task, same as the old apply form.
- name: "stack-deploy | the TLS material"
  ansible.builtin.import_tasks: certs.yml
  become: "{{ __dxdfir_stack_escalate }}"

- name: "stack-deploy | network, volumes and images"
  ansible.builtin.import_tasks: deploy_prepare.yml

- name: "stack-deploy | bring the services up in bootstrap order"
  block:
    - name: "stack-deploy | elasticsearch"
      ansible.builtin.import_tasks: deploy_elasticsearch.yml

    # the compose setup-service's security objects, reconciled read-first
    - name: "stack-deploy | the security objects"
      ansible.builtin.import_tasks: deploy_security.yml

    - name: "stack-deploy | kibana"
      ansible.builtin.import_tasks: deploy_kibana.yml

    # the config tree (pipelines, templates, saved objects) lands before
    # filebeat ever writes, so the streams' first document is already routed
    - name: "stack-deploy | the ingest config tree"
      ansible.builtin.import_tasks: deploy_ingest.yml

    # filebeat needs only elasticsearch (and the config tree above), so it
    # comes up before fleet-server: a fleet enrolment failure must never
    # leave the evidence ingest down
    - name: "stack-deploy | filebeat"
      ansible.builtin.import_tasks: deploy_filebeat.yml

    - name: "stack-deploy | fleet-server"
      ansible.builtin.import_tasks: deploy_fleet.yml
  rescue:
    - name: "stack-deploy | read the stack's state for the diagnostic"
      community.docker.docker_host_info:
        containers: true
        containers_all: true
        containers_filters:
          label: "{{ dxdfir_stack_label_key }}={{ dxdfir_stack_name }}"
      register: __dxdfir_stack_failed_state
      failed_when: false

    - name: "stack-deploy | the bring-up failed — one diagnostic"
      ansible.builtin.fail:
        msg: >-
          stack bring-up failed at
          "{{ ansible_failed_task.name | default('a bring-up step') }}".
          Container state:
          {{ __dxdfir_stack_failed_state['containers'] | default([])
             | map(attribute='Names') | flatten | zip(
               __dxdfir_stack_failed_state['containers'] | default([])
               | map(attribute='Status'))
             | map('join', ': ') | list | join('; ') | default('none', true) }}.
          Inspect the failing container's logs (docker logs <name>), fix,
          and rerun — the deploy converges; nothing needs tearing down
          first.

- name: "stack-deploy | ensure the stack is up"
  ansible.builtin.import_tasks: ensure_running.yml
