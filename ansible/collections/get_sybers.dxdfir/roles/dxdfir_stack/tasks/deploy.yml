---
# Bring the stack up. The stack uses prebuilt images, so it is brought up
# directly and verified.
- name: "stack-deploy | bring up the elastic stack"
  community.docker.docker_compose_v2:
    project_src: "{{ dxdfir_stack_compose_dir }}"
    env_files:
      - "{{ dxdfir_stack_env_file }}"
    build: "{{ 'always' if dxdfir_stack_build | bool else 'never' }}"
    state: present
  register: dxdfir_stack_up

# Verify (and self-heal) the bring-up through the shared container-up gate — the
# same idempotent gate start and any live-stack consumer use.
- name: "stack-deploy | ensure the stack is up"
  ansible.builtin.include_tasks: ensure_running.yml
