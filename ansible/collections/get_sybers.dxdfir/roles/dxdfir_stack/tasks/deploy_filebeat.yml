---
# filebeat: tails the processed tree into logs-dxdfir.<type>-<namespace>. Last up
# — it needs Elasticsearch accepting its output. Runs as root to read the
# operator-delivered files; the ingest mount is read-only.

- name: "stack-deploy | filebeat container"
  community.docker.docker_container:
    name: "{{ dxdfir_stack_containers['filebeat'] }}"
    image: "{{ dxdfir_stack_images['filebeat'] }}"
    state: started
    user: root
    # beats 9 parses flags with cobra: the single-dash `-environment container`
    # spelling is read as a positional command and refuses to start
    command: ["-e", "--strict.perms=false", "--environment=container"]
    labels: "{{ dxdfir_stack_labels }}"
    networks:
      - name: "{{ dxdfir_stack_network }}"
        aliases: [filebeat]
    env:
      ELASTICSEARCH_HOSTS: "https://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: "{{ dxdfir_stack_elastic_password }}"
      DFIR_NAMESPACE: "{{ dxdfir_stack_namespace }}"
    volumes:
      - "{{ dxdfir_stack_config_dir }}/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"
      - "{{ dxdfir_stack_certs_dir }}:/certs:ro"
      - "{{ dxdfir_stack_ingest_dir }}:/ingest:ro"
      - "{{ dxdfir_stack_volumes['filebeatdata'] }}:/usr/share/filebeat/data"
    healthcheck:
      test: ["CMD", "filebeat", "test", "output", "--strict.perms=false"]
      interval: 60s
      timeout: 30s
      retries: 5
  no_log: true
