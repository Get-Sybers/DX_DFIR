---
# Everything the services need in place before any container starts: compose-era
# containers are retired first (their byakugan_* DATA volumes are NEVER touched),
# then the network, the data volumes, the ingest tree filebeat tails, and the
# image pull. All idempotent, so a rerun converges.

- name: "stack-deploy | retire compose-era containers (volumes survive)"
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop: "{{ __dxdfir_stack_legacy_containers | default([]) }}"

- name: "stack-deploy | the stack's network"
  community.docker.docker_network:
    name: "{{ dxdfir_stack_network }}"
    labels: "{{ dxdfir_stack_labels }}"

- name: "stack-deploy | the stack's data volumes"
  community.docker.docker_volume:
    name: "{{ item }}"
    labels: "{{ dxdfir_stack_labels }}"
  loop:
    - "{{ dxdfir_stack_volumes['esdata'] }}"
    - "{{ dxdfir_stack_volumes['kibanadata'] }}"
    - "{{ dxdfir_stack_volumes['fleetdata'] }}"
    - "{{ dxdfir_stack_volumes['filebeatdata'] }}"

- name: "stack-deploy | the ingest tree filebeat tails exists"
  ansible.builtin.file:
    path: "{{ dxdfir_stack_ingest_dir }}"
    state: directory
    mode: "0755"

- name: "stack-deploy | the stack's images are local"
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
  loop: "{{ dxdfir_stack_images.values() | unique | list }}"
  register: __dxdfir_stack_pull
  retries: 3
  delay: 5
  until: __dxdfir_stack_pull is not failed
