---
# The compose setup-service's security objects, reconciled read-first against the
# live API so a rerun is idempotent and never relies on a stored password:
#   - kibana_system's password (the built-in user Kibana authenticates as);
#   - the logs_car_writer role and byakugan_loader user, whose DEFINITIONS are
#     data (vars/main.yml: dxdfir_stack_security_roles / _users) — this file only
#     reconciles whatever those lists declare.

- name: "stack-deploy | does kibana_system already hold its password"
  ansible.builtin.uri:
    url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_security/_authenticate"
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: kibana_system
    url_password: "{{ dxdfir_stack_kibana_system_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: __dxdfir_stack_kibana_system_auth
  changed_when: false
  no_log: true

- name: "stack-deploy | set the kibana_system password"
  ansible.builtin.uri:
    url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_security/user/kibana_system/_password"
    method: POST
    ca_path: "{{ dxdfir_stack_ca_file }}"
    url_username: elastic
    url_password: "{{ dxdfir_stack_elastic_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ dxdfir_stack_kibana_system_password }}"
    status_code: [200]
  register: __dxdfir_stack_kibana_system_set
  until: __dxdfir_stack_kibana_system_set['status'] == 200
  retries: 6
  delay: 5
  changed_when: true
  when: __dxdfir_stack_kibana_system_auth['status'] == 401
  no_log: true

# the CAR loader role — least-privilege, its body is dxdfir_stack_security_roles
- name: "stack-deploy | reconcile the least-privilege CAR loader role"
  vars:
    _role: "{{ dxdfir_stack_security_roles | first }}"
    _idx: "{{ _role['indices'] | first }}"
  block:
    - name: "stack-deploy | read the live CAR loader role {{ _role['name'] }}"
      ansible.builtin.uri:
        url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_security/role/{{ _role['name'] }}"
        ca_path: "{{ dxdfir_stack_ca_file }}"
        url_username: elastic
        url_password: "{{ dxdfir_stack_elastic_password }}"
        force_basic_auth: true
        status_code: [200, 404]
      register: __dxdfir_stack_car_role
      changed_when: false
      no_log: true

    - name: "stack-deploy | converge the least-privilege CAR loader role {{ _role['name'] }}"
      ansible.builtin.uri:
        url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_security/role/{{ _role['name'] }}"
        method: PUT
        ca_path: "{{ dxdfir_stack_ca_file }}"
        url_username: elastic
        url_password: "{{ dxdfir_stack_elastic_password }}"
        force_basic_auth: true
        body_format: json
        body:
          indices: "{{ _role['indices'] }}"
        status_code: [200]
      vars:
        _live: "{{ (__dxdfir_stack_car_role['json'] | default({}))[_role['name']] | default({}) }}"
        _live_first: "{{ (_live['indices'] | default([{}])) | first | default({}) }}"
      when: >-
        __dxdfir_stack_car_role['status'] == 404
        or (_live_first['names'] | default([]) | sort) != (_idx['names'] | sort)
        or (_live_first['privileges'] | default([]) | sort)
           != (_idx['privileges'] | sort)
      changed_when: true
      no_log: true

# the loader user bound to that role — its body is dxdfir_stack_security_users
- name: "stack-deploy | reconcile the CAR loader user"
  vars:
    _user: "{{ dxdfir_stack_security_users | first }}"
  block:
    - name: "stack-deploy | check whether the loader already authenticates as {{ _user['name'] }}"
      ansible.builtin.uri:
        url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_security/_authenticate"
        ca_path: "{{ dxdfir_stack_ca_file }}"
        url_username: "{{ _user['name'] }}"
        url_password: "{{ _user['password'] }}"
        force_basic_auth: true
        status_code: [200, 401]
      register: __dxdfir_stack_loader_auth
      changed_when: false
      no_log: true

    - name: "stack-deploy | converge the CAR loader user {{ _user['name'] }}"
      ansible.builtin.uri:
        url: "https://{{ dxdfir_stack_bind }}:{{ dxdfir_stack_es_port }}/_security/user/{{ _user['name'] }}"
        method: PUT
        ca_path: "{{ dxdfir_stack_ca_file }}"
        url_username: elastic
        url_password: "{{ dxdfir_stack_elastic_password }}"
        force_basic_auth: true
        body_format: json
        body:
          password: "{{ _user['password'] }}"
          roles: "{{ _user['roles'] }}"
          full_name: "{{ _user['full_name'] }}"
        status_code: [200]
      when: __dxdfir_stack_loader_auth['status'] == 401
      changed_when: true
      no_log: true
