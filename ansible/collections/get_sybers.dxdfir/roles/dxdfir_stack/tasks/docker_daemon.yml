---
# The daemon: re-probe after any install, start it on the up-verbs (deploy/start),
# and answer a still-down daemon with the absence decision (report+end / fail).
# Ends with the definitive probe the callers read.

- name: "stack-docker | re-probe the daemon after the install"
  ansible.builtin.command:
    argv: [docker, version]
  register: __dxdfir_stack_docker
  changed_when: false
  failed_when: false
  when: not __dxdfir_stack_docker_up | bool

- name: "stack-docker | refresh the engine facts"
  ansible.builtin.set_fact:
    __dxdfir_stack_docker_up: "{{ (__dxdfir_stack_docker['rc'] | default(1)) == 0 }}"
  when: not __dxdfir_stack_docker_up | bool

- name: "stack-docker | start the daemon (deploy/start's opt-in)"
  become: "{{ __dxdfir_stack_escalate }}"
  when:
    - dxdfir_stack_start_docker | bool
    - not __dxdfir_stack_docker_up | bool
  block:
    - name: "stack-docker | docker service started and enabled"
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # A started unit can take a moment to open its socket.
    - name: "stack-docker | wait for the started daemon to answer"
      ansible.builtin.command:
        argv: [docker, version]
      register: __dxdfir_stack_docker
      changed_when: false
      until: __dxdfir_stack_docker['rc'] == 0
      retries: 15
      delay: 2

    - name: "stack-docker | the daemon is up"
      ansible.builtin.set_fact:
        __dxdfir_stack_docker_up: true
  rescue:
    # no service manager: the daemon may still be startable by hand — say so
    - name: "stack-docker | the daemon could not be started"
      ansible.builtin.fail:
        msg: >-
          the docker daemon is not running and starting the docker service
          failed ({{ ansible_failed_result.msg | default('see above') }}).
          Start the daemon manually (systemctl start docker, or dockerd on a
          host without systemd) and rerun.

- name: "stack-docker | report the stopped daemon and end"
  when:
    - dxdfir_stack_when_absent == 'report'
    - not __dxdfir_stack_docker_up | bool
  block:
    - name: "stack-docker | the daemon is not running"
      ansible.builtin.debug:
        msg: >-
          docker is installed but its daemon is not running, so the stack's
          state cannot be read. Start it (systemctl start docker) or run
          `dxdfir deploy stack` / `dxdfir start stack`, which start it.

    - name: "stack-docker | end the play for this host"
      ansible.builtin.meta: end_host

- name: "stack-docker | flag the stopped daemon"
  ansible.builtin.assert:
    that:
      - __dxdfir_stack_docker_up | bool
    fail_msg: >-
      cannot {{ dxdfir_stack_action }}: docker is installed but its daemon is
      not running. Start it (systemctl start docker) and rerun — or
      `dxdfir deploy stack` / `dxdfir start stack`, which start it.
    quiet: true
  when: dxdfir_stack_when_absent == 'fail'

- name: "stack-docker | the daemon answers"
  ansible.builtin.command:
    argv: [docker, version]
  register: __dxdfir_stack_docker
  changed_when: false
