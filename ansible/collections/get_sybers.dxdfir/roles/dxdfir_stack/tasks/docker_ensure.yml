---
# The engine gate — facts first; an absent engine is answered by the same
# playbook decision as an absent stack (README "Reusable entry points"). Thin:
# this entry DECIDES (privilege posture, engine detection, the absence gate) and
# the per-stage files ACT — install, group, daemon — in order.

# Privilege decision, computed here because this file is a reusable entry point:
# preflight.yml runs it first for every stack action, and dxdfir-bootstrap.yml
# runs it directly (tasks_from: docker_ensure) — so neither it nor the later TLS
# tasks in certs.yml can assume preflight set these. gather_facts runs as the
# connection user (unprivileged), so effective_user_id stays that user even when
# a task escalates via become — the posture keys off the REQUEST
# (dxdfir_stack_become), NOT effective_user_id. The root check is re-inlined per
# fact: sibling set_fact keys cannot reliably reference each other in one task.
# Stays in this entry (never behind a dynamic include) so `tags: [always]` holds.
- name: "stack-docker | privilege decision facts"
  ansible.builtin.set_fact:
    # escalate per-task only when asked AND not already root (no double sudo)
    dxdfir_stack_escalate: >-
      {{ (dxdfir_stack_become | bool)
         and not ((ansible_facts.effective_user_id | default(-1)) | int == 0) }}
    # drives the root:root 0640 key posture + the opt-in assert
    dxdfir_stack_privileged: >-
      {{ ((ansible_facts.effective_user_id | default(-1)) | int == 0)
         or (dxdfir_stack_become | bool) }}
    # the human operator to add to the docker group — correct under BOTH
    # `sudo dx …` (SUDO_USER is the operator) and an escalating `dx deploy stack`
    # (SUDO_USER is empty at gather time, so fall back to the connection user)
    dxdfir_stack_operator: >-
      {{ ansible_facts.env.SUDO_USER
         if (ansible_facts.env.SUDO_USER | default('')) not in ['', 'root']
         else (ansible_facts.user_id | default('')) }}
  tags: [always]

- name: "stack-docker | is the docker cli on this host"
  ansible.builtin.command:
    argv: [which, docker]
  register: dxdfir_stack_docker_cli
  changed_when: false
  failed_when: false

- name: "stack-docker | does the daemon answer"
  ansible.builtin.command:
    argv: [docker, version]
  register: dxdfir_stack_docker
  changed_when: false
  failed_when: false
  when: dxdfir_stack_docker_cli.rc == 0

- name: "stack-docker | the engine's state as facts"
  ansible.builtin.set_fact:
    dxdfir_stack_docker_installed: "{{ dxdfir_stack_docker_cli.rc == 0 }}"
    dxdfir_stack_docker_up: >-
      {{ dxdfir_stack_docker_cli.rc == 0
         and (dxdfir_stack_docker.rc | default(1)) == 0 }}

# ---- no engine: no stack can exist here ------------------------------------
- name: "stack-docker | report the engine-less host and end"
  when:
    - dxdfir_stack_when_absent == 'report'
    - not dxdfir_stack_docker_installed | bool
  block:
    - name: "stack-docker | no docker engine on this host"
      ansible.builtin.debug:
        msg: >-
          no docker engine on this host — no analysis stack can exist here.
          `dxdfir deploy stack` installs the engine (Debian/Ubuntu families,
          Docker's own apt repository) and deploys the stack.

    - name: "stack-docker | end the play for this host"
      ansible.builtin.meta: end_host

- name: "stack-docker | flag the engine-less host"
  ansible.builtin.assert:
    that:
      - dxdfir_stack_docker_installed | bool
    fail_msg: >-
      nothing to {{ dxdfir_stack_action }}: no docker engine on this host, so
      no analysis stack can exist here. Deploy first: dxdfir deploy stack
      (installs the engine on Debian/Ubuntu families).
    quiet: true
  when: dxdfir_stack_when_absent == 'fail'

# ---- the engine present, grouped and running (each stage self-gates) -------
- name: "stack-docker | ensure the engine is installed"
  ansible.builtin.include_tasks: docker_install.yml

- name: "stack-docker | ensure the docker group and operator membership"
  ansible.builtin.include_tasks: docker_group.yml

- name: "stack-docker | ensure the daemon is running"
  ansible.builtin.include_tasks: docker_daemon.yml
