---
# dxdfir_stack: analysis-stack lifecycle. The role GROUPS; the playbook DECIDES
# the action + stack. Idempotence comes from compose semantics, not a `when:`.

- name: "stack | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_stack_action in ['deploy', 'destroy', 'start', 'stop', 'status']
      - dxdfir_stack_name in ['elastic', 'sofelk']
    fail_msg: >-
      dxdfir_stack needs dxdfir_stack_action (deploy|destroy|start|stop|status)
      and dxdfir_stack_name (elastic|sofelk).
    quiet: true
  tags: [always]

- name: "stack | preflight"
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags: [always]
  tags: [always]

- name: "stack | run the lifecycle action | {{ dxdfir_stack_action }}"
  ansible.builtin.include_tasks: "{{ dxdfir_stack_action }}.yml"
