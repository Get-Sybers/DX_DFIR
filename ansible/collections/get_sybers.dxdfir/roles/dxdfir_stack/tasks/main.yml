---
# dxdfir_stack: analysis-stack lifecycle. The role GROUPS; the playbook DECIDES
# the action. Idempotence comes from state modules converging, not a `when:`.

- name: "stack-main | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_stack_action in ['deploy', 'destroy', 'start', 'stop', 'status']
    fail_msg: >-
      dxdfir_stack needs dxdfir_stack_action (deploy|destroy|start|stop|status).
    quiet: true
  tags: [always]

# static import so preflight's tasks are visible to --list-tasks (§24); tags
# propagate to the imported tree, so preflight still always runs
- name: "stack-main | preflight"
  ansible.builtin.import_tasks: preflight.yml
  tags: [always]

# the ONE genuinely dynamic include: the file is chosen at run time from the
# action, so it cannot be a static import (§24)
- name: "stack-main | run the lifecycle action: {{ dxdfir_stack_action }}"
  ansible.builtin.include_tasks: "{{ dxdfir_stack_action }}.yml"
