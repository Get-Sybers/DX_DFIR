---
# facts before touching the stack; the engine gate comes first

# Privilege decision, set once for every action. gather_facts runs as the
# connection user (unprivileged), so effective_user_id stays that user even when
# a later task escalates via become — the posture must key off the request
# (dxdfir_stack_become), NOT effective_user_id, or escalated tasks still write
# 0644 / omit the root owner. See roles/dxdfir_stack/README.md "Secrets and TLS".
- name: "stack-preflight | privilege decision facts"
  ansible.builtin.set_fact:
    # escalate per-task only when asked AND not already root (no double sudo).
    # The root check is re-inlined in each fact rather than referencing a sibling
    # key — sibling set_fact keys cannot reliably see each other within one task.
    _dxdfir_become: >-
      {{ (dxdfir_stack_become | bool)
         and not ((ansible_facts.effective_user_id | default(-1)) | int == 0) }}
    # drives the root:root 0640 key posture + the opt-in assert
    _dxdfir_privileged: >-
      {{ ((ansible_facts.effective_user_id | default(-1)) | int == 0)
         or (dxdfir_stack_become | bool) }}
    # the human operator to add to the docker group — correct under BOTH
    # `sudo dx …` (SUDO_USER is the operator) and an escalating `dx deploy stack`
    # (SUDO_USER is empty at gather time, so fall back to the connection user)
    _dxdfir_operator: >-
      {{ ansible_facts.env.SUDO_USER
         if (ansible_facts.env.SUDO_USER | default('')) not in ['', 'root']
         else (ansible_facts.user_id | default('')) }}
  tags: [always]

- name: "stack-preflight | ensure the docker engine"
  ansible.builtin.include_tasks: docker_ensure.yml

# presence answers by label — the role's own AND the compose-era project label
- name: "stack-preflight | read the stack's containers and volumes"
  community.docker.docker_host_info:
    containers: true
    containers_all: true
    containers_filters:
      label: "{{ dxdfir_stack_label_key }}={{ dxdfir_stack_name }}"
    volumes: true
    volumes_filters:
      label: "{{ dxdfir_stack_label_key }}={{ dxdfir_stack_name }}"
  register: dxdfir_stack_host_info

- name: "stack-preflight | read the compose-era containers and volumes"
  community.docker.docker_host_info:
    containers: true
    containers_all: true
    containers_filters:
      label: "com.docker.compose.project={{ dxdfir_stack_legacy_project }}"
    volumes: true
    volumes_filters:
      label: "com.docker.compose.project={{ dxdfir_stack_legacy_project }}"
  register: dxdfir_stack_legacy_info

- name: "stack-preflight | is any of the stack present here"
  ansible.builtin.set_fact:
    dxdfir_stack_owned_containers: "{{ _owned }}"
    dxdfir_stack_legacy_containers: "{{ _legacy }}"
    dxdfir_stack_has_containers: "{{ (_owned + _legacy) | length > 0 }}"
    dxdfir_stack_has_volumes: "{{ _volumes }}"
    dxdfir_stack_present: "{{ (_owned + _legacy) | length > 0 or _volumes }}"
  vars:
    _owned: >-
      {{ dxdfir_stack_host_info.containers | default([])
         | map(attribute='Names') | flatten | map('regex_replace', '^/', '') | list }}
    _legacy: >-
      {{ dxdfir_stack_legacy_info.containers | default([])
         | map(attribute='Names') | flatten | map('regex_replace', '^/', '') | list }}
    _volumes: >-
      {{ (dxdfir_stack_host_info.volumes | default([])
          + dxdfir_stack_legacy_info.volumes | default([])) | length > 0 }}

# the playbook decides what absence means (README "Actions and their playbook decisions")
- name: "stack-preflight | report the absent stack and end"
  when:
    - dxdfir_stack_when_absent == 'report'
    - not dxdfir_stack_present | bool
  block:
    - name: "stack-preflight | no analysis stack on this host"
      ansible.builtin.debug:
        msg: >-
          no analysis stack on this host: '{{ dxdfir_stack_name }}' has no
          containers and no data volumes (neither the
          {{ dxdfir_stack_label_key }} label nor the compose-era project
          label matches anything) — nothing has been deployed, or it was
          destroyed with its volumes removed. Deploy with: dxdfir deploy
          stack.

    - name: "stack-preflight | end the play for this host"
      ansible.builtin.meta: end_host

- name: "stack-preflight | flag the absent stack"
  ansible.builtin.assert:
    that:
      - dxdfir_stack_present | bool
    fail_msg: >-
      nothing to {{ dxdfir_stack_action }}: no analysis stack on this host —
      '{{ dxdfir_stack_name }}' has no containers and no data volumes.
      Deploy first: dxdfir deploy stack.
    quiet: true
  when: dxdfir_stack_when_absent == 'fail'

# pull-capacity gate: images still to pull -> measure -> reclaim once when
# short -> re-measure -> assert; a doomed pull becomes one clear failure
- name: "stack-preflight | pull-capacity gate"
  when: dxdfir_stack_pull_gate | bool
  block:
    - name: "stack-preflight | the images the stack runs"
      ansible.builtin.set_fact:
        dxdfir_stack_image_set: "{{ dxdfir_stack_images.values() | unique | list }}"

    - name: "stack-preflight | which of them are already local"
      community.docker.docker_image_info:
        name: "{{ dxdfir_stack_image_set }}"
      register: dxdfir_stack_local

    - name: "stack-preflight | the images still to pull"
      vars:
        # RepoTags is null on digest-only/untagged images — guard the pipeline
        _local_tags: >-
          {{ (dxdfir_stack_local.images | default([]))
             | map(attribute='RepoTags') | flatten | select('string') | list }}
      ansible.builtin.set_fact:
        dxdfir_stack_missing_images: >-
          {{ dxdfir_stack_image_set | difference(_local_tags) }}

    - name: "stack-preflight | gate the stores while a pull is coming"
      when: dxdfir_stack_missing_images | length > 0
      vars:
        dxdfir_stack_need_bytes: "{{ dxdfir_stack_min_free_gib | int * 1024 * 1024 * 1024 }}"
      block:
        - name: "stack-preflight | measure free space on the image stores"
          ansible.builtin.command:
            argv: ["df", "--output=avail", "--block-size=1", "{{ item }}"]
          loop: "{{ dxdfir_stack_image_store_paths }}"
          register: dxdfir_stack_df
          changed_when: false
          failed_when: false

        - name: "stack-preflight | the tightest store decides"
          ansible.builtin.set_fact:
            dxdfir_stack_free_bytes: "{{ (_avail | min) if _avail | length > 0 else -1 }}"
          vars:
            _avail: >-
              {{ dxdfir_stack_df.results | selectattr('rc', 'equalto', 0)
                 | map(attribute='stdout_lines') | map('last')
                 | map('trim') | map('int') | list }}

        - name: "stack-preflight | assert an image store was measurable"
          ansible.builtin.assert:
            that:
              - dxdfir_stack_free_bytes | int >= 0
            fail_msg: >-
              none of dxdfir_stack_image_store_paths
              ({{ dxdfir_stack_image_store_paths | join(', ') }}) exists on this
              host — point it at the docker data-root.
            quiet: true

        - name: "stack-preflight | reclaim docker space (self-heal, only when short)"
          community.docker.docker_prune:
            containers: true
            images: true
            images_filters:
              dangling: "{{ not (dxdfir_stack_reclaim_all_images | bool) }}"
            networks: true
            builder_cache: true
          register: dxdfir_stack_prune
          changed_when: >-
            (dxdfir_stack_prune.containers | default([]) | length
             + dxdfir_stack_prune.images | default([]) | length
             + dxdfir_stack_prune.networks | default([]) | length) > 0
            or (dxdfir_stack_prune.builder_cache_space_reclaimed | default(0) | int) > 0
          when: dxdfir_stack_free_bytes | int < dxdfir_stack_need_bytes | int

        - name: "stack-preflight | re-measure after the reclaim"
          ansible.builtin.command:
            argv: ["df", "--output=avail", "--block-size=1", "{{ item }}"]
          loop: "{{ dxdfir_stack_image_store_paths }}"
          register: dxdfir_stack_df
          changed_when: false
          failed_when: false
          when: dxdfir_stack_prune is not skipped

        - name: "stack-preflight | the tightest store, after the reclaim"
          ansible.builtin.set_fact:
            dxdfir_stack_free_bytes: "{{ (_avail | min) if _avail | length > 0 else -1 }}"
          vars:
            _avail: >-
              {{ dxdfir_stack_df.results | selectattr('rc', 'equalto', 0)
                 | map(attribute='stdout_lines') | map('last')
                 | map('trim') | map('int') | list }}
          when: dxdfir_stack_prune is not skipped

        - name: "stack-preflight | assert the stores can hold the pull"
          ansible.builtin.assert:
            that:
              - dxdfir_stack_free_bytes | int >= dxdfir_stack_need_bytes | int
            fail_msg: >-
              {{ dxdfir_stack_missing_images | length }} stack image(s) still to
              pull, but the tightest of {{ dxdfir_stack_image_store_paths | join(', ') }}
              has {{ ((dxdfir_stack_free_bytes | int) / 1073741824) | round(1) }} GiB free
              (dxdfir_stack_min_free_gib wants {{ dxdfir_stack_min_free_gib }}).
              The reclaim already ran — free space (docker system prune -a, drop
              stale build output/evidence, grow the disk) and rerun.
            success_msg: >-
              image stores clear the pull:
              {{ ((dxdfir_stack_free_bytes | int) / 1073741824) | round(1) }} GiB free
              >= {{ dxdfir_stack_min_free_gib }} GiB.
            quiet: true
