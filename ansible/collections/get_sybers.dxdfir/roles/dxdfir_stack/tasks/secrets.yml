---
# THE SECRET STORE (deploy only): the per-host directory every stack secret
# lives in — ansible/inventory/secrets/<host>/ — generated once, never
# overwritten, vault-overridable. FACTS AND IMPORT FIRST, then the variables
# are referenced (a still-missing secret materialises through its file-backed
# password lookup at that moment; an operator-overridden variable never
# materialises a file), then permissions are enforced and the elastic.env
# handoff for non-ansible consumers is rendered. Everything that could carry
# a value is no_log.

- name: "stack-secrets | look up the group the store is handed to"
  ansible.builtin.getent:
    database: group
    key: "{{ dxdfir_stack_secrets_group }}"
    fail_key: false

- name: "stack-secrets | the store's ownership as facts"
  ansible.builtin.set_fact:
    dxdfir_stack_secrets_root: "{{ (ansible_facts.effective_user_id | default(-1)) | int == 0 }}"
    dxdfir_stack_secrets_group_found: >-
      {{ (ansible_facts.getent_group | default({})).get(dxdfir_stack_secrets_group)
         is not none }}

# root:docker when deploying as root (docker-group operators read the
# credentials without sudo — the same trust boundary the compose-era .env
# had); private to the unprivileged deployer otherwise.
- name: "stack-secrets | the per-host secret store exists"
  ansible.builtin.file:
    path: "{{ dxdfir_stack_secrets_dir }}"
    state: directory
    owner: "{{ 'root' if dxdfir_stack_secrets_root | bool else omit }}"
    group: >-
      {{ dxdfir_stack_secrets_group
         if (dxdfir_stack_secrets_root | bool and dxdfir_stack_secrets_group_found | bool)
         else omit }}
    mode: "{{ '0750' if dxdfir_stack_secrets_root | bool else '0700' }}"

- name: "stack-secrets | generate, import and hand off"
  block:
    # COMPOSE-ERA IMPORT: an operator .env from the retired docker/elastic
    # stack is read once and its set values seeded into the store, so a
    # migrated host keeps the credentials its data volumes already know.
    # force: false — a secret already in the store always wins; placeholders
    # (`change-me`) and empty values never import. The .env itself is never
    # written and never required.
    - name: "stack-secrets | stat the compose-era .env"
      ansible.builtin.stat:
        path: "{{ dxdfir_stack_legacy_env_file }}"
      register: dxdfir_stack_legacy_env_stat

    - name: "stack-secrets | import compose-era secrets into the store"
      ansible.builtin.copy:
        content: "{{ _val }}"
        dest: "{{ dxdfir_stack_secrets_dir }}/{{ item.file }}"
        mode: "{{ '0640' if dxdfir_stack_secrets_root | bool else '0600' }}"
        owner: "{{ 'root' if dxdfir_stack_secrets_root | bool else omit }}"
        group: >-
          {{ dxdfir_stack_secrets_group
             if (dxdfir_stack_secrets_root | bool and dxdfir_stack_secrets_group_found | bool)
             else omit }}
        force: false
      vars:
        # The repo's shared dotenv dialect (go readElasticEnv, the python
        # readers): optional `export `, whitespace around `=`, one wrapping
        # quote pair stripped.
        _lines: "{{ lookup('ansible.builtin.file', dxdfir_stack_legacy_env_file).split('\n') }}"
        _val: >-
          {{ (_lines | select('match', '^\s*(export\s+)?' ~ item.key ~ '\s*=') | list
              | first | default('', true))
             | regex_replace('^\s*(export\s+)?' ~ item.key ~ '\s*=\s*', '')
             | trim
             | regex_replace('^"(.*)"$', '\g<1>')
             | regex_replace("^'(.*)'$", '\g<1>') }}
      loop:
        - {key: ELASTIC_PASSWORD, file: elastic_password}
        - {key: KIBANA_SYSTEM_PASSWORD, file: kibana_system_password}
        - {key: BYAKUGAN_LOADER_PASSWORD, file: byakugan_loader_password}
        - {key: KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY, file: kibana_saved_objects_key}
        - {key: KIBANA_SECURITY_ENCRYPTION_KEY, file: kibana_security_key}
        - {key: KIBANA_REPORTING_ENCRYPTION_KEY, file: kibana_reporting_key}
      when:
        - dxdfir_stack_legacy_env_stat.stat.exists
        - _val | length > 0
        - "'change-me' not in _val"
      no_log: true

    # Referencing the variables is what materialises any secret still
    # missing (its file-backed lookup generates the file); an empty value
    # here means the role was run bare, without the inventory layer.
    - name: "stack-secrets | every stack secret resolves"
      ansible.builtin.assert:
        that:
          - dxdfir_stack_elastic_password | length > 0
          - dxdfir_stack_kibana_system_password | length > 0
          - dxdfir_stack_byakugan_loader_password | length > 0
          - dxdfir_stack_kibana_saved_objects_key | length >= 32
          - dxdfir_stack_kibana_security_key | length >= 32
          - dxdfir_stack_kibana_reporting_key | length >= 32
        fail_msg: >-
          a stack secret is empty or too short — the inventory layer
          (playbooks/group_vars/all.yml, dxdfir_elastic_*) defines them;
          run through the stack playbooks, or set the dxdfir_elastic_*
          secrets yourself when using the role bare.
        quiet: true
      no_log: true

    # The lookup creates files under the caller's umask — pin them to the
    # store's posture.
    - name: "stack-secrets | find the store's secret files"
      ansible.builtin.find:
        paths: "{{ dxdfir_stack_secrets_dir }}"
        patterns:
          - elastic_password
          - kibana_system_password
          - byakugan_loader_password
          - kibana_saved_objects_key
          - kibana_security_key
          - kibana_reporting_key
      register: dxdfir_stack_secret_files

    - name: "stack-secrets | tight permissions on every secret file"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ 'root' if dxdfir_stack_secrets_root | bool else omit }}"
        group: >-
          {{ dxdfir_stack_secrets_group
             if (dxdfir_stack_secrets_root | bool and dxdfir_stack_secrets_group_found | bool)
             else omit }}
        mode: "{{ '0640' if dxdfir_stack_secrets_root | bool else '0600' }}"
      loop: "{{ dxdfir_stack_secret_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: "stack-secrets | render the elastic.env handoff"
      ansible.builtin.template:
        src: elastic.env.j2
        dest: "{{ dxdfir_stack_env_file }}"
        owner: "{{ 'root' if dxdfir_stack_secrets_root | bool else omit }}"
        group: >-
          {{ dxdfir_stack_secrets_group
             if (dxdfir_stack_secrets_root | bool and dxdfir_stack_secrets_group_found | bool)
             else omit }}
        mode: "{{ '0640' if dxdfir_stack_secrets_root | bool else '0600' }}"
      when: dxdfir_stack_write_env_file | bool
      no_log: true
  rescue:
    - name: "stack-secrets | the secret store failed — fail with the remedies"
      ansible.builtin.fail:
        msg: >-
          preparing the secret store {{ dxdfir_stack_secrets_dir }} failed
          ({{ ansible_failed_result.msg | default('see the failed task above') }}).
          Nothing is logged for secrecy; check the store's directory and file
          permissions, remove any half-imported file and rerun — or override
          the dxdfir_elastic_* secrets (host_vars/vault) to bypass generation.
