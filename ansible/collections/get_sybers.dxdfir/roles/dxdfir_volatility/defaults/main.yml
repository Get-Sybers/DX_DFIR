---

# Repo root is five levels up from this role
# (roles/dxdfir_volatility -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_volatility_repo_root: "{{ role_path }}/../../../../.."

# The memory subdir comes from the shared evidence taxonomy (evidence-taxonomy/),
# the one source of truth for where sort files evidence AND where this role reads
# it — the two can't drift.
dxdfir_volatility_memory_lane: >-
  {{ (lookup('file', dxdfir_volatility_repo_root ~ '/evidence-taxonomy/memory.yml',
  errors='ignore') | default('', true) | from_yaml).subdir }}
dxdfir_volatility_memory_dir: "{{ dxdfir_volatility_repo_root }}/data_store/raw/{{ dxdfir_volatility_memory_lane }}"
dxdfir_volatility_out_dir: "{{ dxdfir_volatility_repo_root }}/data_store/processed/volatility"
# Resolved output base for the selected pipeline. Override directly to send output
# to a custom location.
# Kernel symbol cache (mounted at /symbols). Windows plugins fetch ISF tables from
# the symbol servers on first use — pre-seed this on an isolated host.
dxdfir_volatility_symbols_dir: "{{ dxdfir_volatility_repo_root }}/data_store/dependencies/volatility3-symbols"
# The self-orchestrating, env-driven PIIAT-Mem image (Volatility 3 in-process via
# --native). ansible runs it directly — no processor module. Built from
# docker/GoDFIR-toolz/piiat-mem at the sources.yml pin (dxdfir build-docker).
dxdfir_volatility_image: "get-sybers/piiat-mem:latest"
# Allow the container network for ISF symbol fetch — the ONE legitimate network
# need; default fully offline (pre-seed the symbols dir instead).
dxdfir_volatility_symbols_online: false
dxdfir_volatility_force: false
# There is no processor module, but the shared image supply-chain guard still runs
# python3 -m get_sybers_dxdfir.images --require <image>, so the package must be on
# PYTHONPATH. In-repo runs use this; a deployed run installs the package instead.
dxdfir_volatility_python_path: "{{ dxdfir_volatility_repo_root }}/python"

# tasks/main.yml builds dxdfir_volatility_argv (the confined `docker run`) after
# stat'ing the evidence mount for its --group-add gid; it can't be a static default.
