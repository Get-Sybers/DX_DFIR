---
argument_specs:
  main:
    short_description: "memory images -> Volatility 3 per-plugin JSON Lines."
    description:
      - >-
        Discovers memory images under dxdfir_volatility_memory_dir and runs the CAR
        plugin set (via the container + custom jsonl_dfir renderer), writing one
        <plugin>.jsonl per image. Idempotent per plugin: a plugin whose valid .jsonl
        output already exists is skipped. Windows plugins need kernel symbols
        (outbound network on first use, or a pre-seeded dxdfir_volatility_symbols_dir).
    options:
      dxdfir_volatility_pipeline:
        type: str
        required: false
        default: elastic
        choices: [elastic, sofelk]
        description: "Which backend to target; selects the output destination."
      dxdfir_volatility_memory_dir:
        type: str
        required: false
        description: "Directory tree of memory images to process (recursed)."
      dxdfir_volatility_elastic_out_dir:
        type: str
        required: false
        description: "Elastic-path output dir (default data_store/processed/volatility)."
      dxdfir_volatility_sofelk_out_dir:
        type: str
        required: false
        description: "SOF-ELK-path output dir (delivered into SOF-ELK by dxdfir_ingest_sofelk)."
      dxdfir_volatility_out_dir:
        type: str
        required: false
        description: >-
          Resolved output base for the selected pipeline (defaults to the
          elastic/sofelk out dir per dxdfir_volatility_pipeline); override to send
          output to a custom location.
      dxdfir_volatility_symbols_dir:
        type: str
        required: false
        description: "Volatility 3 symbol cache (passed as --symbols-dir); pre-seed when offline."
      dxdfir_volatility_piiat_mem_dir:
        type: str
        required: false
        description: "PIIAT-Mem submodule dir (third_party/piiat-mem); the standalone Volatility tool the lane drives via its CLI."
      dxdfir_volatility_image:
        type: str
        required: false
        default: "get-sybers/volatility:latest"
        description: "Volatility 3 container image."
      dxdfir_volatility_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dxdfir package (in-repo/dev runs)."
      dxdfir_volatility_symbols_online:
        type: bool
        required: false
        default: false
        description: >-
          Allow the container network access for ISF symbol fetch (the one
          legitimate network need). Default fully offline — pre-seed the
          symbols dir instead.
      dxdfir_volatility_force:
        type: bool
        required: false
        default: false
        description: "Rerun plugins that already have valid output."
