---
argument_specs:
  main:
    short_description: "memory images -> per-plugin JSON Lines (flashback / MemProcFS)."
    description:
      - >-
        Discovers memory images under dxdfir_volatility_memory_dir and runs the CAR
        collector set (via the flashback container, a native MemProcFS engine — no
        Volatility, no Python), writing one <plugin>.jsonl per image plus car.db.
        Idempotent per collector: one whose valid .jsonl output already exists is
        skipped. Windows plugins need PDB symbols (outbound network on first use, or
        a pre-seeded dxdfir_volatility_symbols_dir).
    options:
      dxdfir_volatility_memory_dir:
        type: str
        required: false
        description: "Directory tree of memory images to process (recursed)."
      dxdfir_volatility_out_dir:
        type: str
        required: false
        description: "Output dir (default data_store/processed/volatility); override to send output to a custom location."
      dxdfir_volatility_symbols_dir:
        type: str
        required: false
        description: "PDB/symbol cache (mounted at /symbols); pre-seed when offline."
      dxdfir_volatility_image:
        type: str
        required: false
        default: "get-sybers/flashback:latest"
        description: "The self-orchestrating, env-driven flashback (MemProcFS) image the lane docker-runs directly."
      dxdfir_volatility_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dxdfir package (in-repo/dev runs)."
      dxdfir_volatility_symbols_online:
        type: bool
        required: false
        default: false
        description: >-
          Allow the container network access for PDB symbol fetch (the one
          legitimate network need). Default fully offline — pre-seed the
          symbols dir instead.
      dxdfir_volatility_force:
        type: bool
        required: false
        default: false
        description: "Rerun collectors that already have valid output."
