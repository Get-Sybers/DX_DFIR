---

dxdfir_zeek_repo_root: "{{ role_path }}/../../../../.."

# subdir from the shared evidence taxonomy (evidence-taxonomy/)
dxdfir_zeek_pcap_lane: >-
  {{ ((lookup('file', dxdfir_zeek_repo_root ~ '/evidence-taxonomy/pcaps.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('pcaps', true) }}
dxdfir_zeek_pcap_dir: "{{ dxdfir_zeek_repo_root }}/data_store/raw/{{ dxdfir_zeek_pcap_lane }}"
dxdfir_zeek_out_dir: "{{ dxdfir_zeek_repo_root }}/data_store/processed/zeek"
# one folder per capture; the contract the lane is driven from
dxdfir_zeek_contract: "{{ dxdfir_zeek_repo_root }}/docker/GoDFIR-toolz/zeek/contract.yml"
# empty = the contract's image; set to pin a digest
dxdfir_zeek_image: ""
# extra argv after -C -r <capture>; empty = zeek's default script set
dxdfir_zeek_scripts: ""
dxdfir_zeek_force: false
