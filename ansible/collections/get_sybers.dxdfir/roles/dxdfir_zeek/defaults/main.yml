---
# Discovery only — the run spec, contract and confinement live in the
# get_sybers.godfir_run.godfir_zeek lane (imported by URL). This role resolves
# WHERE the evidence is (data_store + evidence-taxonomy) and delegates.
dxdfir_zeek_repo_root: "{{ role_path }}/../../../../.."

# subdir from the shared evidence taxonomy (evidence-taxonomy/)
dxdfir_zeek_pcap_lane: >-
  {{ ((lookup('file', dxdfir_zeek_repo_root ~ '/evidence-taxonomy/pcaps.yml',
  errors='ignore') | default('', true) | from_yaml) or {}).subdir
  | default('pcaps', true) }}
dxdfir_zeek_pcap_dir: "{{ dxdfir_zeek_repo_root }}/data_store/raw/{{ dxdfir_zeek_pcap_lane }}"
# a collection-scoped run lands one level below the leaf: processed/zeek/<collection>/
dxdfir_zeek_collection: ""
dxdfir_zeek_out_dir: >-
  {{ dxdfir_zeek_repo_root }}/data_store/processed/zeek{{
  ('/' ~ dxdfir_zeek_collection) if dxdfir_zeek_collection | length > 0 else '' }}
# empty = the lane's contract image; set to pin a digest
dxdfir_zeek_image: ""
# extra argv after -C -r <capture>; empty = zeek's default script set
dxdfir_zeek_scripts: ""
dxdfir_zeek_force: false
