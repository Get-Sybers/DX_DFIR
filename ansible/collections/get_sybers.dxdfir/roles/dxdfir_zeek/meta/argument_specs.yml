---
argument_specs:
  main:
    short_description: "PCAPs -> Zeek JSON logs, for the Elastic-native or SOF-ELK pipeline."
    description:
      - >-
        Discovers captures under dxdfir_zeek_pcap_dir, runs the zeek container per
        capture (JSON, ISO-8601 timestamps), and writes one folder of *.json per
        capture. Idempotent: a capture whose output already exists is skipped.
    options:
      dxdfir_zeek_pipeline:
        type: str
        required: false
        default: elastic
        choices: [elastic, sofelk]
        description: "Which backend to target; selects the output destination."
      dxdfir_zeek_pcap_dir:
        type: str
        required: false
        description: "Directory tree of packet captures to process (recursed)."
      dxdfir_zeek_elastic_out_dir:
        type: str
        required: false
        description: "Elastic-path output dir (default data_store/processed/zeek)."
      dxdfir_zeek_sofelk_out_dir:
        type: str
        required: false
        description: "SOF-ELK-path output dir (delivered into SOF-ELK by dxdfir_ingest_sofelk)."
      dxdfir_zeek_out_dir:
        type: str
        required: false
        description: >-
          Resolved output base for the selected pipeline (defaults to the
          elastic/sofelk out dir per dxdfir_zeek_pipeline); override to send
          output to a custom location.
      dxdfir_zeek_image:
        type: str
        required: false
        default: "get-sybers/zeek:latest"
        description: "Zeek container image."
      dxdfir_zeek_python_path:
        type: str
        required: false
        description: "PYTHONPATH to the get_sybers_dxdfir package (in-repo/dev runs)."
      dxdfir_zeek_force:
        type: bool
        required: false
        default: false
        description: "Reprocess captures that already have output."
