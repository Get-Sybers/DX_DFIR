---
# dxdfir_zeek: discover the pcap tree (data_store/raw + evidence-taxonomy) and
# delegate the confined run to get_sybers.godfir_run.godfir_zeek (imported by URL
# into .ansible/collections). The role GROUPS; the playbook DECIDES.
- name: "zeek | assert inputs"
  ansible.builtin.assert:
    that:
      - dxdfir_zeek_pcap_dir | length > 0
    fail_msg: "dxdfir_zeek needs a non-empty dxdfir_zeek_pcap_dir."
    quiet: true
  tags: [always]

- name: "zeek | run the get-sybers zeek lane"
  ansible.builtin.include_role:
    name: get_sybers.godfir_run.godfir_zeek
  vars:
    godfir_zeek_pcap_dir: "{{ dxdfir_zeek_pcap_dir }}"
    godfir_zeek_out_dir: "{{ dxdfir_zeek_out_dir }}"
    godfir_zeek_image: "{{ dxdfir_zeek_image }}"
    godfir_zeek_scripts: "{{ dxdfir_zeek_scripts }}"
    godfir_zeek_force: "{{ dxdfir_zeek_force }}"
  tags: [always]
