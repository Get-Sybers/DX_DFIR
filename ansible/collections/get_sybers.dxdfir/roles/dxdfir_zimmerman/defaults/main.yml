---
# Backend to target; the playbook overrides this to select the pipeline.
dxdfir_zimmerman_pipeline: elastic

# Repo root is five levels up from this role
# (roles/dxdfir_zimmerman -> get_sybers.dxdfir -> collections -> ansible -> repo).
dxdfir_zimmerman_repo_root: "{{ role_path }}/../../../../.."

# Disk-image tree (E01/raw/img/dd/vmdk/vhd/vhdx/aff), recursed — same input
# family dxdfir_plaso reads, since this lane pulls its own artefact set out of the
# same evidence images.
dxdfir_zimmerman_input_dir: "{{ dxdfir_zimmerman_repo_root }}/data_store/raw/disk_images"
# VMware VM export folders (one per VM) — optional, mirrors dxdfir_plaso.
dxdfir_zimmerman_vm_dir: "{{ dxdfir_zimmerman_repo_root }}/data_store/raw/VM_files"
dxdfir_zimmerman_elastic_out_dir: "{{ dxdfir_zimmerman_repo_root }}/data_store/processed/zimmerman"
dxdfir_zimmerman_sofelk_out_dir: "{{ dxdfir_zimmerman_repo_root }}/data_store/processed/sofelk/zimmerman"
# Resolved output base for the selected pipeline — consumed by
# tasks/process.yml. Override directly to send output to a custom location.
dxdfir_zimmerman_out_dir: "{{ dxdfir_zimmerman_elastic_out_dir if dxdfir_zimmerman_pipeline == 'elastic' else dxdfir_zimmerman_sofelk_out_dir }}"
# The hardened in-repo Plaso image, used for artefact extraction (image_export.py)
# and the SRUM two-step (log2timeline.py/psort.py) — build with dxdfir-build-images.
dxdfir_zimmerman_plaso_image: "get-sybers/plaso:latest"
# Also extract from Volume Shadow Copies during artefact extraction.
dxdfir_zimmerman_vss: false
# In-repo runs use PYTHONPATH; a deployed run installs the package instead.
dxdfir_zimmerman_python_path: "{{ dxdfir_zimmerman_repo_root }}/python"
dxdfir_zimmerman_force: false

# The processor command argv, handed to the shared dxdfir_lane process step. This
# is the one genuinely per-lane piece; the run/verify/gate skeleton is shared.
dxdfir_zimmerman_argv: >-
  {{ ['python3', '-m', 'get_sybers_dxdfir.zimmerman',
  '--input-dir', dxdfir_zimmerman_input_dir,
  '--vm-dir', dxdfir_zimmerman_vm_dir,
  '--out-dir', dxdfir_zimmerman_out_dir,
  '--plaso-image', dxdfir_zimmerman_plaso_image]
  + (['--vss'] if dxdfir_zimmerman_vss | bool else [])
  + (['--force'] if dxdfir_zimmerman_force | bool else []) }}
