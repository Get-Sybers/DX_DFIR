---
# The default inventory (wired in ansible.cfg): the DFIR workstation itself,
# explicit instead of implicit-localhost. The dxdfir CLI passes its own
# `-i localhost,`; the playbooks behave identically under either because the
# shared wiring lives in playbook-adjacent group_vars
# (ansible/collections/get_sybers.dxdfir/playbooks/group_vars/all.yml),
# which load regardless of the inventory source.
#
# Remote or fleet targets slot in as more hosts/groups here (or as a dynamic
# inventory plugin config in this directory) and are selected per run with
# -e dxdfir_hosts=<pattern> [-e dxdfir_connection=ssh] — the playbooks
# already target "{{ dxdfir_hosts | default('localhost') }}".
all:
  children:
    dxdfir:
      hosts:
        localhost:
          ansible_connection: local
          # The interpreter running ansible-playbook — exactly what implicit
          # localhost used before this inventory existed. Its environment is
          # where the collection's module deps (requests for community.docker)
          # are installed; interpreter discovery can land on a different system
          # python without them.
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
