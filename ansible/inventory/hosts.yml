---
# The default inventory: the workstation itself. Remote targets slot in as
# more hosts/groups, selected with -e dxdfir_hosts=<pattern>
# [-e dxdfir_connection=ssh].
all:
  children:
    dxdfir:
      hosts:
        localhost:
          ansible_connection: local
          # the interpreter (the venv's python) is set playbook-adjacent —
          # playbooks/host_vars/localhost.yml — so it holds under the
          # front-end's `-i localhost,` too, not only under this file
