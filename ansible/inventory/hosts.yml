---
# The default inventory: the workstation itself. Remote targets slot in as
# more hosts/groups, selected with -e dxdfir_hosts=<pattern>
# [-e dxdfir_connection=ssh].
all:
  children:
    dxdfir:
      hosts:
        localhost:
          ansible_connection: local
          # the interpreter running ansible-playbook — its env holds the module deps;
          # interpreter discovery can land on a different python without them
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
