name: sof-elk

# SOF-ELK stack for DX_DFIR: Elasticsearch + the from-source SOF-ELK image
# (Logstash + Filebeat) + Kibana. Localhost-only, no security (dead-box analysis;
# retiring in favour of docker/elastic, which runs with security on). Point
# SOFELK_INGEST_DIR at the same path dxdfir_ingest_sofelk delivers to.

x-version: &version "${ELASTIC_VERSION:-9.4.3}"

services:
  elasticsearch:
    image: "docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.4.3}"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: {soft: -1, hard: -1}
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30

  sof-elk:
    build:
      context: .
      args:
        ELASTIC_VERSION: "${ELASTIC_VERSION:-9.4.3}"
        SOFELK_REF: "${SOFELK_REF:-main}"
    image: "get-sybers/sof-elk:${ELASTIC_VERSION:-9.4.3}"
    environment:
      - ES_HOSTS=elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - "${SOFELK_INGEST_DIR:-./ingest}:/logstash"
    ports:
      - "127.0.0.1:5044:5044"

  kibana:
    image: "docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.4.3}"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:5601:5601"

volumes:
  esdata:
