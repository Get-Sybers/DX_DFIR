# DX_DFIR shipper: /ingest (<type>/**/*.json[l]) straight into
# logs-dxdfir.<type>-<namespace> data streams; no Logstash. Per-type parsing
# happens cluster-side (elastic/pipelines/, wired as the streams'
# default_pipeline) — this file only discovers, decodes and routes.

filebeat.inputs:
  - type: filestream
    id: dxdfir-evidence
    enabled: true
    paths:
      - /ingest/*/**/*.json
      - /ingest/*/**/*.jsonl
    # CAR already lands ECS-projected in logs-car.* via `byakugan load` —
    # re-ingesting the raw stores here would compete with that projection;
    # the loader's own output is working state, not evidence. (filestream's
    # scanner option, not the removed log-input exclude_files.)
    prospector.scanner.exclude_files:
      - '^/ingest/byakugan/.*'
      - '^/ingest/byakugan-load/.*'
      # a lane's staging (the raw image exports the tools parse) is evidence,
      # not output: `_`-prefixed — processed/_extracted, and the older
      # windows_logs/_extracted_evtx and godfir-toolz/_extracted
      - '^/ingest/_[^/]*/.*'
      - '^/ingest/[^/]+/_extracted[^/]*/.*'
      # lane RUN SUMMARIES (what the dx CLI watches), not evidence — and their
      # own `log` key would clobber filebeat's log.file.path under
      # overwrite_keys, routing the rows to logs-dxdfir.misc-*
      # (every lane writes under <type>/<case>/...: the case is the first
      # segment after the type, the engine or tool the second)
      - '^/ingest/zeek/.*/zeek\.jsonl$'
      - '^/ingest/log2timeline/.*/(log2timeline|psort)\.jsonl$'
      - '^/ingest/detections/[^/]+/(suricata|hayabusa|yara)/[^/]+/(suricata|hayabusa|scan)\.jsonl$'
      - '^/ingest/windowlicker/[^/]+/goese/.*/goese\.jsonl$'
      # Zeek's http.log ships through the second input below
      - '^/ingest/zeek/.*/http\.json$'
    # File identity by inode+device, not by content fingerprint. Filebeat 9's
    # default fingerprint hashes the first 1024 bytes and treats two files that
    # start alike as ONE file, skipping the second ("points to an already known
    # ingest target") — Plaso timelines of different images routinely open with
    # the same event, and no prefix length is safe for a 3 GB timeline. The
    # ingest mount is a static read-only bind mount, so inode identity is
    # stable there. (Changing the identity invalidates the registry: the
    # operator's re-ingest wipes it anyway.)
    file_identity.native: ~
    prospector.scanner.fingerprint.enabled: false
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          overwrite_keys: true
          expand_keys: true
    processors:
      # the first directory under /ingest is the evidence type; it routes the data stream
      - dissect:
          tokenizer: "/ingest/%{labels.type}/%{?rest}"
          field: log.file.path
          target_prefix: ""

  # Zeek's http.log alone: its top-level `host` column (the HTTP Host header)
  # would be clobbered by Filebeat's own `host.name`, which libbeat writes over
  # whatever the record put at `host` after the parsers and the processors
  # have run (verified: a string `host` is gone by the time the event leaves
  # Filebeat, nothing in this file can rename it first). So this input decodes
  # the record under `zeek_http` instead; the zeek pipeline hoists it back to
  # the root and moves the Host header to url.domain
  # (elastic/pipelines/logs-dxdfir-zeek.json).
  - type: filestream
    id: dxdfir-zeek-http
    enabled: true
    paths:
      - /ingest/zeek/*/**/http.json
    prospector.scanner.exclude_files:
      - '^/ingest/_[^/]*/.*'
      - '^/ingest/[^/]+/_extracted[^/]*/.*'
    file_identity.native: ~
    prospector.scanner.fingerprint.enabled: false
    parsers:
      - ndjson:
          target: "zeek_http"
          add_error_key: true
          overwrite_keys: true
          expand_keys: true
    processors:
      - dissect:
          tokenizer: "/ingest/%{labels.type}/%{?rest}"
          field: log.file.path
          target_prefix: ""

# the logs-dxdfir index template (elastic/templates/) creates the streams;
# Filebeat manages neither templates nor ILM
setup.template.enabled: false
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOSTS:https://elasticsearch:9200}"]
  username: "${ELASTICSEARCH_USERNAME:elastic}"
  password: "${ELASTICSEARCH_PASSWORD}"
  ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  index: "logs-dxdfir.%{[labels.type]:misc}-${DFIR_NAMESPACE:default}"

logging.level: info
