# Forensic disk images (single-file). Lane subdir: disk_images/
#
# Raw/dd/img carry no header magic, so they are extension-only; content-typed
# formats (EWF/E01, QCOW) win by magic regardless of a mislabelled name.
name: disk_images
subdir: disk_images
ext: [.e01, .ex01, .aff, .aff4, .dd, .img, .001, .raw, .iso, .dmg, .toast]
signatures:
  - {hex: "45 56 46 09 0D 0A FF 00", offset: 0, ext: e01, desc: "EWF/Expert Witness (E01)"}
  - {hex: "45 56 46 32 0D 0A 81 00", offset: 0, ext: ex01, desc: "EWF2 (Ex01)"}
  - {hex: "51 46 49 FB", offset: 0, ext: qcow2, desc: "QCOW/QCOW2 disk image"}
  - {hex: "41 46 46", offset: 0, ext: aff, desc: "AFF advanced forensic format"}
  - {hex: "43 44 30 30 31", offset: 32769, ext: iso, desc: "ISO 9660 optical disc image (CD001, primary volume descriptor)"}
  - {hex: "43 44 30 30 31", offset: 34817, ext: iso, desc: "ISO 9660 optical disc image (CD001, at 0x8801)"}
  - {hex: "43 44 30 30 31", offset: 36865, ext: iso, desc: "ISO 9660 optical disc image (CD001, at 0x9001)"}
  - {hex: "6B 6F 6C 79", offset: -512, kind: "special:dmg-footer", ext: dmg, desc: "Apple DMG (koly trailer, last 512 bytes)"}
