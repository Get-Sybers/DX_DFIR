# ==============================================================================
# External source pins — the ONE place DX_DFIR's external git dependencies are
# versioned.
#
# Clone-at-build dependencies are pinned HERE: they are cloned + built into a
# hardened image at the commit below, so — having no gitlink — this file is the
# authoritative record of the commit DX_DFIR is tested against.
#
# Git SUBMODULES are pinned by their gitlink (.gitmodules + the tree entry); git
# manages that natively, so they are NOT given a sha here (it would drift). They
# are listed under `submodules:` only so this file is a complete inventory.
#
# To bump a clone-at-build pin: set `ref` to a full 40-hex sha (never a branch or
# tag, so builds are reproducible), then rebuild — `dxdfir build-docker` (or
# re-run scripts/setup-environment.sh). A PR touching this file triggers the
# smoke workflow, which runs the real pipeline against the new pin.
# ==============================================================================

# Clone-at-build: cloned + built into a hardened image at the pinned commit.
# byakugan reconstructs its object model from its own nested car +
# attack-datasources submodules at build time (recursive clone required).
byakugan:
  url: https://github.com/Get-Sybers/Byakugan
  ref: 72b6b629029587fd8b09711c05a44d28cc77e478
  consumed: "docker/GoDFIR-toolz/byakugan/Dockerfile (BYAKUGAN_REF build-arg)"

# flashback (pure-Go memory forensics on MemProcFS — no Volatility, no Python) —
# built into get-sybers/flashback in the GoDFIR-toolz submodule, cloned + built at
# this pin (-tags memprocfs), confined by the hardened image.
#
# NOTE: url points at the renamed repo (Get-Sybers/flashback). The rename is done in
# GitHub settings by the owner; GitHub redirects the old Get-Sybers/PIIAT-Mem URL to
# it, so builds keep working across the rename. Bump `ref` to the merged flashback
# commit once this branch lands on the default branch.
flashback:
  url: https://github.com/Get-Sybers/flashback
  ref: 1932c957090001687f37c22e5c9aa6513c99c022  # flashback branch HEAD; bump to the merged sha once landed
  consumed: "docker/GoDFIR-toolz/flashback/Dockerfile (FLASHBACK_REF build-arg)"

# Git submodules: pinned by their gitlink (.gitmodules). Inventory only.
submodules:
  godfir-toolz:
    url: https://github.com/Get-Sybers/GoDFIR-toolz
    path: docker/GoDFIR-toolz
